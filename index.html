<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malte Distribuidora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2e;--card:#161928;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --gold:#d4a017;--gold2:#f0c040;--gold3:#ffd96a;--goldl:rgba(212,160,23,0.12);
  --green:#27ae60;--greenl:rgba(39,174,96,0.12);
  --red:#c0392b;--redl:rgba(192,57,43,0.12);
  --blue:#2980b9;--bluel:rgba(41,128,185,0.12);
  --purple:#7d3c98;--purplel:rgba(125,60,152,0.12);
  --orange:#e67e22;--orangel:rgba(230,126,34,0.12);
  --text:#f0f2fa;--text2:#8a90b0;--text3:#4a5070;
  --radius:14px;--radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
input,button,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}

#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(212,160,23,0.15) 0%,transparent 60%);}
.login-box{background:var(--card);border:1px solid rgba(212,160,23,0.2);border-radius:20px;padding:44px 40px;width:380px;text-align:center;}
.login-brand-icon{width:64px;height:64px;background:var(--goldl);border:1px solid rgba(212,160,23,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;}
.login-brand h1{font-size:22px;font-weight:700;color:var(--gold2);}
.login-brand p{color:var(--text2);font-size:12px;margin-top:3px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{padding:11px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.role-btn.active{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.field input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:border 0.2s;}
.field input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0c12;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;margin-top:8px;transition:opacity 0.2s;}
.login-btn:hover{opacity:0.9;}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px;}

#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-logo{font-size:17px;font-weight:700;color:var(--gold2);}
.topbar-badge{background:var(--goldl);border:1px solid rgba(212,160,23,0.25);color:var(--gold3);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;cursor:pointer;color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.icon-btn:hover{border-color:var(--red);color:var(--red);}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;gap:2px;overflow-x:auto;}
.nav-btn{padding:13px 16px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;}
.nav-btn:hover{color:var(--text2);}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}
.content{flex:1;padding:24px 20px;max-width:1200px;margin:0 auto;width:100%;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:17px;font-weight:600;margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.8px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;}
.modal-field input:focus,.modal-field select:focus{border-color:var(--gold);}
.modal-field select option{background:var(--bg3);}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
.btn{padding:10px 20px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;}
.btn-primary{background:var(--gold);color:#0a0c12;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold2);}
.btn-secondary{background:var(--bg3);color:var(--text2);}
.btn-secondary:hover{color:var(--text);}
.btn-danger{background:var(--redl);color:var(--red);border-color:rgba(192,57,43,0.3);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{background:var(--greenl);color:var(--green);border-color:rgba(39,174,96,0.3);}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-orange{background:var(--orangel);color:var(--orange);border-color:rgba(230,126,34,0.3);}
.btn-orange:hover{background:var(--orange);color:#fff;}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-xs{padding:4px 10px;font-size:11px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.stat-value{font-size:24px;font-weight:700;line-height:1;}
.stat-sub{font-size:12px;color:var(--text3);margin-top:5px;}
.stat-gold .stat-value{color:var(--gold2);}
.stat-green .stat-value{color:var(--green);}
.stat-red .stat-value{color:var(--red);}
.stat-blue .stat-value{color:var(--blue);}
.stat-orange .stat-value{color:var(--orange);}

.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.section-title{font-size:15px;font-weight:600;}
.section-sub{font-size:12px;color:var(--text2);margin-top:2px;}

.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
th{padding:10px 14px;text-align:left;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
td{padding:10px 14px;font-size:13px;border-top:1px solid var(--border);}
tr:hover td{background:rgba(255,255,255,0.02);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--greenl);color:var(--green);}
.badge-red{background:var(--redl);color:var(--red);}
.badge-gold{background:var(--goldl);color:var(--gold3);}
.badge-blue{background:var(--bluel);color:var(--blue);}
.badge-orange{background:var(--orangel);color:var(--orange);}
.badge-purple{background:var(--purplel);color:#b06ed4;}

.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.mesa-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all 0.2s;}
.mesa-card:hover{transform:translateY(-2px);}
.mesa-card.ocupada{border-color:rgba(192,57,43,0.4);background:var(--redl);}
.mesa-card.livre{border-color:rgba(39,174,96,0.3);}
.mesa-num{font-size:20px;font-weight:700;margin-bottom:3px;}
.mesa-status{font-size:10px;font-weight:500;}
.mesa-total{font-size:12px;font-weight:600;color:var(--gold2);margin-top:4px;}

.pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.pay-btn{padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;text-align:center;transition:all 0.2s;}
.pay-btn.sel{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}

.alert{padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;}
.alert-warn{background:var(--goldl);border:1px solid rgba(212,160,23,0.3);color:var(--gold3);}
.alert-danger{background:var(--redl);border:1px solid rgba(192,57,43,0.3);color:#e88;}
.alert-success{background:var(--greenl);border:1px solid rgba(39,174,96,0.3);color:#5d9;}

.senha-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:600;align-items:center;justify-content:center;}
.senha-overlay.open{display:flex;}
.senha-box{background:var(--card);border:1px solid rgba(212,160,23,0.3);border-radius:18px;padding:32px;width:320px;text-align:center;}
.senha-box h3{font-size:16px;margin-bottom:6px;}
.senha-box p{font-size:13px;color:var(--text2);margin-bottom:20px;}
.senha-box input{width:100%;padding:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:18px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:12px;}
.senha-box input:focus{border-color:var(--gold);}

.item-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--gold);}
.qty-num{font-size:14px;font-weight:600;min-width:20px;text-align:center;}

.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all 0.2s;position:relative;}
.prod-card:hover{border-color:var(--gold);transform:translateY(-1px);}
.promo-badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}

.empty{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-icon{font-size:36px;margin-bottom:10px;}

.caixa-status{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;
}
.caixa-aberto{border-color:rgba(39,174,96,0.4);}
.caixa-fechado{border-color:rgba(192,57,43,0.4);}

.fin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.fin-card.pagar{border-left:3px solid var(--red);}
.fin-card.receber{border-left:3px solid var(--green);}
.fin-card.pago{opacity:0.5;}

@media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr;}.content{padding:14px 10px;}}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px">Carregando Malte Sistema...</div>
</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">🍺</div>
      <h1>Malte Distribuidora</h1>
      <p>Sistema de Gestão</p>
    </div>
    <div class="login-roles">
      <button class="role-btn active" onclick="setRole('adm')">👑 Administrador</button>
      <button class="role-btn" onclick="setRole('caixa')">🧾 Caixa</button>
    </div>
    <div class="field"><label>Usuário</label><input id="login-user" type="text" value="adm"></div>
    <div class="field"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Entrar no Sistema</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="topbar-logo">🍺 Malte</span>
      <span class="topbar-badge" id="top-role-badge">ADM</span>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="top-user-pill">Administrador</span>
      <button class="icon-btn" onclick="doLogout()" title="Sair">✕</button>
    </div>
  </div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="goTab('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="goTab('caixa')">💰 Caixa</button>
    <button class="nav-btn" onclick="goTab('mesas')">🍺 Mesas</button>
    <button class="nav-btn" onclick="goTab('balcao')">🛒 Balcão</button>
    <button class="nav-btn adm-only" onclick="goTab('estoque')">📦 Estoque</button>
    <button class="nav-btn adm-only" onclick="goTab('produtos')">🏷️ Produtos</button>
    <button class="nav-btn adm-only" onclick="goTab('financeiro')">💳 Financeiro</button>
    <button class="nav-btn adm-only" onclick="goTab('compras')">🛍️ Compras</button>
    <button class="nav-btn adm-only" onclick="goTab('relatorios')">📈 Relatórios</button>
    <button class="nav-btn adm-only" onclick="goTab('configuracoes')">⚙️ Config</button>
  </div>
  <div class="content" id="tab-content"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>
</div>

<div class="senha-overlay" id="senha-overlay">
  <div class="senha-box">
    <h3>🔐 Área Restrita</h3>
    <p id="senha-msg">Digite a senha do Administrador</p>
    <input type="password" id="senha-input" placeholder="••••••" onkeydown="if(event.key==='Enter')checkSenha()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeSenha()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="checkSenha()">Confirmar</button>
    </div>
    <div style="color:var(--red);font-size:13px;margin-top:8px;min-height:18px" id="senha-err"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const SUPABASE_URL='https://akicvaywryppktjiccpi.supabase.co';
const SUPABASE_KEY='sb_publishable_KlSN5wVH24AYhF7kjEU0pg_NnVl2SQg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// SENHAS — altere aqui ou via tela de configurações
let SENHAS={adm:'11300955',caixa:'1234'};

const USERS={
  adm:{role:'adm',nome:'Administrador'},
  caixa:{role:'caixa',nome:'Caixa'}
};

let currentUser=null;
let currentTab='dashboard';
let senhaCallback=null;
let balcaoItens=[];
let payAtual='dinheiro';
let caixaAberto=null;

// ── INIT ──
window.addEventListener('load',async()=>{
  // Carregar senhas salvas
  const s=localStorage.getItem('malte_senhas');
  if(s)try{SENHAS=JSON.parse(s);}catch(e){}
  try{await sb.from('produtos').select('id').limit(1);}catch(e){}
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  // Verificar caixa aberto
  const c=localStorage.getItem('malte_caixa');
  if(c)try{caixaAberto=JSON.parse(c);}catch(e){}
});

// ── AUTH ──
function setRole(r){
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-user').value=r;
}
function doLogin(){
  const u=document.getElementById('login-user').value.trim().toLowerCase();
  const p=document.getElementById('login-pass').value;
  if(!USERS[u]||SENHAS[u]!==p){document.getElementById('login-err').textContent='Usuário ou senha incorretos.';return;}
  currentUser={...USERS[u],id:u};
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('top-user-pill').textContent=USERS[u].nome;
  document.getElementById('top-role-badge').textContent=u.toUpperCase();
  if(u!=='adm')document.querySelectorAll('.adm-only').forEach(b=>b.style.display='none');
  goTab('dashboard');
}
function doLogout(){
  currentUser=null;balcaoItens=[];
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').textContent='';
  document.querySelectorAll('.adm-only').forEach(b=>b.style.display='');
}

// ── SENHA ADM ──
function pedirSenhaAdm(msg,cb){
  if(currentUser&&currentUser.id==='adm'){cb();return;}
  senhaCallback=cb;
  document.getElementById('senha-msg').textContent=msg||'Digite a senha do Administrador';
  document.getElementById('senha-input').value='';
  document.getElementById('senha-err').textContent='';
  document.getElementById('senha-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('senha-input').focus(),100);
}
function checkSenha(){
  if(document.getElementById('senha-input').value===SENHAS.adm){closeSenha();if(senhaCallback)senhaCallback();}
  else document.getElementById('senha-err').textContent='Senha incorreta.';
}
function closeSenha(){document.getElementById('senha-overlay').classList.remove('open');senhaCallback=null;}

// ── MODAL ──
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ── NAV ──
function goTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const t=b.textContent.trim().toLowerCase();
    if(t.includes(tab.substring(0,4))||t.includes(tab))b.classList.add('active');
  });
  const c=document.getElementById('tab-content');
  c.innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  const tabs={dashboard:renderDashboard,caixa:renderCaixa,mesas:renderMesas,balcao:renderBalcao,estoque:renderEstoque,produtos:renderProdutos,financeiro:renderFinanceiro,compras:renderCompras,relatorios:renderRelatorios,configuracoes:renderConfiguracoes};
  if(tabs[tab])tabs[tab]();
}

// ── FORMATTERS ──
function fmt(v){return'R$ '+Number(v||0).toFixed(2).replace('.',',');}
function fmtDate(d){const dt=new Date(d);return dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function fmtDateFull(d){const dt=new Date(d);return dt.toLocaleDateString('pt-BR')+' '+fmtDate(d);}
function fmtDateOnly(d){return new Date(d).toLocaleDateString('pt-BR');}
function selPay(tipo){
  payAtual=tipo;
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('sel'));
  const el=document.getElementById('pay-'+tipo);
  if(el)el.classList.add('sel');
}

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
async function renderDashboard(){
  const[{data:V},{data:M},{data:P},{data:FP},{data:FR}]=await Promise.all([
    sb.from('vendas').select('*').order('criado_em',{ascending:false}).limit(50),
    sb.from('mesas').select('*'),
    sb.from('produtos').select('*'),
    sb.from('financeiro').select('*').eq('tipo','pagar').eq('pago',false),

async function abrirMesa(id){
  const{data:m}=await sb.from('mesas').select('*').eq('id',id).single();
  if(m.status==='livre'){
    openModal(`<h3>🍺 Mesa ${id}</h3>
    <p style="color:var(--text2);font-size:14px;margin-bottom:20px">Abrir a mesa ${id}?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="confirmarAbrirMesa(${id})">Abrir Mesa</button>
    </div>`);
  }else{await modalMesaAberta(id);}
}
async function confirmarAbrirMesa(id){
  await sb.from('mesas').update({status:'ocupada',aberta_em:new Date().toISOString()}).eq('id',id);
  closeModal();renderMesas();
}

  <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
    <span style="color:var(--text2);font-size:13px">Aberta às ${fmtDate(m.aberta_em)}</span>

      ${(prods||[]).map(p=>`<option value="${p.id}" data-preco="${p.preco_promo&&p.em_promo?p.preco_promo:p.preco}">${p.emoji} ${p.nome}${p.em_promo?` 🔥 ${fmt(p.preco_promo)}`:`— ${fmt(p.preco)}`}</option>`).join('')}
    </select>
    <div style="display:flex;gap:8px;">
      <input type="number" id="mesa-qty" value="1" min="1" style="width:70px;padding:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);">
      <button class="btn btn-primary" style="flex:1" onclick="addItemMesa(${id})">+ Adicionar</button>
    </div>
  </div>
  <div style="max-height:200px;overflow-y:auto;margin-bottom:12px;">
    ${I.length===0?'<div class="empty"><div class="empty-icon">🍽️</div><p>Nenhum item</p></div>':
    I.map(i=>`<div class="item-row">
      <div><div style="font-size:13px;font-weight:500">${i.nome}</div><div style="font-size:12px;color:var(--text2)">${i.qty}x ${fmt(i.preco)} = <b style="color:var(--gold2)">${fmt(Number(i.preco)*i.qty)}</b></div></div>
      <button class="btn btn-danger btn-xs" onclick="removerItemMesa(${i.id},${id})">−</button>
    </div>`).join('')}
  </div>
  ${I.length>0?`
  <div style="border-top:1px solid var(--border);padding-top:12px;">
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">Pagamento:</div>
    <div class="pay-methods">
      <button class="pay-btn sel" id="pay-dinheiro" onclick="selPay('dinheiro')">💵 Dinheiro</button>
      <button class="pay-btn" id="pay-pix" onclick="selPay('pix')">📱 PIX</button>
      <button class="pay-btn" id="pay-debito" onclick="selPay('debito')">💳 Débito</button>
      <button class="pay-btn" id="pay-credito" onclick="selPay('credito')">💳 Crédito</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Fechar</button>
      <button class="btn btn-danger" style="flex:1" onclick="fecharMesaVenda(${id})">✓ Fechar Mesa</button>
    </div>
  </div>`:`
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Fechar</button>
    <button class="btn btn-danger btn-sm" onclick="cancelarMesa(${id})">Cancelar Mesa</button>
  </div>`}`);
}
async function addItemMesa(mesaId){
  const sel=document.getElementById('mesa-prod-sel');
  const pid=parseInt(sel.value);
  const preco=parseFloat(sel.options[sel.selectedIndex].dataset.preco);
  const qty=parseInt(document.getElementById('mesa-qty').value)||1;
  const{data:prod}=await sb.from('produtos').select('nome,emoji').eq('id',pid).single();
  const{data:exist}=await sb.from('mesa_itens').select('*').eq('mesa_id',mesaId).eq('prod_id',pid).maybeSingle();
  if(exist){await sb.from('mesa_itens').update({qty:exist.qty+qty}).eq('id',exist.id);}
  else{await sb.from('mesa_itens').insert({mesa_id:mesaId,prod_id:pid,nome:prod.emoji+' '+prod.nome,preco,qty});}
  await modalMesaAberta(mesaId);
}
async function removerItemMesa(itemId,mesaId){
  const doRemover=async()=>{await sb.from('mesa_itens').delete().eq('id',itemId);await modalMesaAberta(mesaId);};
  if(currentUser.id==='adm'){doRemover();}
  else{closeModal();pedirSenhaAdm('Remover item requer senha ADM',doRemover);}
}
async function fecharMesaVenda(id){
  const{data:itens}=await sb.from('mesa_itens').select('*').eq('mesa_id',id);
  const I=itens||[];
  const total=I.reduce((s,i)=>s+Number(i.preco)*i.qty,0);
  const{data:venda}=await sb.from('vendas').insert({tipo:`Mesa ${id}`,total,pagamento:payAtual,operador:currentUser.nome}).select().single();
  if(venda&&I.length>0)await sb.from('venda_itens').insert(I.map(i=>({venda_id:venda.id,nome:i.nome,qty:i.qty,total:Number(i.preco)*i.qty})));
  for(const i of I){const{data:p}=await sb.from('produtos').select('estoque').eq('id',i.prod_id).single();if(p)await sb.from('produtos').update({estoque:Math.max(0,p.estoque-i.qty)}).eq('id',i.prod_id);}
  await sb.from('mesa_itens').delete().eq('mesa_id',id);
  await sb.from('mesas').update({status:'livre',aberta_em:null}).eq('id',id);
  closeModal();renderMesas();
}
async function cancelarMesa(id){
  await sb.from('mesa_itens').delete().eq('mesa_id',id);
  await sb.from('mesas').update({status:'livre',aberta_em:null}).eq('id',id);
  closeModal();renderMesas();
}

function addBalcao(pid,nome,preco,emoji){
  const exist=balcaoItens.find(i=>i.prodId===pid);
  if(exist)exist.qty++;
  else balcaoItens.push({prodId:pid,nome:emoji+' '+nome,preco,qty:1});
  renderBalcao();
}
function qtyBalcao(idx,d){
  balcaoItens[idx].qty+=d;
  if(balcaoItens[idx].qty<=0)balcaoItens.splice(idx,1);
  renderBalcao();
}
async function finalizarBalcao(){
  if(!balcaoItens.length)return;
  const total=balcaoItens.reduce((s,i)=>s+i.preco*i.qty,0);
  const{data:venda}=await sb.from('vendas').insert({tipo:'Balcão',total,pagamento:payAtual,operador:currentUser.nome}).select().single();
  if(venda){
    await sb.from('venda_itens').insert(balcaoItens.map(i=>({venda_id:venda.id,nome:i.nome,qty:i.qty,total:i.preco*i.qty})));
    for(const i of balcaoItens){const{data:p}=await sb.from('produtos').select('estoque').eq('id',i.prodId).single();if(p)await sb.from('produtos').update({estoque:Math.max(0,p.estoque-i.qty)}).eq('id',i.prodId);}
  }
  balcaoItens=[];goTab('dashboard');
}

  openModal(`
  <h3>📦 Entrada de Estoque</h3>
  <div class="modal-field"><label>Produto</label>
    <select id="ent-prod">${(P||[]).map(p=>`<option value="${p.id}">${p.emoji} ${p.nome}</option>`).join('')}</select>
  </div>
  <div class="modal-field"><label>Quantidade</label><input type="number" id="ent-qty" value="12" min="1"></div>

    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarEntrada()">Registrar</button>
  </div>`);

async function confirmarEntrada(){
  const pid=parseInt(document.getElementById('ent-prod').value);
  const qty=parseInt(document.getElementById('ent-qty').value)||0;
  const custo=parseFloat(document.getElementById('ent-custo').value)||0;
  const{data:prod}=await sb.from('produtos').select('*').eq('id',pid).single();
  await sb.from('produtos').update({estoque:prod.estoque+qty}).eq('id',pid);
  await sb.from('entradas').insert({produto:prod.nome,qty,custo,operador:currentUser.nome});
  closeModal();renderEstoque();
}

  await sb.from('produtos').delete().eq('id',id);

}

async function renderFinanceiro(){
  const{data:F}=await sb.from('financeiro').select('*').order('vencimento',{ascending:true});
  const pagar=(F||[]).filter(f=>f.tipo==='pagar');
  const receber=(F||[]).filter(f=>f.tipo==='receber');
  const totalPagar=pagar.filter(f=>!f.pago).reduce((s,f)=>s+Number(f.valor),0);
  const totalReceber=receber.filter(f=>!f.pago).reduce((s,f)=>s+Number(f.valor),0);

  document.getElementById('tab-content').innerHTML=`
  <div class="stats-grid">
    <div class="stat-card stat-red"><div class="stat-label">Total a Pagar</div><div class="stat-value">${fmt(totalPagar)}</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Total a Receber</div><div class="stat-value">${fmt(totalReceber)}</div></div>
    <div class="stat-card ${totalReceber-totalPagar>=0?'stat-green':'stat-red'}"><div class="stat-label">Saldo</div><div class="stat-value">${fmt(totalReceber-totalPagar)}</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div>
      <div class="section-hdr">
        <div class="section-title" style="color:var(--red)">📤 Contas a Pagar</div>
        <button class="btn btn-danger btn-sm" onclick="novaContaFinanceiro('pagar')">+ Nova</button>
      </div>
      ${pagar.map(f=>`
      <div class="fin-card pagar ${f.pago?'pago':''}">
        <div>
          <div style="font-size:13px;font-weight:600">${f.descricao}</div>
          <div style="font-size:11px;color:var(--text2)">Venc: ${fmtDateOnly(f.vencimento)} ${f.pago?'• <span style="color:var(--green)">PAGO</span>':''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:14px;font-weight:700;color:var(--red)">${fmt(f.valor)}</div>
          ${!f.pago?`<button class="btn btn-green btn-xs" style="margin-top:4px" onclick="pagarConta(${f.id})">Pagar</button>`:''}
        </div>
      </div>`).join('')||'<div class="empty"><p>Nenhuma conta</p></div>'}
    </div>
    <div>
      <div class="section-hdr">
        <div class="section-title" style="color:var(--green)">📥 Contas a Receber</div>
        <button class="btn btn-green btn-sm" onclick="novaContaFinanceiro('receber')">+ Nova</button>
      </div>
      ${receber.map(f=>`
      <div class="fin-card receber ${f.pago?'pago':''}">
        <div>
          <div style="font-size:13px;font-weight:600">${f.descricao}</div>
          <div style="font-size:11px;color:var(--text2)">Venc: ${fmtDateOnly(f.vencimento)} ${f.pago?'• <span style="color:var(--green)">RECEBIDO</span>':''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:14px;font-weight:700;color:var(--green)">${fmt(f.valor)}</div>
          ${!f.pago?`<button class="btn btn-green btn-xs" style="margin-top:4px" onclick="pagarConta(${f.id})">Receber</button>`:''}
        </div>
      </div>`).join('')||'<div class="empty"><p>Nenhuma conta</p></div>'}
    </div>
  </div>`;
}
function novaContaFinanceiro(tipo){
  openModal(`
  <h3>${tipo==='pagar'?'📤 Nova Conta a Pagar':'📥 Nova Conta a Receber'}</h3>
  <div class="modal-field"><label>Descrição</label><input type="text" id="fin-desc" placeholder="Ex: Fornecedor, aluguel..."></div>
  <div class="modal-field"><label>Valor (R$)</label><input type="number" id="fin-valor" value="0" step="0.01"></div>
  <div class="modal-field"><label>Vencimento</label><input type="date" id="fin-venc" value="${new Date().toISOString().split('T')[0]}"></div>
  <div class="modal-actions">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarConta('${tipo}')">Salvar</button>
  </div>`);
}
async function salvarConta(tipo){
  const desc=document.getElementById('fin-desc').value.trim();
  if(!desc)return;
  await sb.from('financeiro').insert({
    tipo,descricao:desc,
    valor:parseFloat(document.getElementById('fin-valor').value)||0,
    vencimento:document.getElementById('fin-venc').value,
    pago:false
  });
  closeModal();renderFinanceiro();
}
async function pagarConta(id){
  await sb.from('financeiro').update({pago:true}).eq('id',id);
  renderFinanceiro();
}

async function renderCompras(){
  const{data:C}=await sb.from('compras').select('*').order('criado_em',{ascending:false});
  document.getElementById('tab-content').innerHTML=`
  <div class="section-hdr">
    <div class="section-title">🛍️ Registro de Compras</div>
    <button class="btn btn-primary btn-sm" onclick="novaCompra()">+ Nova Compra</button>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd</th><th>Valor Total</th><th>Status</th></tr></thead>
    <tbody>${(C||[]).length===0?`<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px">Nenhuma compra registrada</td></tr>`:
    (C||[]).map(c=>`<tr>
      <td>${fmtDateFull(c.criado_em)}</td>
      <td>${c.fornecedor}</td>
      <td>${c.produto}</td>
      <td>${c.qty}</td>
      <td style="font-weight:600;color:var(--red)">${fmt(c.valor_total)}</td>
      <td><span class="badge ${c.status==='recebido'?'badge-green':c.status==='pendente'?'badge-gold':'badge-blue'}">${c.status.toUpperCase()}</span></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}
async function novaCompra(){
  const{data:P}=await sb.from('produtos').select('*').order('nome');
  openModal(`
  <h3>🛍️ Nova Compra</h3>
  <div class="modal-field"><label>Fornecedor</label><input type="text" id="cmp-forn" placeholder="Nome do fornecedor"></div>
  <div class="modal-field"><label>Produto</label>
    <select id="cmp-prod" onchange="atualizarCustoProduto(this)">
      ${(P||[]).map(p=>`<option value="${p.id}" data-custo="${p.custo}">${p.emoji} ${p.nome}</option>`).join('')}
    </select>
  </div>
  <div class="modal-field"><label>Quantidade</label><input type="number" id="cmp-qty" value="1" min="1" oninput="calcTotalCompra()"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="modal-field"><label>Custo Unitário (R$)</label><input type="number" id="cmp-custo-unit" value="0" step="0.01" oninput="calcTotalCompra()"></div>
    <div class="modal-field"><label>Valor Total (R$)</label><input type="number" id="cmp-total" value="0" step="0.01" style="color:var(--gold2);font-weight:600"></div>
  </div>
  <div class="modal-field"><label>Status</label>
    <select id="cmp-status"><option value="pendente">Pendente</option><option value="recebido">Recebido</option><option value="cancelado">Cancelado</option></select>
  </div>
  <div class="modal-actions">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarCompra()">Salvar</button>
  </div>`);
  setTimeout(()=>{
    const sel=document.getElementById('cmp-prod');
    if(sel)document.getElementById('cmp-custo-unit').value=sel.options[sel.selectedIndex].dataset.custo||0;
    calcTotalCompra();
  },100);
}
function atualizarCustoProduto(sel){
  document.getElementById('cmp-custo-unit').value=sel.options[sel.selectedIndex].dataset.custo||0;
  calcTotalCompra();
}
function calcTotalCompra(){
  const qty=parseInt(document.getElementById('cmp-qty')?.value)||0;
  const custo=parseFloat(document.getElementById('cmp-custo-unit')?.value)||0;
  const tot=document.getElementById('cmp-total');
  if(tot)tot.value=(qty*custo).toFixed(2);
}
async function salvarCompra(){
  const forn=document.getElementById('cmp-forn').value.trim();
  if(!forn)return;
  const pid=parseInt(document.getElementById('cmp-prod').value);
  const qty=parseInt(document.getElementById('cmp-qty').value)||0;
  const custo=parseFloat(document.getElementById('cmp-custo-unit').value)||0;
  const total=parseFloat(document.getElementById('cmp-total').value)||0;
  const status=document.getElementById('cmp-status').value;
  const{data:prod}=await sb.from('produtos').select('nome,estoque').eq('id',pid).single();
  await sb.from('compras').insert({fornecedor:forn,produto:prod.nome,qty,custo_unit:custo,valor_total:total,status});
  if(status==='recebido'){
    await sb.from('produtos').update({estoque:prod.estoque+qty,custo}).eq('id',pid);
    await sb.from('entradas').insert({produto:prod.nome,qty,custo:total,operador:currentUser.nome});
  }
  closeModal();renderCompras();
}

// ══════════════════════════════════════════════
// RELATÓRIOS
// ══════════════════════════════════════════════
async function renderRelatorios(){
  const[{data:V},{data:VI},{data:P}]=await Promise.all([
    sb.from('vendas').select('*').order('criado_em',{ascending:false}),
    sb.from('venda_itens').select('*'),
    sb.from('produtos').select('*')
  ]);
  const totalV=(V||[]).reduce((s,v)=>s+Number(v.total),0);
  const porPag={};(V||[]).forEach(v=>{porPag[v.pagamento]=(porPag[v.pagamento]||0)+Number(v.total);});
  const porProd={};(VI||[]).forEach(i=>{porProd[i.nome]=(porProd[i.nome]||0)+i.qty;});
  const ranking=Object.entries(porProd).sort((a,b)=>b[1]-a[1]);
  const totalCusto=(VI||[]).reduce((s,i)=>{const p=(P||[]).find(x=>i.nome.includes(x.nome));return s+(p?Number(p.custo)*i.qty:0);},0);

  document.getElementById('tab-content').innerHTML=`
  <div class="stats-grid">
    <div class="stat-card stat-gold"><div class="stat-label">Total Vendas</div><div class="stat-value">${fmt(totalV)}</div></div>
    <div class="stat-card stat-red"><div class="stat-label">Custo Estimado</div><div class="stat-value">${fmt(totalCusto)}</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Lucro Bruto</div><div class="stat-value">${fmt(totalV-totalCusto)}</div><div class="stat-sub">${totalV>0?(((totalV-totalCusto)/totalV)*100).toFixed(1):0}% margem</div></div>
    <div class="stat-card stat-blue"><div class="stat-label">Transações</div><div class="stat-value">${(V||[]).length}</div><div class="stat-sub">ticket médio ${fmt(totalV/Math.max(1,(V||[]).length))}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div class="table-wrap"><table>
      <thead><tr><th colspan="2">Por Pagamento</th></tr></thead>
      <tbody>${Object.entries(porPag).map(([k,v])=>`<tr><td><span class="badge badge-blue">${k.toUpperCase()}</span></td><td style="font-weight:600;color:var(--gold2)">${fmt(v)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>Qtd</th></tr></thead>
      <tbody>${ranking.slice(0,8).map(([n,q],i)=>`<tr><td>${n}</td><td><span class="badge ${i===0?'badge-gold':i<3?'badge-green':'badge-blue'}">${q}</span></td></tr>`).join('')}</tbody>
    </table></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Local</th><th>Total</th><th>Pagamento</th><th>Operador</th></tr></thead>
    <tbody>${(V||[]).slice(0,30).map(v=>`<tr>
      <td>${fmtDateFull(v.criado_em)}</td><td>${v.tipo}</td>
      <td style="font-weight:600;color:var(--gold2)">${fmt(v.total)}</td>
      <td><span class="badge badge-blue">${(v.pagamento||'').toUpperCase()}</span></td>
      <td>${v.operador}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

        <div>Versão: <b style="color:var(--text)">3.0</b></div>
        <div>Banco: <b style="color:var(--green)">Supabase Online ✓</b></div>
        <div>Hospedagem: <b style="color:var(--text)">Vercel</b></div>
        <div>URL: <b style="color:var(--gold2)">malte-sistema.vercel.app</b></div>
      </div>
    </div>
  </div>`;
}
function salvarSenhas(){
  const adm=document.getElementById('cfg-senha-adm').value.trim();
  const caixa=document.getElementById('cfg-senha-caixa').value.trim();
  if(adm)SENHAS.adm=adm;
  if(caixa)SENHAS.caixa=caixa;
  localStorage.setItem('malte_senhas',JSON.stringify(SENHAS));
  document.getElementById('cfg-msg').textContent='✓ Senhas salvas com sucesso!';
  document.getElementById('cfg-senha-adm').value='';
  document.getElementById('cfg-senha-caixa').value='';
  setTimeout(()=>{document.getElementById('cfg-msg').textContent='';},3000);
}

// CRIAR TABELAS FALTANTES

async function criarTabelasFaltantes(){
  await sb.rpc('exec_sql',{sql:`
    create table if not exists financeiro (id bigint generated always as identity primary key, tipo text, descricao text, valor numeric(10,2), vencimento date, pago boolean default false, criado_em timestamptz default now());
    create table if not exists compras (id bigint generated always as identity primary key, fornecedor text, produto text, qty integer, custo_unit numeric(10,2), valor_total numeric(10,2), status text default 'pendente', criado_em timestamptz default now());
    alter table produtos add column if not exists em_promo boolean default false;
    alter table produtos add column if not exists preco_promo numeric(10,2) default 0;
    alter table financeiro disable row level security;
    alter table compras disable row level security;
  `}).catch(()=>{});
}
criarTabelasFaltantes();
