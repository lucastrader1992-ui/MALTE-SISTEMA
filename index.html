<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malte Distribuidora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2e;--card:#161928;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --gold:#d4a017;--gold2:#f0c040;--gold3:#ffd96a;--goldl:rgba(212,160,23,0.12);
  --green:#27ae60;--greenl:rgba(39,174,96,0.12);
  --red:#c0392b;--redl:rgba(192,57,43,0.12);
  --blue:#2980b9;--bluel:rgba(41,128,185,0.12);
  --purple:#7d3c98;--purplel:rgba(125,60,152,0.12);
  --orange:#e67e22;--orangel:rgba(230,126,34,0.12);
  --teal:#16a085;--teall:rgba(22,160,133,0.12);
  --text:#f0f2fa;--text2:#8a90b0;--text3:#4a5070;
  --radius:14px;--radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
input,button,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}

#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(212,160,23,0.15) 0%,transparent 60%);}
.login-box{background:var(--card);border:1px solid rgba(212,160,23,0.2);border-radius:20px;padding:44px 40px;width:380px;text-align:center;}
.login-brand-icon{width:64px;height:64px;background:var(--goldl);border:1px solid rgba(212,160,23,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;}
.login-brand h1{font-size:22px;font-weight:700;color:var(--gold2);}
.login-brand p{color:var(--text2);font-size:12px;margin-top:3px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{padding:11px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.role-btn.active{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.field input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:border 0.2s;}
.field input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0c12;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;margin-top:8px;transition:opacity 0.2s;}
.login-btn:hover{opacity:0.9;}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px;}

#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-logo{font-size:17px;font-weight:700;color:var(--gold2);}
.topbar-badge{background:var(--goldl);border:1px solid rgba(212,160,23,0.25);color:var(--gold3);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;cursor:pointer;color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.icon-btn:hover{border-color:var(--red);color:var(--red);}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;gap:2px;overflow-x:auto;}
.nav-btn{padding:12px 14px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px;}
.nav-btn:hover{color:var(--text2);}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}
.content{flex:1;padding:20px 16px;max-width:1200px;margin:0 auto;width:100%;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.8px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--gold);}
.modal-field select option{background:var(--bg3);}
.modal-field textarea{resize:vertical;min-height:80px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn{padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;}
.btn-primary{background:var(--gold);color:#0a0c12;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold2);}
.btn-secondary{background:var(--bg3);color:var(--text2);}
.btn-secondary:hover{color:var(--text);}
.btn-danger{background:var(--redl);color:var(--red);border-color:rgba(192,57,43,0.3);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{background:var(--greenl);color:var(--green);border-color:rgba(39,174,96,0.3);}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-orange{background:var(--orangel);color:var(--orange);border-color:rgba(230,126,34,0.3);}
.btn-orange:hover{background:var(--orange);color:#fff;}
.btn-teal{background:var(--teall);color:var(--teal);border-color:rgba(22,160,133,0.3);}
.btn-teal:hover{background:var(--teal);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:700;line-height:1;}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.stat-gold .stat-value{color:var(--gold2);}
.stat-green .stat-value{color:var(--green);}
.stat-red .stat-value{color:var(--red);}
.stat-blue .stat-value{color:var(--blue);}
.stat-orange .stat-value{color:var(--orange);}
.stat-teal .stat-value{color:var(--teal);}

.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.section-title{font-size:14px;font-weight:600;}
.section-sub{font-size:11px;color:var(--text2);margin-top:2px;}

.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
th{padding:9px 12px;text-align:left;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
td{padding:9px 12px;font-size:12px;border-top:1px solid var(--border);}
tr:hover td{background:rgba(255,255,255,0.02);}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-green{background:var(--greenl);color:var(--green);}
.badge-red{background:var(--redl);color:var(--red);}
.badge-gold{background:var(--goldl);color:var(--gold3);}
.badge-blue{background:var(--bluel);color:var(--blue);}
.badge-orange{background:var(--orangel);color:var(--orange);}
.badge-purple{background:var(--purplel);color:#b06ed4;}
.badge-teal{background:var(--teall);color:var(--teal);}

.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;}
.mesa-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;}
.mesa-card:hover{transform:translateY(-2px);}
.mesa-card.ocupada{border-color:rgba(192,57,43,0.4);background:var(--redl);}
.mesa-card.livre{border-color:rgba(39,174,96,0.3);}
.mesa-num{font-size:18px;font-weight:700;margin-bottom:2px;}
.mesa-status{font-size:10px;font-weight:500;}
.mesa-total{font-size:11px;font-weight:600;color:var(--gold2);margin-top:3px;}

.pay-methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-bottom:12px;}
.pay-btn{padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;text-align:center;transition:all 0.2s;}
.pay-btn.sel{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}

.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px;}
.alert-warn{background:var(--goldl);border:1px solid rgba(212,160,23,0.3);color:var(--gold3);}
.alert-danger{background:var(--redl);border:1px solid rgba(192,57,43,0.3);color:#e88;}
.alert-success{background:var(--greenl);border:1px solid rgba(39,174,96,0.3);color:#5d9;}

.senha-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:600;align-items:center;justify-content:center;}
.senha-overlay.open{display:flex;}
.senha-box{background:var(--card);border:1px solid rgba(212,160,23,0.3);border-radius:18px;padding:28px;width:300px;text-align:center;}
.senha-box h3{font-size:15px;margin-bottom:5px;}
.senha-box p{font-size:12px;color:var(--text2);margin-bottom:16px;}
.senha-box input{width:100%;padding:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:18px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:10px;}
.senha-box input:focus{border-color:var(--gold);}

.item-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:var(--radius-sm);padding:9px 12px;border:1px solid var(--border);margin-bottom:5px;}
.qty-ctrl{display:flex;align-items:center;gap:5px;}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--gold);}
.qty-num{font-size:13px;font-weight:600;min-width:18px;text-align:center;}

.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all 0.2s;position:relative;}
.prod-card:hover{border-color:var(--gold);transform:translateY(-1px);}
.promo-badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;}

.empty{text-align:center;padding:36px 16px;color:var(--text3);}
.empty-icon{font-size:32px;margin-bottom:8px;}

.caixa-status{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.caixa-aberto{border-color:rgba(39,174,96,0.4);}
.caixa-fechado{border-color:rgba(192,57,43,0.4);}

.fin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.fin-card.pagar{border-left:3px solid var(--red);}
.fin-card.receber{border-left:3px solid var(--green);}
.fin-card.pago{opacity:0.5;}

.comprovante{background:#fff;color:#000;padding:20px;border-radius:var(--radius);font-family:'Courier New',monospace;font-size:12px;line-height:1.6;max-width:320px;margin:0 auto;}
.comprovante h2{text-align:center;font-size:14px;margin-bottom:4px;}
.comprovante .linha{border-top:1px dashed #000;margin:8px 0;}
.comprovante .item{display:flex;justify-content:space-between;}
.comprovante .total{font-weight:700;font-size:14px;}

.tarefa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.tarefa-card.concluida{opacity:0.5;}
.tarefa-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.tarefa-check.ok{background:var(--green);border-color:var(--green);color:#fff;font-size:12px;}
.tarefa-prioridade{width:4px;height:40px;border-radius:2px;flex-shrink:0;}

.nota-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.nota-card:hover{border-color:var(--border2);}

.cmv-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.cmv-bar{height:12px;border-radius:6px;background:var(--bg3);overflow:hidden;margin-top:8px;}
.cmv-fill{height:100%;border-radius:6px;transition:width 0.5s;}

.com-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}

@media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr;}.content{padding:12px 10px;}}

@media print{
  body{background:#fff !important;}
  #app .topbar,#app .nav,.no-print{display:none !important;}
  .print-area{display:block !important;position:static !important;width:100% !important;}
  .print-area *{visibility:visible !important;}
  body *{visibility:hidden;}
  .print-area,.print-area *{visibility:visible;}
  .print-area{position:fixed;top:0;left:0;width:100%;}
}

.relatorio-pdf-area{background:#fff;color:#000;padding:30px;font-family:'Segoe UI',sans-serif;font-size:13px;}
.relatorio-pdf-area h1{font-size:20px;font-weight:700;margin-bottom:4px;color:#1a1a2e;}
.relatorio-pdf-area .rel-sub{font-size:11px;color:#666;margin-bottom:20px;}
.relatorio-pdf-area table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.relatorio-pdf-area th{background:#1a1e2e;color:#f0c040;padding:8px 10px;font-size:11px;text-align:left;}
.relatorio-pdf-area td{padding:7px 10px;border-bottom:1px solid #eee;font-size:12px;}
.relatorio-pdf-area .stat-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.relatorio-pdf-area .stat-box{border:1px solid #ddd;border-radius:8px;padding:12px 18px;flex:1;min-width:120px;}
.relatorio-pdf-area .stat-box .lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
.relatorio-pdf-area .stat-box .val{font-size:20px;font-weight:700;color:#1a1e2e;}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px">Carregando Malte Sistema...</div>
</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">🍺</div>
      <h1>Malte Distribuidora</h1>
      <p>Sistema de Gestão v4.1</p>
    </div>
    <div class="login-roles">
      <button class="role-btn active" onclick="setRole('adm')">👑 Administrador</button>
      <button class="role-btn" onclick="setRole('caixa')">🧾 Caixa</button>
    </div>
    <div class="field"><label>Usuário</label><input id="login-user" type="text" value="adm"></div>
    <div class="field"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Entrar no Sistema</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="topbar-logo">🍺 Malte</span>
      <span class="topbar-badge" id="top-role-badge">ADM</span>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="top-user-pill">Administrador</span>
      <button class="icon-btn" onclick="doLogout()" title="Sair">✕</button>
    </div>
  </div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="goTab('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="goTab('caixa')">💰 Caixa</button>
    <button class="nav-btn" onclick="goTab('mesas')">🍺 Mesas</button>
    <button class="nav-btn" onclick="goTab('balcao')">🛒 Balcão</button>
    <button class="nav-btn adm-only" onclick="goTab('estoque')">📦 Estoque</button>
    <button class="nav-btn adm-only" onclick="goTab('produtos')">🏷️ Produtos</button>
    <button class="nav-btn adm-only" onclick="goTab('financeiro')">💳 Financeiro</button>
    <button class="nav-btn adm-only" onclick="goTab('compras')">🛍️ Compras</button>
    <button class="nav-btn adm-only" onclick="goTab('cmv')">📉 CMV</button>
    <button class="nav-btn adm-only" onclick="goTab('comissoes')">💼 Comissões</button>
    <button class="nav-btn" onclick="goTab('tarefas')">✅ Tarefas</button>
    <button class="nav-btn" onclick="goTab('anotacoes')">📝 Notas</button>
    <button class="nav-btn adm-only" onclick="goTab('relatorios')">📈 Relatórios</button>
    <button class="nav-btn adm-only" onclick="goTab('configuracoes')">⚙️ Config</button>
  </div>
  <div class="content" id="tab-content"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>
</div>

<div class="senha-overlay" id="senha-overlay">
  <div class="senha-box">
    <h3>🔐 Área Restrita</h3>
    <p id="senha-msg">Digite a senha do Administrador</p>
    <input type="password" id="senha-input" placeholder="••••••" onkeydown="if(event.key==='Enter')checkSenha()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeSenha()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="checkSenha()">Confirmar</button>
    </div>
    <div style="color:var(--red);font-size:12px;margin-top:6px;min-height:16px" id="senha-err"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div id="print-area" class="print-area" style="display:none"></div>

<script>
const SUPABASE_URL='https://akicvaywryppktjiccpi.supabase.co';
const SUPABASE_KEY='sb_publishable_KlSN5wVH24AYhF7kjEU0pg_NnVl2SQg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let SENHAS={adm:'11300955',caixa:'1234'};
const USERS={adm:{role:'adm',nome:'Administrador'},caixa:{role:'caixa',nome:'Caixa'}};
let currentUser=null,currentTab='dashboard',senhaCallback=null;
let balcaoItens=[],payAtual='dinheiro',caixaAberto=null;
let mesaPollingInterval=null;

function getDiaComercial(){
  const agora=new Date();
  if(agora.getHours()<6){agora.setDate(agora.getDate()-1);}
  const inicio=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate(),6,0,0,0);
  const fim=new Date(inicio);
  fim.setDate(fim.getDate()+1);
  fim.setHours(5,59,59,999);
  return{inicio,fim};
}

function isHojeComercial(dataStr){
  const dt=new Date(dataStr);
  const{inicio,fim}=getDiaComercial();
  return dt>=inicio&&dt<=fim;
}

window.addEventListener('load',async()=>{
  const s=localStorage.getItem('malte_senhas');
  if(s)try{SENHAS=JSON.parse(s);}catch(e){}
  const c=localStorage.getItem('malte_caixa');
  if(c)try{caixaAberto=JSON.parse(c);}catch(e){}
  const sessao=localStorage.getItem('malte_sessao');
  if(sessao){
    try{
      const u=JSON.parse(sessao);
      if(u&&USERS[u.id]){
        currentUser=u;
        document.getElementById('loading-screen').style.display='none';
        document.getElementById('app').style.display='flex';
        document.getElementById('top-user-pill').textContent=USERS[u.id].nome;
        document.getElementById('top-role-badge').textContent=u.id.toUpperCase();
        if(u.id!=='adm')document.querySelectorAll('.adm-only').forEach(b=>b.style.display='none');
        goTab('dashboard');
        return;
      }
    }catch(e){}
  }
  try{await sb.from('produtos').select('id').limit(1);}catch(e){}
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
});

function setRole(r){
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-user').value=r;
}

function doLogin(){
  const u=document.getElementById('login-user').value.trim().toLowerCase();
  const p=document.getElementById('login-pass').value;
  if(!USERS[u]||SENHAS[u]!==p){document.getElementById('login-err').textContent='Usuário ou senha incorretos.';return;}
  currentUser={...USERS[u],id:u};
  localStorage.setItem('malte_sessao',JSON.stringify(currentUser));
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('top-user-pill').textContent=USERS[u].nome;
  document.getElementById('top-role-badge').textContent=u.toUpperCase();
  if(u!=='adm')document.querySelectorAll('.adm-only').forEach(b=>b.style.display='none');
  goTab('dashboard');
}

function doLogout(){
  currentUser=null;balcaoItens=[];
  localStorage.removeItem('malte_sessao');
  stopMesaPolling();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').textContent='';
  document.querySelectorAll('.adm-only').forEach(b=>b.style.display='');
}

function pedirSenhaAdm(msg,cb){
  if(currentUser&&currentUser.id==='adm'){cb();return;}
  senhaCallback=cb;
  document.getElementById('senha-msg').textContent=msg||'Digite a senha do Administrador';
  document.getElementById('senha-input').value='';
  document.getElementById('senha-err').textContent='';
  document.getElementById('senha-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('senha-input').focus(),100);
}
function checkSenha(){
  if(document.getElementById('senha-input').value===SENHAS.adm){closeSenha();if(senhaCallback)senhaCallback();}
  else document.getElementById('senha-err').textContent='Senha incorreta.';
}
function closeSenha(){document.getElementById('senha-overlay').classList.remove('open');senhaCallback=null;}

function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

function stopMesaPolling(){
  if(mesaPollingInterval){clearInterval(mesaPollingInterval);mesaPollingInterval=null;}
}

function goTab(tab){
  stopMesaPolling();
  stopEstoquePolling();
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const t=b.textContent.trim().toLowerCase();
    if(t.includes(tab.substring(0,4))||t.includes(tab))b.classList.add('active');
  });
  document.getElementById('tab-content').innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  const tabs={dashboard:renderDashboard,caixa:renderCaixa,mesas:renderMesas,balcao:renderBalcao,
    estoque:renderEstoque,produtos:renderProdutos,financeiro:renderFinanceiro,compras:renderCompras,
    cmv:renderCMV,comissoes:renderComissoes,tarefas:renderTarefas,anotacoes:renderAnotacoes,
    relatorios:renderRelatorios,configuracoes:renderConfiguracoes};
  if(tabs[tab])tabs[tab]();
}

const fmt=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const fmtDate=d=>{const dt=new Date(d);return dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const fmtDateFull=d=>{const dt=new Date(d);return dt.toLocaleDateString('pt-BR')+' '+fmtDate(d);};
const fmtDateOnly=d=>new Date(d).toLocaleDateString('pt-BR');
function selPay(tipo){
  payAtual=tipo;
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('sel'));
  const el=document.getElementById('pay-'+tipo);
  if(el)el.classList.add('sel');
}

async function renderDashboard(){
  const[{data:V},{data:M},{data:P},{data:FP},{data:FR},{data:T}]=await Promise.all([
    sb.from('vendas').select('*').order('criado_em',{ascending:false}).limit(50),
    sb.from('mesas').select('*'),
    sb.from('produtos').select('*'),
    sb.from('financeiro').select('*').eq('tipo','pagar').eq('pago',false),
    sb.from('financeiro').select('*').eq('tipo','receber').eq('pago',false),
    sb.from('tarefas').select('*').eq('concluida',false),
  ]);
  const hojeV=(V||[]).filter(v=>isHojeComercial(v.criado_em));
  const totalHoje=hojeV.reduce((s,v)=>s+Number(v.total),0);
  const mesasOcupadas=(M||[]).filter(m=>m.status==='ocupada').length;
  const baixoEstoque=(P||[]).filter(p=>p.estoque<20).length;
  const totalPagar=(FP||[]).reduce((s,f)=>s+Number(f.valor),0);
  const totalReceber=(FR||[]).reduce((s,f)=>s+Number(f.valor),0);
  const caixaInfo=caixaAberto?`<span class="badge badge-green">ABERTO desde ${fmtDate(caixaAberto.abertura)}</span>`:`<span class="badge badge-red">FECHADO</span>`;
  const{inicio}=getDiaComercial();
  const labelDia=inicio.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  document.getElementById('tab-content').innerHTML=`
  <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span style="font-size:12px;color:var(--text2)">Caixa:</span>${caixaInfo}
    <span style="font-size:11px;color:var(--text3)">📅 Dia comercial: ${labelDia} 06:00 → +1d 05:59</span>
    ${(T||[]).length>0?`<span class="badge badge-orange">${(T||[]).length} tarefa(s) pendente(s)</span>`:''}
  </div>
  <div class="stats-grid">
    <div class="stat-card stat-gold"><div class="stat-label">Vendas Hoje</div><div class="stat-value">${fmt(totalHoje)}</div><div class="stat-sub">${hojeV.length} transações</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Mesas Ocupadas</div><div class="stat-value">${mesasOcupadas}</div><div class="stat-sub">de ${(M||[]).length}</div></div>
    <div class="stat-card stat-red"><div class="stat-label">A Pagar</div><div class="stat-value">${fmt(totalPagar)}</div><div class="stat-sub">${(FP||[]).length} contas</div></div>
    <div class="stat-card stat-blue"><div class="stat-label">A Receber</div><div class="stat-value">${fmt(totalReceber)}</div><div class="stat-sub">${(FR||[]).length} contas</div></div>
    <div class="stat-card ${baixoEstoque>0?'stat-orange':''}"><div class="stat-label">Estoque Baixo</div><div class="stat-value">${baixoEstoque}</div><div class="stat-sub">produtos críticos</div></div>
  </div>
  ${baixoEstoque>0?`<div class="alert alert-warn">⚠️ ${baixoEstoque} produto(s) com estoque abaixo de 20 unidades!</div>`:''}
  <div class="section-hdr"><div class="section-title">Últimas Vendas</div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Horário</th><th>Local</th><th>Total</th><th>Pagamento</th><th>Operador</th></tr></thead>
    <tbody>${(V||[]).slice(0,8).map(v=>`<tr>
      <td>${fmtDate(v.criado_em)}</td><td>${v.tipo}</td>
      <td style="font-weight:600;color:var(--gold2)">${fmt(v.total)}</td>
      <td><span class="badge badge-blue">${(v.pagamento||'').toUpperCase()}</span></td>
      <td>${v.operador||''}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

    <button class="btn btn-primary btn-sm" onclick="carregarCaixaDia()">🔍 Ver</button>

  <div style="font-size:12px;color:var(--text2);margin-bottom:14px">⚠️ Toda saída fica registrada com operador e horário.</div>
  <div class="modal-field"><label>Valor (R$)</label><input type="number" id="saida-valor" value="0" step="0.01" min="0.01"></div>
  <div class="modal-field"><label>Motivo / Observação</label>
    <select id="saida-motivo-sel" onchange="toggleSaidaObs()" style="margin-bottom:7px;width:100%;padding:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;">
      <option value="">Selecionar motivo...</option>
      <option value="Troco para cliente">Troco para cliente</option>
      <option value="Pagamento de fornecedor">Pagamento de fornecedor</option>
      <option value="Compra de emergência">Compra de emergência</option>
      <option value="Despesa operacional">Despesa operacional</option>
      <option value="Sangria">Sangria (retirada pelo ADM)</option>
      <option value="Outro">Outro (especificar)</option>
    </select>

function toggleSaidaObs(){
  const sel=document.getElementById('saida-motivo-sel');
  const obs=document.getElementById('saida-obs');
  if(sel&&obs)obs.style.display=sel.value==='Outro'?'block':'none';
}

async function confirmarSaidaCaixa(){
  const valor=parseFloat(document.getElementById('saida-valor').value)||0;
  if(valor<=0){alert('Informe um valor válido.');return;}
  const motivoSel=document.getElementById('saida-motivo-sel').value;
  const obs=document.getElementById('saida-obs').value.trim();
  const motivo=motivoSel==='Outro'?obs:motivoSel;
  if(!motivo){alert('Informe o motivo.');return;}
  const autor=document.getElementById('saida-autor').value.trim()||currentUser.nome;
  await sb.from('saidas_caixa').insert({
    valor,motivo,autorizado_por:autor,operador:currentUser.nome
  }).catch(()=>{});
  await registrarLog('SAÍDA CAIXA',`R$ ${valor.toFixed(2)} — ${motivo} — Autorizado: ${autor}`);
  closeModal();
  alert(`✅ Saída de ${fmt(valor)} registrada!`);
  carregarCaixaDia();
}

function irDiaCaixaAnterior(){
  const sel=document.getElementById('caixa-data-sel');
  if(!sel)return;
  const d=new Date(sel.value+'T12:00:00');
  d.setDate(d.getDate()-1);
  sel.value=d.toISOString().split('T')[0];
  carregarCaixaDia();
}
function irDiaCaixaProximo(){
  const sel=document.getElementById('caixa-data-sel');
  if(!sel)return;
  const d=new Date(sel.value+'T12:00:00');
  d.setDate(d.getDate()+1);
  sel.value=d.toISOString().split('T')[0];
  carregarCaixaDia();
}

async function carregarCaixaDia(){
  const sel=document.getElementById('caixa-data-sel');
  const data=sel?sel.value:new Date().toISOString().split('T')[0];
  const tsInicio=new Date(`${data}T06:00:00`).toISOString();
  const dtFim=new Date(`${data}T06:00:00`);
  dtFim.setDate(dtFim.getDate()+1);dtFim.setHours(5,59,59,999);
  const tsFim=dtFim.toISOString();

  const [{data:V},{data:S},{data:L}]=await Promise.all([
    sb.from('vendas').select('*').gte('criado_em',tsInicio).lte('criado_em',tsFim).order('criado_em',{ascending:false}),
    sb.from('saidas_caixa').select('*').gte('criado_em',tsInicio).lte('criado_em',tsFim).order('criado_em',{ascending:false}),
    sb.from('log_acoes').select('*').gte('criado_em',tsInicio).lte('criado_em',tsFim).order('criado_em',{ascending:false}).limit(50)
  ]);

  const vendas=V||[];
  const saidas=S||[];
  const logs=L||[];
  const totalVendas=vendas.reduce((s,v)=>s+Number(v.total),0);
  const totalSaidas=saidas.reduce((s,x)=>s+Number(x.valor),0);
  const saldoFinal=totalVendas-totalSaidas;
  const porPag={};
  vendas.forEach(v=>{porPag[v.pagamento]=(porPag[v.pagamento]||0)+Number(v.total);});

  const dataFmt=new Date(`${data}T12:00:00`).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const isHoje=data===new Date().toISOString().split('T')[0];
  const el=document.getElementById('caixa-dia-conteudo');
  if(!el)return;

  // Montar todas as formas de pagamento dinamicamente
  const pagLabels={
    'dinheiro':'💵 Dinheiro','pix':'📱 PIX','debito':'💳 Débito','credito':'💳 Crédito',
    'pix+dinheiro':'📱+💵 PIX+Dinheiro','pix+debito':'📱+💳 PIX+Débito',
    'pix+credito':'📱+💳 PIX+Crédito','dinheiro+debito':'💵+💳 Dinheiro+Débito',
    'dinheiro+credito':'💵+💳 Dinheiro+Crédito','debito+credito':'💳 Déb+Créd'
  };

  el.innerHTML=`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <span style="font-size:14px;font-weight:600">${dataFmt}</span>
    ${isHoje?'<span class="badge badge-green">HOJE</span>':'<span class="badge badge-blue">HISTÓRICO</span>'}
    <span style="font-size:11px;color:var(--text3)">dia comercial 06:00→05:59</span>
  </div>

  <!-- CARDS RESUMO -->
  <div class="stats-grid">
    <div class="stat-card stat-gold"><div class="stat-label">Total Vendas</div><div class="stat-value">${fmt(totalVendas)}</div><div class="stat-sub">${vendas.length} transações</div></div>
    <div class="stat-card stat-red"><div class="stat-label">Saídas</div><div class="stat-value">${fmt(totalSaidas)}</div><div class="stat-sub">${saidas.length} retiradas</div></div>
    <div class="stat-card ${saldoFinal>=0?'stat-green':'stat-red'}"><div class="stat-label">Saldo Final</div><div class="stat-value">${fmt(saldoFinal)}</div><div class="stat-sub">vendas − saídas</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Dinheiro</div><div class="stat-value">${fmt(porPag['dinheiro']||0)}</div></div>
    <div class="stat-card stat-blue"><div class="stat-label">PIX</div><div class="stat-value">${fmt(porPag['pix']||0)}</div></div>
    <div class="stat-card"><div class="stat-label">Cartões</div><div class="stat-value" style="color:var(--purple)">${fmt((porPag['debito']||0)+(porPag['credito']||0))}</div></div>
  </div>

  <!-- PAGAMENTOS COMBINADOS se houver -->
  ${Object.entries(porPag).filter(([k])=>k.includes('+')).length>0?`
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;">
    <div style="font-size:12px;font-weight:600;color:var(--gold2);margin-bottom:8px">💳 Pagamentos Combinados</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${Object.entries(porPag).filter(([k])=>k.includes('+')).map(([k,v])=>`
      <div style="background:var(--bg3);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;">
        <div style="color:var(--text2);font-size:10px">${pagLabels[k]||k.toUpperCase()}</div>
        <div style="font-weight:700;color:var(--gold2)">${fmt(v)}</div>
      </div>`).join('')}
    </div>
  </div>`:''}

  <!-- SAÍDAS -->
  ${saidas.length>0?`
  <div class="section-hdr"><div class="section-title" style="color:var(--red)">💸 Saídas de Caixa</div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Horário</th><th>Motivo</th><th>Valor</th><th>Operador</th><th>Autorizado</th></tr></thead>
    <tbody>${saidas.map(s=>`<tr>
      <td>${fmtDateFull(s.criado_em)}</td>
      <td>${s.motivo}</td>
      <td style="font-weight:700;color:var(--red)">${fmt(s.valor)}</td>
      <td>${s.operador}</td>
      <td>${s.autorizado_por}</td>
    </tr>`).join('')}</tbody>
  </table></div>`:''}

  <!-- VENDAS -->
  ${vendas.length===0
    ?`<div class="empty"><div class="empty-icon">📭</div><p>Nenhuma venda neste dia</p></div>`
    :`<div class="section-hdr"><div class="section-title">Vendas do Dia</div><span style="font-size:11px;color:var(--text2)">${vendas.length} transações</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Horário</th><th>Local</th><th>Total</th><th>Pgto</th><th>Operador</th><th>Comprovante</th></tr></thead>
      <tbody>${vendas.map(v=>`<tr>
        <td>${fmtDateFull(v.criado_em)}</td><td>${v.tipo}</td>
        <td style="font-weight:600;color:var(--gold2)">${fmt(v.total)}</td>
        <td><span class="badge badge-blue" style="font-size:9px">${(pagLabels[v.pagamento]||v.pagamento||'').replace(/[💵📱💳+]/g,'').trim().toUpperCase()}</span></td>
        <td>${v.operador||''}</td>
        <td style="display:flex;gap:3px;"><button class="btn btn-teal btn-xs" onclick="verComprovante(${v.id})">🧾</button><button class="btn btn-danger btn-xs" onclick="pedirSenhaAdm('Excluir venda — senha ADM',()=>excluirVenda(${v.id},'${v.tipo}'))">🗑️</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`}

  <!-- LOG DE AÇÕES -->
  ${logs.length>0?`
  <div class="section-hdr" style="margin-top:6px">
    <div class="section-title" style="color:var(--text2);font-size:12px">🔍 Log de Ações do Dia</div>
    <span style="font-size:10px;color:var(--text3)">${logs.length} registros</span>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Horário</th><th>Operador</th><th>Ação</th><th>Detalhe</th></tr></thead>
    <tbody>${logs.map(l=>`<tr>
      <td style="font-size:11px">${fmtDateFull(l.criado_em)}</td>
      <td style="font-size:11px;font-weight:600">${l.operador}</td>
      <td><span class="badge ${l.acao.includes('SAÍDA')||l.acao.includes('CANCEL')?'badge-red':l.acao.includes('VENDA')||l.acao.includes('FECHA')?'badge-green':'badge-blue'}" style="font-size:9px">${l.acao}</span></td>
      <td style="font-size:11px;color:var(--text2)">${l.detalhe||''}</td>
    </tr>`).join('')}</tbody>

async function excluirVenda(vendaId, tipo){
  if(!confirm(`⚠️ Excluir a venda "${tipo}"?\n\nOs produtos serão devolvidos ao estoque.\n\nEssa ação não pode ser desfeita.`))return;

  try{
    // Buscar itens da venda
    const{data:itens}=await sb.from('venda_itens').select('*').eq('venda_id',vendaId);
    const I=itens||[];

    // Buscar todos os produtos uma vez
    const{data:todosProds}=await sb.from('produtos').select('*');
    const P=todosProds||[];

    // Estornar estoque de cada item
    for(const item of I){
      // Limpa emoji e espaços do nome para comparar
      const nomeLimpo=item.nome.replace(/[\u{1F300}-\u{1FFFF}]/gu,'').replace(/[\u2600-\u27FF]/g,'').trim();
      // Tenta varios métodos de match
      let prod=P.find(p=>p.nome===item.nome)
             ||P.find(p=>item.nome.includes(p.nome))
             ||P.find(p=>p.nome.includes(nomeLimpo))
             ||P.find(p=>nomeLimpo.includes(p.nome))
             ||P.find(p=>p.nome.toLowerCase()===nomeLimpo.toLowerCase());

      if(prod){
        const novoEstoque=prod.estoque+item.qty;
        await sb.from('produtos').update({estoque:novoEstoque}).eq('id',prod.id);
        // Atualiza localmente para não somar errado se mesmo produto aparecer 2x
        prod.estoque=novoEstoque;
      }
    }

    // Deletar itens e venda
    await sb.from('venda_itens').delete().eq('venda_id',vendaId);
    await sb.from('vendas').delete().eq('id',vendaId);
    await registrarLog('EXCLUIU VENDA',`ID ${vendaId} — ${tipo} — ADM: ${currentUser.nome}`);

    alert(`✅ Venda excluída com sucesso!\n${I.length} produto(s) devolvidos ao estoque.`);

    // Recarregar tela atual
    if(currentTab==='caixa') carregarCaixaDia();
    else if(currentTab==='relatorios') aplicarFiltroRelatorio();

  }catch(e){
    console.error('Erro ao excluir venda:',e);
    // Tenta excluir a venda mesmo sem estornar se o erro foi no estoque
    try{
      await sb.from('venda_itens').delete().eq('venda_id',vendaId);
      await sb.from('vendas').delete().eq('id',vendaId);
      alert('⚠️ Venda excluída mas não foi possível estornar o estoque automaticamente.\nAjuste o estoque manualmente em Produtos.');
      if(currentTab==='caixa') carregarCaixaDia();
      else if(currentTab==='relatorios') aplicarFiltroRelatorio();
    }catch(e2){
      alert('Erro ao excluir. Verifique sua conexão e tente novamente.');
    }
  }
}

async function fecharMesaVenda(id){
  // TRAVA anti-duplo-clique
  if(window._fechandoMesa){return;}
  window._fechandoMesa=true;

  // Desabilita o botão visualmente
  const btnFechar=document.querySelector(`button[onclick="fecharMesaVenda(${id})"]`);
  if(btnFechar){btnFechar.disabled=true;btnFechar.textContent='⏳ Fechando...';}

  try{
    // Verifica se mesa ainda está ocupada antes de fechar
    const{data:m}=await sb.from('mesas').select('*').eq('id',id).single();
    if(!m||m.status!=='ocupada'){
      closeModal();renderMesas();
      window._fechandoMesa=false;
      return;
    }
    const{data:itens}=await sb.from('mesa_itens').select('*').eq('mesa_id',id);
    const I=itens||[];
    if(I.length===0){
      await sb.from('mesas').update({status:'livre',aberta_em:null,pago_parcial:0}).eq('id',id);
      closeModal();renderMesas();
      window._fechandoMesa=false;
      return;
    }
    const totalBruto=I.reduce((s,i)=>s+Number(i.preco)*i.qty,0);
    const pagoParcial=m.pago_parcial||0;
    const totalFinal=totalBruto-pagoParcial;

    // Marca mesa como processando ANTES de inserir venda — evita duplo clique
    await sb.from('mesas').update({status:'livre',aberta_em:null,pago_parcial:0}).eq('id',id);

    const{data:venda}=await sb.from('vendas').insert({
      tipo:`Mesa ${id}`,
      total:totalFinal>0?totalFinal:totalBruto,
      pagamento:payAtual,
      operador:currentUser.nome
    }).select().single();

    if(venda&&I.length>0){
      await sb.from('venda_itens').insert(I.map(i=>({venda_id:venda.id,nome:i.nome,qty:i.qty,total:Number(i.preco)*i.qty})));
    }
    for(const i of I){
      const{data:p}=await sb.from('produtos').select('estoque').eq('id',i.prod_id).single();
      if(p)await sb.from('produtos').update({estoque:Math.max(0,p.estoque-i.qty)}).eq('id',i.prod_id);
      await registrarSaidaEstoque(i.nome,i.qty,`Mesa ${id}`,currentUser.nome);
    }
    await sb.from('mesa_itens').delete().eq('mesa_id',id);
    await registrarLog('FECHA MESA',`Mesa ${id} — ${fmt(totalFinal>0?totalFinal:totalBruto)} — ${payAtual}`);
    await verComprovante(venda.id);
    renderMesas();
  }catch(e){
    console.error('Erro ao fechar mesa:',e);
    alert('Erro ao fechar mesa. Tente novamente.');
  }finally{
    window._fechandoMesa=false;
  }
}
async function cancelarMesa(id){
  await sb.from('mesa_itens').delete().eq('mesa_id',id);
  await sb.from('mesas').update({status:'livre',aberta_em:null,pago_parcial:0}).eq('id',id);
  closeModal();renderMesas();
}

function addBalcao(pid,nome,preco,emoji){
  const exist=balcaoItens.find(i=>i.prodId===pid);
  if(exist)exist.qty++;else balcaoItens.push({prodId:pid,nome:emoji+' '+nome,preco,qty:1});
  renderBalcao();
}
function qtyBalcao(idx,d){
  balcaoItens[idx].qty+=d;
  if(balcaoItens[idx].qty<=0)balcaoItens.splice(idx,1);
  renderBalcao();
}
async function finalizarBalcao(){
  if(!balcaoItens.length)return;
  if(window._finalizandoBalcao)return;
  window._finalizandoBalcao=true;
  const btn=document.querySelector('button[onclick="finalizarBalcao()"]');
  if(btn){btn.disabled=true;btn.textContent='⏳ Finalizando...';}
  try{
    const total=balcaoItens.reduce((s,i)=>s+i.preco*i.qty,0);
    const{data:venda}=await sb.from('vendas').insert({tipo:'Balcão',total,pagamento:payAtual,operador:currentUser.nome}).select().single();
    if(venda){
      await sb.from('venda_itens').insert(balcaoItens.map(i=>({venda_id:venda.id,nome:i.nome,qty:i.qty,total:i.preco*i.qty})));
      for(const i of balcaoItens){
        const{data:p}=await sb.from('produtos').select('estoque').eq('id',i.prodId).single();
        if(p)await sb.from('produtos').update({estoque:Math.max(0,p.estoque-i.qty)}).eq('id',i.prodId);
        await registrarSaidaEstoque(i.nome,i.qty,'Balcão',currentUser.nome);
      }
      balcaoItens=[];
      await registrarLog('VENDA BALCÃO',`${fmt(total)} — ${payAtual}`);
      await verComprovante(venda.id);
    }
  }catch(e){
    console.error('Erro ao finalizar balcão:',e);
    alert('Erro ao finalizar. Tente novamente.');
    if(btn){btn.disabled=false;btn.textContent='✓ Finalizar';}
  }finally{
    window._finalizandoBalcao=false;
  }
}

async function confirmarEntrada(){
  const pid=parseInt(document.getElementById('ent-prod').value);
  const qty=parseInt(document.getElementById('ent-qty').value)||0;
  const custo=parseFloat(document.getElementById('ent-custo').value)||0;
  const obs=document.getElementById('ent-obs')?.value?.trim()||'';
  const dataEnt=document.getElementById('ent-data')?.value;
  const tsEntrada=dataEnt?new Date(`${dataEnt}T${new Date().toTimeString().slice(0,8)}`).toISOString():new Date().toISOString();
  const{data:prod}=await sb.from('produtos').select('*').eq('id',pid).single();
  await sb.from('produtos').update({estoque:prod.estoque+qty}).eq('id',pid);
  await sb.from('entradas').insert({produto:prod.nome,qty,custo,operador:currentUser.nome,observacao:obs,criado_em:tsEntrada});
  await registrarLog('ENTRADA ESTOQUE',`${prod.nome} +${qty} un — ${fmt(custo)}`);
  closeModal();
  await atualizarTabelaEstoque();
  await carregarHistoricoEstoque();
}

    <div class="stat-card ${totalReceber-totalPagar>=0?'stat-green':'stat-red'}"><div class="stat-label">Saldo</div><div class="stat-value">${fmt(totalReceber-totalPagar)}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

      ${pagar.map(f=>`<div class="fin-card pagar ${f.pago?'pago':''}">
        <div><div style="font-size:13px;font-weight:600">${f.descricao}</div>
          <div style="font-size:11px;color:var(--text2)">Venc: ${fmtDateOnly(f.vencimento)}</div></div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:var(--red)">${fmt(f.valor)}</div>
          ${!f.pago?`<button class="btn btn-green btn-xs" style="margin-top:3px" onclick="pagarConta(${f.id})">Pagar</button>`:'<span class="badge badge-green">PAGO</span>'}
        </div>
      </div>`).join('')||'<div class="empty"><p>Nenhuma conta</p></div>'}
    </div>
    <div>
      <div class="section-hdr"><div class="section-title" style="color:var(--green)">📥 A Receber</div>
        <button class="btn btn-green btn-sm" onclick="novaContaFinanceiro('receber')">+ Nova</button></div>
      ${receber.map(f=>`<div class="fin-card receber ${f.pago?'pago':''}">
        <div><div style="font-size:13px;font-weight:600">${f.descricao}</div>
          <div style="font-size:11px;color:var(--text2)">Venc: ${fmtDateOnly(f.vencimento)}</div></div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:var(--green)">${fmt(f.valor)}</div>

      </div>`).join('')||'<div class="empty"><p>Nenhuma conta</p></div>'}

    <select id="cmp-filtro-status" style="padding:6px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:12px;">

async function carregarCompras(){
  const ini=document.getElementById('cmp-filtro-ini')?.value||'2020-01-01';
  const fim=document.getElementById('cmp-filtro-fim')?.value||new Date().toISOString().split('T')[0];
  const status=document.getElementById('cmp-filtro-status')?.value||'';
  const tsIni=new Date(`${ini}T00:00:00`).toISOString();
  const tsFim=new Date(`${fim}T23:59:59`).toISOString();

  let query=sb.from('compras').select('*').gte('criado_em',tsIni).lte('criado_em',tsFim).order('criado_em',{ascending:false});
  if(status) query=query.eq('status',status);
  const{data:C}=await query;

  const compras=C||[];
  const totalGasto=compras.filter(c=>c.status==='recebido').reduce((s,c)=>s+Number(c.valor_total),0);
  const totalPendente=compras.filter(c=>c.status==='pendente').reduce((s,c)=>s+Number(c.valor_total),0);
  const wrap=document.getElementById('compras-conteudo');
  if(!wrap)return;

  wrap.innerHTML=`
  <!-- RESUMO -->
  <div class="stats-grid" style="margin-bottom:14px;">
    <div class="stat-card stat-red"><div class="stat-label">Total Comprado (Recebido)</div><div class="stat-value">${fmt(totalGasto)}</div><div class="stat-sub">${compras.filter(c=>c.status==='recebido').length} compras</div></div>
    <div class="stat-card"><div class="stat-label">Pendente</div><div class="stat-value" style="color:var(--gold2)">${fmt(totalPendente)}</div><div class="stat-sub">${compras.filter(c=>c.status==='pendente').length} compras</div></div>
    <div class="stat-card stat-blue"><div class="stat-label">Total no Período</div><div class="stat-value">${compras.length}</div><div class="stat-sub">compras registradas</div></div>
  </div>

  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Qtd</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>${compras.length===0
      ?`<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px">Nenhuma compra no período selecionado</td></tr>`
      :compras.map(c=>`<tr>
        <td style="font-size:11px">${fmtDateFull(c.criado_em)}</td>
        <td>${c.fornecedor}</td><td>${c.produto}</td><td>${c.qty}</td>
        <td style="font-weight:600;color:var(--red)">${fmt(c.valor_total)}</td>
        <td>
          <select onchange="alterarStatusCompra(${c.id},this.value,'${c.status}',${c.qty},'${c.produto}',${c.custo_unit||0})"
            style="padding:4px 7px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:${c.status==='recebido'?'var(--green)':c.status==='pendente'?'var(--gold2)':'var(--red)'};font-size:11px;font-weight:600;cursor:pointer;">
            <option value="pendente" ${c.status==='pendente'?'selected':''}>⏳ PENDENTE</option>
            <option value="recebido" ${c.status==='recebido'?'selected':''}>✅ RECEBIDO</option>
            <option value="cancelado" ${c.status==='cancelado'?'selected':''}>❌ CANCELADO</option>
          </select>
        </td>
        <td><button class="btn btn-secondary btn-xs" onclick="editarCompra(${c.id})">✏️</button></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

async function alterarStatusCompra(id, novoStatus, statusAtual, qty, produto, custoUnit){
  if(novoStatus===statusAtual)return;

  const msgs={
    recebido:'Marcar como RECEBIDO? O estoque será atualizado automaticamente.',
    cancelado:'Marcar como CANCELADO?',
    pendente:'Voltar para PENDENTE?'
  };
  if(!confirm(msgs[novoStatus]||'Confirmar alteração?')){
    renderCompras(); // resetar o select
    return;
  }

  await sb.from('compras').update({status:novoStatus}).eq('id',id);

  // Se mudou PARA recebido → atualiza estoque
  if(novoStatus==='recebido' && statusAtual!=='recebido'){
    const{data:prod}=await sb.from('produtos').select('*').eq('nome',produto).maybeSingle();
    if(prod){
      await sb.from('produtos').update({estoque:prod.estoque+qty,custo:custoUnit}).eq('id',prod.id);
      await sb.from('entradas').insert({produto:prod.nome,qty,custo:qty*custoUnit,operador:currentUser.nome});
    }
  }
  // Se mudou DE recebido → desconta estoque de volta
  if(statusAtual==='recebido' && novoStatus!=='recebido'){
    const{data:prod}=await sb.from('produtos').select('*').eq('nome',produto).maybeSingle();
    if(prod){
      await sb.from('produtos').update({estoque:Math.max(0,prod.estoque-qty)}).eq('id',prod.id);
    }
  }

  renderCompras();
}

async function editarCompra(id){
  const{data:c}=await sb.from('compras').select('*').eq('id',id).single();
  const{data:P}=await sb.from('produtos').select('*').order('nome');
  openModal(`<h3>✏️ Editar Compra</h3>
  <div class="modal-field"><label>Fornecedor</label><input type="text" id="ec-forn" value="${c.fornecedor}"></div>
  <div class="modal-field"><label>Produto</label>
    <select id="ec-prod">${(P||[]).map(p=>`<option value="${p.id}" data-custo="${p.custo}" ${p.nome===c.produto?'selected':''}>${p.emoji} ${p.nome}</option>`).join('')}</select>
  </div>
  <div class="modal-field"><label>Quantidade</label><input type="number" id="ec-qty" value="${c.qty}" min="1" oninput="calcTotalCompraEdit()"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="modal-field"><label>Custo Unit. (R$)</label><input type="number" id="ec-custo-unit" value="${c.custo_unit||0}" step="0.01" oninput="calcTotalCompraEdit()"></div>
    <div class="modal-field"><label>Total (R$)</label><input type="number" id="ec-total" value="${c.valor_total}" step="0.01" style="color:var(--gold2);font-weight:600"></div>
  </div>
  <div class="modal-field"><label>Status</label>
    <select id="ec-status">
      <option value="pendente" ${c.status==='pendente'?'selected':''}>⏳ Pendente</option>
      <option value="recebido" ${c.status==='recebido'?'selected':''}>✅ Recebido</option>
      <option value="cancelado" ${c.status==='cancelado'?'selected':''}>❌ Cancelado</option>
    </select>
  </div>
  <div class="modal-actions">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarEdicaoCompra(${id},'${c.status}',${c.qty},'${c.produto}')">Salvar</button>
  </div>`);
}

function calcTotalCompraEdit(){
  const q=parseInt(document.getElementById('ec-qty')?.value)||0;
  const c=parseFloat(document.getElementById('ec-custo-unit')?.value)||0;
  const t=document.getElementById('ec-total');
  if(t)t.value=(q*c).toFixed(2);
}

async function salvarEdicaoCompra(id, statusAntigo, qtyAntigo, produtoAntigo){
  const forn=document.getElementById('ec-forn').value.trim();if(!forn)return;
  const pid=parseInt(document.getElementById('ec-prod').value);
  const qty=parseInt(document.getElementById('ec-qty').value)||0;
  const custo=parseFloat(document.getElementById('ec-custo-unit').value)||0;
  const total=parseFloat(document.getElementById('ec-total').value)||0;
  const novoStatus=document.getElementById('ec-status').value;
  const{data:prod}=await sb.from('produtos').select('*').eq('id',pid).single();

  await sb.from('compras').update({fornecedor:forn,produto:prod.nome,qty,custo_unit:custo,valor_total:total,status:novoStatus}).eq('id',id);

  // Se mudou PARA recebido → atualiza estoque
  if(novoStatus==='recebido' && statusAntigo!=='recebido'){
    await sb.from('produtos').update({estoque:prod.estoque+qty,custo}).eq('id',prod.id);
    await sb.from('entradas').insert({produto:prod.nome,qty,custo:total,operador:currentUser.nome});
  }
  // Se mudou DE recebido → desconta estoque
  if(statusAntigo==='recebido' && novoStatus!=='recebido'){
    await sb.from('produtos').update({estoque:Math.max(0,prod.estoque-qtyAntigo)}).eq('id',prod.id);
  }

  closeModal();renderCompras();
}

function atualizarCustoProduto(sel){document.getElementById('cmp-custo-unit').value=sel.options[sel.selectedIndex].dataset.custo||0;calcTotalCompra();}
function calcTotalCompra(){const q=parseInt(document.getElementById('cmp-qty')?.value)||0;const c=parseFloat(document.getElementById('cmp-custo-unit')?.value)||0;const t=document.getElementById('cmp-total');if(t)t.value=(q*c).toFixed(2);}
async function salvarCompra(){
  const forn=document.getElementById('cmp-forn').value.trim();if(!forn)return;
  const pid=parseInt(document.getElementById('cmp-prod').value);
  const qty=parseInt(document.getElementById('cmp-qty').value)||0;
  const custo=parseFloat(document.getElementById('cmp-custo-unit').value)||0;
  const total=parseFloat(document.getElementById('cmp-total').value)||0;
  const status=document.getElementById('cmp-status').value;
  const{data:prod}=await sb.from('produtos').select('nome,estoque').eq('id',pid).single();
  await sb.from('compras').insert({fornecedor:forn,produto:prod.nome,qty,custo_unit:custo,valor_total:total,status});
  if(status==='recebido'){await sb.from('produtos').update({estoque:prod.estoque+qty,custo}).eq('id',pid);await sb.from('entradas').insert({produto:prod.nome,qty,custo:total,operador:currentUser.nome});}
  closeModal();renderCompras();
}

async function renderCMV(){
  const[{data:V},{data:VI},{data:P}]=await Promise.all([
    sb.from('vendas').select('*').order('criado_em',{ascending:false}),
    sb.from('venda_itens').select('*'),
    sb.from('produtos').select('*')
  ]);
  const hoje=new Date();
  const inicioMes=new Date(hoje.getFullYear(),hoje.getMonth(),1);
  const inicioSemana=new Date(hoje);
  inicioSemana.setDate(hoje.getDate()-hoje.getDay());
  function calcPeriodo(vendas){
    const totalV=vendas.reduce((s,v)=>s+Number(v.total),0);
    const idsV=new Set(vendas.map(v=>v.id));
    const itensV=(VI||[]).filter(i=>idsV.has(i.venda_id));
    const totalC=itensV.reduce((s,i)=>{const p=(P||[]).find(x=>i.nome.includes(x.nome));return s+(p?Number(p.custo)*i.qty:0);},0);
    const cmvPct=totalV>0?((totalC/totalV)*100).toFixed(1):0;
    return{totalV,totalC,cmvPct};
  }
  const diasHoje=(V||[]).filter(v=>isHojeComercial(v.criado_em));
  const diasSemana=(V||[]).filter(v=>new Date(v.criado_em)>=inicioSemana);
  const diasMes=(V||[]).filter(v=>new Date(v.criado_em)>=inicioMes);
  const dHoje=calcPeriodo(diasHoje);
  const dSem=calcPeriodo(diasSemana);
  const dMes=calcPeriodo(diasMes);
  const dTodo=calcPeriodo(V||[]);
  const porProd={};
  (VI||[]).forEach(i=>{
    const p=(P||[]).find(x=>i.nome.includes(x.nome));
    if(!porProd[i.nome])porProd[i.nome]={qty:0,vendas:0,custo:0};
    porProd[i.nome].qty+=i.qty;
    porProd[i.nome].vendas+=Number(i.total);
    porProd[i.nome].custo+=(p?Number(p.custo)*i.qty:0);
  });
  document.getElementById('tab-content').innerHTML=`
  <div class="section-hdr"><div><div class="section-title">📉 CMV — Custo da Mercadoria Vendida</div>
    <div class="section-sub">Quanto do faturamento foi para cobrir o custo dos produtos</div></div></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">CMV Hoje</div>
      <div class="stat-value" style="color:${dHoje.cmvPct<=40?'var(--green)':dHoje.cmvPct<=60?'var(--gold2)':'var(--red)'}">${dHoje.cmvPct}%</div>
      <div class="stat-sub">${fmt(dHoje.totalC)} de ${fmt(dHoje.totalV)}</div></div>
    <div class="stat-card"><div class="stat-label">CMV Semana</div>
      <div class="stat-value" style="color:${dSem.cmvPct<=40?'var(--green)':dSem.cmvPct<=60?'var(--gold2)':'var(--red)'}">${dSem.cmvPct}%</div>
      <div class="stat-sub">${fmt(dSem.totalC)} de ${fmt(dSem.totalV)}</div></div>
    <div class="stat-card"><div class="stat-label">CMV Mês</div>
      <div class="stat-value" style="color:${dMes.cmvPct<=40?'var(--green)':dMes.cmvPct<=60?'var(--gold2)':'var(--red)'}">${dMes.cmvPct}%</div>
      <div class="stat-sub">${fmt(dMes.totalC)} de ${fmt(dMes.totalV)}</div></div>
    <div class="stat-card"><div class="stat-label">CMV Total</div>
      <div class="stat-value" style="color:${dTodo.cmvPct<=40?'var(--green)':dTodo.cmvPct<=60?'var(--gold2)':'var(--red)'}">${dTodo.cmvPct}%</div>
      <div class="stat-sub">${fmt(dTodo.totalC)} de ${fmt(dTodo.totalV)}</div></div>
  </div>
  <div class="alert ${dMes.cmvPct<=40?'alert-success':dMes.cmvPct<=60?'alert-warn':'alert-danger'}">
    ${dMes.cmvPct<=40?'✅ CMV Excelente! Margem saudável acima de 60%.':dMes.cmvPct<=60?'⚠️ CMV Moderado. Revise os preços de venda para melhorar a margem.':'🚨 CMV Alto! Seus custos estão consumindo mais de 60% do faturamento. Ação necessária.'}
  </div>
  <div class="section-hdr"><div class="section-title">CMV por Produto</div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Produto</th><th>Qtd Vendida</th><th>Faturamento</th><th>Custo Total</th><th>CMV %</th><th>Margem</th></tr></thead>
    <tbody>${Object.entries(porProd).sort((a,b)=>b[1].vendas-a[1].vendas).map(([nome,d])=>{
      const cmv=d.vendas>0?((d.custo/d.vendas)*100).toFixed(0):0;
      const margem=d.vendas>0?(((d.vendas-d.custo)/d.vendas)*100).toFixed(0):0;

function aplicarAtalhoFiltro(val){
  const hoje=new Date();
  let inicio,fim;
  if(val==='hoje'){inicio=fim=hoje.toISOString().split('T')[0];}
  else if(val==='ontem'){const on=new Date(hoje);on.setDate(on.getDate()-1);inicio=fim=on.toISOString().split('T')[0];}
  else if(val==='semana'){const s=new Date(hoje);s.setDate(hoje.getDate()-hoje.getDay());inicio=s.toISOString().split('T')[0];fim=hoje.toISOString().split('T')[0];}
  else if(val==='mes'){inicio=new Date(hoje.getFullYear(),hoje.getMonth(),1).toISOString().split('T')[0];fim=hoje.toISOString().split('T')[0];}
  else if(val==='mes_passado'){const mp=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);const mpf=new Date(hoje.getFullYear(),hoje.getMonth(),0);inicio=mp.toISOString().split('T')[0];fim=mpf.toISOString().split('T')[0];}
  else if(val==='tudo'){inicio='2020-01-01';fim=hoje.toISOString().split('T')[0];}
  else return;
  document.getElementById('filtro-inicio').value=inicio;
  document.getElementById('filtro-fim').value=fim;
  document.getElementById('filtro-hora-inicio').value='00:00';
  document.getElementById('filtro-hora-fim').value='23:59';
}

async function aplicarFiltroRelatorio(){
  const dtInicio=document.getElementById('filtro-inicio')?.value;
  const dtFim=document.getElementById('filtro-fim')?.value;

  if(!dtInicio||!dtFim)return;
  const tsInicio=new Date(`${dtInicio}T${hrInicio}:00`).toISOString();
  const tsFim=new Date(`${dtFim}T${hrFim}:59`).toISOString();
  const [{data:V},{data:VI},{data:P},{data:compras}]=await Promise.all([
    sb.from('vendas').select('*').gte('criado_em',tsInicio).lte('criado_em',tsFim).order('criado_em',{ascending:false}),

let _ordemAtual={col:'qty',asc:false};
function ordenarTabelaProdutos(col){
  if(_ordemAtual.col===col)_ordemAtual.asc=!_ordemAtual.asc;
  else{_ordemAtual.col=col;_ordemAtual.asc=false;}
  const tbody=document.getElementById('tbody-produtos-rel');
  if(!tbody)return;
  const rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b)=>{
    const cols={nome:1,qty:2,total:3,custo:4,margem:5};
    const idx=cols[col]||2;
    const va=a.cells[idx]?.textContent.replace(/[R$\s%.,]/g,'').replace(',','.')||'0';
    const vb=b.cells[idx]?.textContent.replace(/[R$\s%.,]/g,'').replace(',','.')||'0';
    const na=isNaN(va)?va:parseFloat(va);
    const nb=isNaN(vb)?vb:parseFloat(vb);
    return _ordemAtual.asc?(na>nb?1:-1):(na<nb?1:-1);
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function filtrarTabelaProdutos(){
  const busca=document.getElementById('busca-produto-rel')?.value.toLowerCase()||'';
  const tbody=document.getElementById('tbody-produtos-rel');
  if(!tbody)return;
  Array.from(tbody.querySelectorAll('tr')).forEach(r=>{
    r.style.display=r.textContent.toLowerCase().includes(busca)?'':'none';
  });
}

function salvarSenhas(){
  const adm=document.getElementById('cfg-senha-adm').value.trim();
  const caixa=document.getElementById('cfg-senha-caixa').value.trim();
  if(adm)SENHAS.adm=adm;if(caixa)SENHAS.caixa=caixa;
  localStorage.setItem('malte_senhas',JSON.stringify(SENHAS));
  document.getElementById('cfg-msg').textContent='✓ Senhas salvas!';
  document.getElementById('cfg-senha-adm').value='';document.getElementById('cfg-senha-caixa').value='';
  setTimeout(()=>{document.getElementById('cfg-msg').textContent='';},3000);
}

async function initTabelas(){
  const queries=[
    `alter table mesas add column if not exists pago_parcial numeric(10,2) default 0`,
    `create table if not exists pagamentos_parciais (id bigint generated always as identity primary key, mesa_id integer, valor numeric(10,2), pagamento text, quem_pagou text, operador text, criado_em timestamptz default now())`,
    `create table if not exists tarefas (id bigint generated always as identity primary key, titulo text, descricao text, prioridade text default 'media', concluida boolean default false, criado_em timestamptz default now())`,
    `create table if not exists anotacoes (id bigint generated always as identity primary key, titulo text, conteudo text, cor text, criado_em timestamptz default now())`,
    `create table if not exists comissoes (id bigint generated always as identity primary key, funcionario text, descricao text, valor numeric(10,2), pago boolean default false, criado_em timestamptz default now())`,
    `create table if not exists saidas_caixa (id bigint generated always as identity primary key, valor numeric(10,2), motivo text, autorizado_por text, operador text, criado_em timestamptz default now())`,
    `create table if not exists saidas_estoque (id bigint generated always as identity primary key, produto text, qty integer, origem text, operador text, criado_em timestamptz default now())`,
    `create table if not exists log_acoes (id bigint generated always as identity primary key, operador text, acao text, detalhe text, criado_em timestamptz default now())`,
  ];
  for(const q of queries){await sb.rpc('exec_sql',{sql:q}).catch(()=>{});}
}
initTabelas();
