<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malte Distribuidora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2e;--card:#161928;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --gold:#d4a017;--gold2:#f0c040;--gold3:#ffd96a;--goldl:rgba(212,160,23,0.12);
  --green:#27ae60;--greenl:rgba(39,174,96,0.12);
  --red:#c0392b;--redl:rgba(192,57,43,0.12);
  --blue:#2980b9;--bluel:rgba(41,128,185,0.12);
  --purple:#7d3c98;--purplel:rgba(125,60,152,0.12);
  --orange:#e67e22;--orangel:rgba(230,126,34,0.12);
  --teal:#16a085;--teall:rgba(22,160,133,0.12);
  --text:#f0f2fa;--text2:#8a90b0;--text3:#4a5070;
  --radius:14px;--radius-sm:9px;
  --bruno:#8e44ad;--brunol:rgba(142,68,173,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
input,button,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(212,160,23,0.15) 0%,transparent 60%);}
.login-box{background:var(--card);border:1px solid rgba(212,160,23,0.2);border-radius:20px;padding:44px 40px;width:380px;text-align:center;}
.login-brand-icon{width:64px;height:64px;background:var(--goldl);border:1px solid rgba(212,160,23,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;}
.login-brand h1{font-size:22px;font-weight:700;color:var(--gold2);}
.login-brand p{color:var(--text2);font-size:12px;margin-top:3px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{padding:11px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.role-btn.active{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.field input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:border 0.2s;}
.field input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0c12;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;margin-top:8px;transition:opacity 0.2s;}
.login-btn:hover{opacity:0.9;}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px;}
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-logo{font-size:17px;font-weight:700;color:var(--gold2);}
.topbar-badge{background:var(--goldl);border:1px solid rgba(212,160,23,0.25);color:var(--gold3);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;cursor:pointer;color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.icon-btn:hover{border-color:var(--red);color:var(--red);}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;gap:2px;overflow-x:auto;}
.nav-btn{padding:12px 14px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px;}
.nav-btn:hover{color:var(--text2);}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}
.nav-btn.bruno-tab{color:#b06ed4;}
.nav-btn.bruno-tab.active{color:#d4a0f0;border-bottom-color:var(--bruno);}
.content{flex:1;padding:20px 16px;max-width:1200px;margin:0 auto;width:100%;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.8px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--gold);}
.modal-field select option{background:var(--bg3);}
.modal-field textarea{resize:vertical;min-height:80px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn{padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;}
.btn-primary{background:var(--gold);color:#0a0c12;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold2);}
.btn-secondary{background:var(--bg3);color:var(--text2);}
.btn-secondary:hover{color:var(--text);}
.btn-danger{background:var(--redl);color:var(--red);border-color:rgba(192,57,43,0.3);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{background:var(--greenl);color:var(--green);border-color:rgba(39,174,96,0.3);}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-orange{background:var(--orangel);color:var(--orange);border-color:rgba(230,126,34,0.3);}
.btn-orange:hover{background:var(--orange);color:#fff;}
.btn-teal{background:var(--teall);color:var(--teal);border-color:rgba(22,160,133,0.3);}
.btn-teal:hover{background:var(--teal);color:#fff;}
.btn-bruno{background:var(--brunol);color:var(--bruno);border-color:rgba(142,68,173,0.3);}
.btn-bruno:hover{background:var(--bruno);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:700;line-height:1;}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.stat-gold .stat-value{color:var(--gold2);}
.stat-green .stat-value{color:var(--green);}
.stat-red .stat-value{color:var(--red);}
.stat-blue .stat-value{color:var(--blue);}
.stat-orange .stat-value{color:var(--orange);}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.section-title{font-size:14px;font-weight:600;}
.section-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
th{padding:9px 12px;text-align:left;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
td{padding:9px 12px;font-size:12px;border-top:1px solid var(--border);}
tr:hover td{background:rgba(255,255,255,0.02);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-green{background:var(--greenl);color:var(--green);}
.badge-red{background:var(--redl);color:var(--red);}
.badge-gold{background:var(--goldl);color:var(--gold3);}
.badge-blue{background:var(--bluel);color:var(--blue);}
.badge-orange{background:var(--orangel);color:var(--orange);}
.badge-purple{background:var(--purplel);color:#b06ed4;}
.badge-teal{background:var(--teall);color:var(--teal);}
.badge-bruno{background:var(--brunol);color:var(--bruno);}
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;}
.mesa-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;}
.mesa-card:hover{transform:translateY(-2px);}
.mesa-card.ocupada{border-color:rgba(192,57,43,0.4);background:var(--redl);}
.mesa-card.livre{border-color:rgba(39,174,96,0.3);}
.mesa-num{font-size:18px;font-weight:700;margin-bottom:2px;}
.mesa-status{font-size:10px;font-weight:500;}
.mesa-total{font-size:11px;font-weight:600;color:var(--gold2);margin-top:3px;}
.pay-methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-bottom:12px;}
.pay-btn{padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;text-align:center;transition:all 0.2s;}
.pay-btn.sel{border-color:var(--gold);color:var(--gold3);background:var(--goldl);}
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px;}
.alert-warn{background:var(--goldl);border:1px solid rgba(212,160,23,0.3);color:var(--gold3);}
.alert-danger{background:var(--redl);border:1px solid rgba(192,57,43,0.3);color:#e88;}
.alert-success{background:var(--greenl);border:1px solid rgba(39,174,96,0.3);color:#5d9;}
.alert-bruno{background:var(--brunol);border:1px solid rgba(142,68,173,0.3);color:#d4a0f0;}
.senha-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:600;align-items:center;justify-content:center;}
.senha-overlay.open{display:flex;}
.senha-box{background:var(--card);border:1px solid rgba(212,160,23,0.3);border-radius:18px;padding:28px;width:300px;text-align:center;}
.senha-box h3{font-size:15px;margin-bottom:5px;}
.senha-box p{font-size:12px;color:var(--text2);margin-bottom:16px;}
.senha-box input{width:100%;padding:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:18px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:10px;}
.senha-box input:focus{border-color:var(--gold);}
.item-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:var(--radius-sm);padding:9px 12px;border:1px solid var(--border);margin-bottom:5px;}
.qty-ctrl{display:flex;align-items:center;gap:5px;}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--gold);}
.qty-num{font-size:13px;font-weight:600;min-width:18px;text-align:center;}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all 0.2s;position:relative;}
.prod-card:hover{border-color:var(--gold);transform:translateY(-1px);}
.promo-badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;}
.empty{text-align:center;padding:36px 16px;color:var(--text3);}
.empty-icon{font-size:32px;margin-bottom:8px;}
.caixa-status{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.caixa-aberto{border-color:rgba(39,174,96,0.4);}
.caixa-fechado{border-color:rgba(192,57,43,0.4);}
.fin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.fin-card.pagar{border-left:3px solid var(--red);}
.fin-card.receber{border-left:3px solid var(--green);}
.fin-card.pago{opacity:0.5;}
.comprovante{background:#fff;color:#000;padding:20px;border-radius:var(--radius);font-family:'Courier New',monospace;font-size:12px;line-height:1.6;max-width:320px;margin:0 auto;}
.comprovante h2{text-align:center;font-size:14px;margin-bottom:4px;}
.comprovante .linha{border-top:1px dashed #000;margin:8px 0;}
.comprovante .item{display:flex;justify-content:space-between;}
.comprovante .total{font-weight:700;font-size:14px;}
.tarefa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.tarefa-card.concluida{opacity:0.5;}
.tarefa-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.tarefa-check.ok{background:var(--green);border-color:var(--green);color:#fff;font-size:12px;}
.tarefa-prioridade{width:4px;height:40px;border-radius:2px;flex-shrink:0;}
.nota-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.nota-card:hover{border-color:var(--border2);}
.cmv-bar{height:12px;border-radius:6px;background:var(--bg3);overflow:hidden;margin-top:8px;}
.cmv-fill{height:100%;border-radius:6px;transition:width 0.5s;}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr;}.content{padding:12px 10px;}}
@media print{body{background:#fff !important;}#app .topbar,#app .nav,.no-print{display:none !important;}.print-area{display:block !important;position:static !important;width:100% !important;}.print-area *{visibility:visible !important;}body *{visibility:hidden;}.print-area,.print-area *{visibility:visible;}.print-area{position:fixed;top:0;left:0;width:100%;}}
.relatorio-pdf-area{background:#fff;color:#000;padding:30px;font-family:'Segoe UI',sans-serif;font-size:13px;}
.relatorio-pdf-area h1{font-size:20px;font-weight:700;margin-bottom:4px;color:#1a1a2e;}
.relatorio-pdf-area .rel-sub{font-size:11px;color:#666;margin-bottom:20px;}
.relatorio-pdf-area table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.relatorio-pdf-area th{background:#1a1e2e;color:#f0c040;padding:8px 10px;font-size:11px;text-align:left;}
.relatorio-pdf-area td{padding:7px 10px;border-bottom:1px solid #eee;font-size:12px;}
</style>
</head>
<body>
<div id="loading-screen"><div class="spinner"></div><div style="color:var(--text2);font-size:14px">Carregando Malte Sistema...</div></div>
<div id="login-screen">
  <div class="login-box">
    <div class="login-brand"><div class="login-brand-icon">🍺</div><h1>Malte Distribuidora</h1><p>Sistema de Gestão v4.2</p></div>
    <div class="login-roles">
      <button class="role-btn active" onclick="setRole('adm')">👑 Administrador</button>
      <button class="role-btn" onclick="setRole('caixa')">🧾 Caixa</button>
    </div>
    <input id="login-user" type="hidden" value="adm">
    <div class="field" id="login-operador-field" style="display:none"><label>Operador</label>
      <select id="login-operador" style="width:100%;padding:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;">
        <option value="">Carregando...</option>
      </select>
    </div>
    <div class="field"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Entrar no Sistema</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;"><span class="topbar-logo">🍺 Malte</span><span class="topbar-badge" id="top-role-badge">ADM</span></div>
    <div class="topbar-right"><span class="user-pill" id="top-user-pill">Administrador</span><button class="icon-btn" onclick="doLogout()" title="Sair">✕</button></div>
  </div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="goTab('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="goTab('caixa')">💰 Caixa</button>
    <button class="nav-btn" onclick="goTab('mesas')">🍺 Mesas</button>
    <button class="nav-btn" onclick="goTab('balcao')">🛒 Balcão</button>
    <button class="nav-btn" onclick="goTab('festa')">🎉 Festa</button>
    <button class="nav-btn adm-only" onclick="goTab('prevfesta')">🎪 Previsão Festa</button>
    <button class="nav-btn adm-only" onclick="goTab('estoque')">📦 Estoque</button>
    <button class="nav-btn adm-only bruno-tab" onclick="goTab('bruno')">👤 Bruno</button>
    <button class="nav-btn adm-only" onclick="goTab('copao')">🥤 Copão</button>
    <button class="nav-btn adm-only" onclick="goTab('produtos')">🏷️ Produtos</button>
    <button class="nav-btn adm-only" onclick="goTab('financeiro')">💳 Financeiro</button>
    <button class="nav-btn adm-only" onclick="goTab('compras')">🛍️ Compras</button>
    <button class="nav-btn adm-only" onclick="goTab('cmv')">📉 CMV</button>
    <!-- aba Comissões oculta (dados mantidos no Supabase) -->
    <!-- aba Tarefas oculta (dados mantidos no Supabase) -->
    <button class="nav-btn" onclick="goTab('funcionarios')">👷 Funcionários</button>
    <button class="nav-btn" onclick="goTab('anotacoes')">📝 Notas</button>
    <button class="nav-btn adm-only" onclick="goTab('relatoriodia')">📋 Relatório Dia</button>
    <button class="nav-btn adm-only" onclick="goTab('relatorios')">📈 Relatórios</button>
    <button class="nav-btn adm-only" onclick="goTab('configuracoes')">⚙️ Config</button>
  </div>
  <div class="content" id="tab-content"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>
</div>
<div class="senha-overlay" id="senha-overlay">
  <div class="senha-box">
    <h3>🔐 Área Restrita</h3><p id="senha-msg">Digite a senha do Administrador</p>
    <input type="password" id="senha-input" placeholder="••••••" onkeydown="if(event.key==='Enter')checkSenha()">
    <div style="display:flex;gap:8px;"><button class="btn btn-secondary" style="flex:1" onclick="closeSenha()">Cancelar</button><button class="btn btn-primary" style="flex:1" onclick="checkSenha()">Confirmar</button></div>
    <div style="color:var(--red);font-size:12px;margin-top:6px;min-height:16px" id="senha-err"></div>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<div id="print-area" class="print-area" style="display:none"></div>
<script>
const SUPABASE_URL='https://akicvaywryppktjiccpi.supabase.co';
const SUPABASE_KEY='sb_publishable_KlSN5wVH24AYhF7kjEU0pg_NnVl2SQg';

    const ls=document.getElementById('loading-screen');

function renderSplitArea(){
  const area=document.getElementById('split-area');if(!area)return;
  const totalRef=window._splitTotalRef||0;
  const alocado=splitPagamentos.reduce((s,r)=>s+(Number(r.valor)||0),0);
  const falta=totalRef-alocado;

  area.innerHTML=`
    <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px;margin-top:8px;">
      <div style="font-size:11px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">🔀 Pagamento em duas ou mais formas</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:9px;">
        ${splitPagamentos.map((r,idx)=>`
          <div style="display:flex;gap:6px;align-items:center;">
            <select onchange="atualizarMetodoSplit(${idx},this.value)" style="flex:1;padding:10px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;">
              ${Object.entries(metodos).map(([k,v])=>`<option value="${k}" ${r.metodo===k?'selected':''}>${v}</option>`).join('')}
            </select>
            <input type="number" step="0.01" min="0" value="${r.valor}" oninput="atualizarValorSplit(${idx},this.value)" style="width:110px;padding:10px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-weight:600;text-align:right;">
            <button type="button" class="btn btn-danger btn-xs" onclick="removerSplitRow(${idx})">✕</button>
          </div>`).join('')}
      </div>
      <button type="button" class="btn btn-secondary btn-sm" style="width:100%;margin-bottom:9px;" onclick="adicionarSplitRow()">+ Adicionar forma de pagamento</button>
      <div id="split-resumo" style="font-size:12px;font-weight:600;margin-bottom:9px;color:${Math.abs(falta)<0.01?'var(--green)':'var(--red)'}">
        Total: ${fmt(totalRef)} &nbsp;|&nbsp; Alocado: ${fmt(alocado)} &nbsp;|&nbsp; ${Math.abs(falta)<0.01?'✓ Confere':'Falta: '+fmt(falta)}
      </div>
      <button type="button" class="btn btn-primary" style="width:100%" onclick="confirmarSplitPagamento()">✓ Confirmar Divisão</button>
    </div>`;

function adicionarSplitRow(){splitPagamentos.push({metodo:'dinheiro',valor:0});renderSplitArea();}
function removerSplitRow(idx){splitPagamentos.splice(idx,1);renderSplitArea();}
function atualizarMetodoSplit(idx,val){splitPagamentos[idx].metodo=val;}
function atualizarValorSplit(idx,val){
  splitPagamentos[idx].valor=parseFloat(val)||0;

function confirmarSplitPagamento(){
  const totalRef=window._splitTotalRef||0;

async function calcularGraficoDashboard(iniDate,fimDate){
  const{data:V}=await sb.from('vendas').select('*').gte('criado_em',iniDate.toISOString()).lte('criado_em',fimDate.toISOString()).order('criado_em',{ascending:true});
  const vendasPeriodo=V||[];
  const diasMs=Math.round((fimDate-iniDate)/(1000*60*60*24));
  const numDias=Math.max(1,diasMs);
  const dias=[];
  for(let i=numDias-1;i>=0;i--){
    const ini_i=new Date(iniDate);ini_i.setDate(ini_i.getDate()+(numDias-1-i));
    const fim_i=new Date(ini_i);fim_i.setDate(fim_i.getDate()+1);fim_i.setMilliseconds(fim_i.getMilliseconds()-1);
    const total_i=vendasPeriodo.filter(v=>{const dt=new Date(v.criado_em);return dt>=ini_i&&dt<=fim_i;}).reduce((s,v)=>s+Number(v.total),0);
    dias.push({label:ini_i.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),total:total_i});
  }
  const totalPeriodo=vendasPeriodo.reduce((s,v)=>s+Number(v.total),0);
  // período anterior de mesmo tamanho, pra comparação
  const iniAnterior=new Date(iniDate);iniAnterior.setDate(iniAnterior.getDate()-numDias);
  const fimAnterior=new Date(iniDate);fimAnterior.setMilliseconds(fimAnterior.getMilliseconds()-1);
  const{data:Vant}=await sb.from('vendas').select('total').gte('criado_em',iniAnterior.toISOString()).lte('criado_em',fimAnterior.toISOString());
  const totalAnterior=(Vant||[]).reduce((s,v)=>s+Number(v.total),0);
  const variacaoPeriodo=totalAnterior>0?((totalPeriodo-totalAnterior)/totalAnterior*100):(totalPeriodo>0?100:0);
  const max=Math.max(...dias.map(d=>d.total),1);
  const larguraMin=dias.length>14?'22px':'auto';
  const graficoHtml=`<div style="display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 0;overflow-x:auto;">
    ${dias.map(d=>`<div style="flex:1;min-width:${larguraMin};display:flex;flex-direction:column;align-items:center;gap:4px;" title="${d.label}: ${fmt(d.total)}">
      ${dias.length<=14?`<div style="font-size:8.5px;color:var(--text2)">${d.total>0?fmt(d.total).replace('R$ ',''):''}</div>`:''}
      <div style="width:100%;background:var(--gold);border-radius:3px 3px 0 0;height:${Math.max(3,(d.total/max)*70)}px;"></div>
      <div style="font-size:8px;color:var(--text2)">${d.label}</div>
    </div>`).join('')}
  </div>`;
  const container=document.getElementById('dash-graf-container');if(container)container.innerHTML=graficoHtml;
  const comp=document.getElementById('dash-graf-comparacao');
  if(comp)comp.innerHTML=`Total do período: <b style="color:var(--gold2)">${fmt(totalPeriodo)}</b> · <span style="color:${variacaoPeriodo>=0?'var(--green)':'var(--red)'}">${variacaoPeriodo>=0?'↑':'↓'} ${Math.abs(variacaoPeriodo).toFixed(0)}%</span> vs período anterior equivalente`;
}

  const{fim:fimHoje}=getDiaComercial();
  const ini=new Date(fimHoje);ini.setDate(ini.getDate()-dias+1);ini.setHours(6,0,0,0);
  const fim=new Date(fimHoje);
  calcularGraficoDashboard(ini,fim);
}

function bucketFormaPagamento(formaRaw){
  const f=(formaRaw||'').toLowerCase();
  if(f.includes('dinheiro'))return'dinheiro';
  if(f.includes('pix'))return'pix';
  if(f.includes('débito')||f.includes('debito')||f.includes('crédito')||f.includes('credito')||f.includes('cartao')||f.includes('cartão'))return'cartao';
  return'outro';
}
function extrairFormasPagamento(v){
  const raw=v.pagamento||'';
  if(raw.includes('R$')){
    return raw.split(' + ').map(p=>{
      const m=p.match(/^(.+?)\s+R\$\s*([\d.,]+)$/);
      if(!m)return{forma:'outro',valor:0};
      return{forma:bucketFormaPagamento(m[1]),valor:parseFloat(m[2].replace(/\./g,'').replace(',','.'))||0};
    });
  }

    const perdasHtml=perdas.length===0?'':`<h2>🗑 Perdas do Dia</h2>
      <table><thead><tr><th>Horário</th><th>Produto</th><th>Qtd</th><th>Motivo</th><th>Custo Total</th><th>Operador</th></tr></thead>
      <tbody>${perdas.map(p=>`<tr><td>${fmtDateFull(p.criado_em)}</td><td>${p.produto}</td><td>-${p.qty}</td><td>${p.motivo}</td><td>${fmt(p.custo_total)}</td><td>${p.operador||''}</td></tr>`).join('')}</tbody></table>`;

async function lancarMesaNoFuncionario(id){
  if(window._fechandoMesa)return;const nome=funcDaMesa(id);if(!nome)return;
  window._fechandoMesa=true;
  try{
    const{data:itens,error:eI}=await sb.from('mesa_itens').select('*').eq('mesa_id',id);if(eI)throw eI;const I=itens||[];
    if(!I.length){closeModal();return;}
    const total=I.reduce((s,i)=>s+Number(i.preco)*i.qty,0);
    if(!confirm(`Lançar ${fmt(total)} no consumo de ${nome}?`))return;
    const data=hojeLocalStr(getDiaComercial().inicio);
    // O estoque já foi descontado quando os itens entraram na comanda — aqui não desconta de novo.
    const linhas=I.map(i=>({funcionario:nome,tipo:'consumo',descricao:`${i.qty}x ${String(i.nome||'').replace(/^\S+\s/,'')}`,qty:i.qty,valor:Number(i.preco)*i.qty,prod_id:i.prod_id,data,operador:currentUser.nome,fechado:false}));
    const{error}=await sb.from('func_lancamentos').insert(linhas);
    if(error){alert('Erro ao lançar no funcionário: '+error.message+'\n\nA mesa NÃO foi fechada.');return;}
    await sb.from('mesa_itens').delete().eq('mesa_id',id);
    await sb.from('mesas').update({status:'livre',aberta_em:null,pago_parcial:0}).eq('id',id);
    try{await registrarLog('Consumo funcionário (mesa)',`${nome}: ${fmt(total)}`);}catch(e){}
    closeModal();alert(`✓ ${fmt(total)} lançado no consumo de ${nome}.`);
  }catch(e){alert('Erro: '+e.message);}
  finally{window._fechandoMesa=false;renderMesas();}
}

async function confirmarPagamentoParcial(mesaId){
  const metodo=document.getElementById('parcial-metodo').value;
  const valor=parseFloat(document.getElementById('parcial-valor').value)||0;
  if(valor<=0){alert('Informe um valor válido.');return;}
  try{
    const{data:m}=await sb.from('mesas').select('*').eq('id',mesaId).single();
    if(!m){alert('Mesa não encontrada.');return;}
    const{data:itens}=await sb.from('mesa_itens').select('*').eq('mesa_id',mesaId);
    const totalItens=(itens||[]).reduce((s,i)=>s+Number(i.preco)*i.qty,0);
    const jaPago=m.pago_parcial||0;
    const restanteAtual=totalItens-jaPago;
    if(valor>restanteAtual+0.01){alert('O valor informado é maior que o restante da conta ('+fmt(restanteAtual)+').');return;}
    const nomes={dinheiro:'Dinheiro',pix:'PIX',debito:'Débito',credito:'Crédito'};
    const{error:eVenda}=await sb.from('vendas').insert({tipo:`Mesa ${mesaId} (Parcial)`,total:valor,pagamento:nomes[metodo]||metodo,operador:currentUser.nome});
    if(eVenda){alert('Erro ao registrar pagamento: '+eVenda.message);return;}
    await sb.from('mesas').update({pago_parcial:jaPago+valor}).eq('id',mesaId);
    try{await registrarLog('PAGAMENTO PARCIAL',`Mesa ${mesaId} — ${fmt(valor)} via ${nomes[metodo]||metodo}`);}catch(e){}
    await modalMesaAberta(mesaId);
  }catch(e){alert('Erro ao registrar pagamento parcial: '+e.message);}
}

async function addBalcao(pid,nome,preco,emoji){
  const nomeFull=emoji+' '+nome;
  // mostra na hora
  const e=balcaoItens.find(i=>i.prodId===pid&&i.preco===Number(preco));if(e)e.qty++;else balcaoItens.push({prodId:pid,nome:nomeFull,preco:Number(preco),qty:1,rows:[]});
  desenharCarrinhoBalcao();
  window._balcaoMexendo=(window._balcaoMexendo||0)+1;
  try{
    let{error}=await sb.from('balcao_itens').insert({prod_id:pid,nome:nomeFull,preco,qty:1,operador:currentUser?currentUser.nome:'',estoque_baixado:true});
    if(error&&/estoque_baixado/i.test(error.message||'')){
      // coluna ainda não criada: registra sem baixar (o Finalizar baixa)
      ({error}=await sb.from('balcao_itens').insert({prod_id:pid,nome:nomeFull,preco,qty:1,operador:currentUser?currentUser.nome:''}));
      if(error)throw error;
    }else{
      if(error)throw error;
      await descontarEstoqueItem(pid,1,'balcao');
    }
  }catch(err){alert('Erro ao adicionar no carrinho: '+err.message);}
  finally{window._balcaoMexendo--;if(!window._balcaoMexendo){await carregarBalcaoRemoto();desenharCarrinhoBalcao();atualizarBadgesEstoqueBalcao();}}
}
function qtyBalcao(idx,d){
  const item=balcaoItens[idx];if(!item)return;
  if(d>0){addBalcao(item.prodId,item.nome.replace(/^\S+\s/,''),item.preco,item.nome.split(' ')[0]);return;}
  pedirSenhaAdm('Remover item do balcão requer senha ADM',async()=>{
    await carregarBalcaoRemoto();
    const it=balcaoItens.find(i=>i.prodId===item.prodId&&i.preco===item.preco);if(!it||!it.rows.length){desenharCarrinhoBalcao();return;}
    const r=it.rows[it.rows.length-1];
    try{
      if(r.qty>1)await sb.from('balcao_itens').update({qty:r.qty-1}).eq('id',r.id);else await sb.from('balcao_itens').delete().eq('id',r.id);
      if(r.estoque_baixado)await devolverEstoqueItem(it.prodId,1,'balcao (removido)');
      try{await registrarLog('BALCÃO - REMOVEU ITEM',`${it.nome} -1 (por: ${currentUser?currentUser.nome:'?'})`);}catch(e){}
    }catch(e){alert('Erro ao remover: '+e.message);}
    await carregarBalcaoRemoto();desenharCarrinhoBalcao();
  });
}
function limparBalcao(){
  if(!balcaoItens.length)return;
  pedirSenhaAdm('Limpar o carrinho do balcão requer senha ADM',async()=>{
    if(!confirm('Limpar todos os itens do carrinho?'))return;
    await carregarBalcaoRemoto();
    const ids=balcaoRows.map(r=>r.id);const resumo=balcaoItens.map(i=>`${i.qty}x ${i.nome}`).join(', ');
    const rowsLimpar=balcaoRows.slice();
    if(ids.length){const{error}=await sb.from('balcao_itens').delete().in('id',ids);if(error){alert('Erro ao limpar: '+error.message);return;}}
    for(const r of rowsLimpar){if(r.estoque_baixado)await devolverEstoqueItem(r.prod_id,r.qty,'balcao (limpou)');}
    try{await registrarLog('BALCÃO - LIMPOU CARRINHO',`${resumo} (por: ${currentUser?currentUser.nome:'?'})`);}catch(e){}
    await carregarBalcaoRemoto();desenharCarrinhoBalcao();
  });
}
async function finalizarBalcao(){
  if(window._finalizandoBalcao)return;window._finalizandoBalcao=true;
  try{
    // espera os toques pendentes e pega o carrinho atualizado do banco
    let n=0;while(window._balcaoMexendo&&n<50){await new Promise(r=>setTimeout(r,100));n++;}
    const ok=await carregarBalcaoRemoto();if(!ok)throw new Error('sem conexão com o carrinho');
    const rowsSnap=balcaoRows.slice();const itens=agregarBalcao(rowsSnap);
    if(!itens.length){desenharCarrinhoBalcao();return;}
    const total=itens.reduce((s,i)=>s+i.preco*i.qty,0);
    const{data:venda,error:eV}=await sb.from('vendas').insert({tipo:'Balcão',total,pagamento:payAtual,operador:currentUser.nome}).select().single();
    if(eV||!venda)throw new Error(eV?eV.message:'venda não criada');
    // tira do carrinho compartilhado primeiro (evita outro aparelho finalizar de novo)
    await sb.from('balcao_itens').delete().in('id',rowsSnap.map(r=>r.id));
    await sb.from('venda_itens').insert(itens.map(i=>({venda_id:venda.id,nome:i.nome,qty:i.qty,total:i.preco*i.qty})));
    // baixa só o que ainda não tinha sido baixado ao adicionar
    for(const r of rowsSnap){if(!r.estoque_baixado)await descontarEstoqueItem(r.prod_id,r.qty,'balcao (finalizado)');}
    balcaoRows=[];balcaoItens=[];payAtual='dinheiro';
    atualizarBadgesEstoqueBalcao();
    await verComprovante(venda.id);
  }catch(e){console.error(e);alert('Erro ao finalizar: '+e.message+'. Tente novamente.');}
  finally{window._finalizandoBalcao=false;}
}

function tocarProdutoFesta(ev,prodId,nome,preco,emoji){
  if(!festaAtual)return;

async function processarFilaFesta(){
  if(festaFilaRodando)return;festaFilaRodando=true;festaSyncUI();
  try{
    while(festaFila.length){
      const v=festaFila[0];
      try{
        const{data:item,error}=await sb.from('festa_itens').insert({festa_id:festaAtual.id,produto_id:v.prodId,produto_nome:v.nome,emoji:v.emoji,preco:v.preco,qty:1}).select().single();
        if(error)throw error;
        window._festaItensCache=window._festaItensCache||[];window._festaItensCache.push(item);
        lastFestaEvent={type:'venda',id:item.id,produto_id:v.prodId,qty:1};
        festaFila.shift();
        await descontarEstoqueItem(v.prodId,1,'festa');
      }catch(e){
        console.error(e);
        // desfaz o +1 visual das vendas que não foram salvas
        festaFila.forEach(f=>{festaVendidos[f.prodId]=Math.max(0,(festaVendidos[f.prodId]||1)-1);});
        festaFila=[];atualizarContadoresFestaUI();
        alert('Erro ao registrar venda: '+e.message+'\n\nVerifique a internet e toque de novo nos produtos que não ficaram salvos.');
        break;
      }
    }
  }finally{festaFilaRodando=false;festaSyncUI();atualizarContadoresFestaUI();}
}
async function esperarFilaFesta(){let n=0;while((festaFila.length||festaFilaRodando)&&n<200){await new Promise(r=>setTimeout(r,100));n++;}}
async function desfazerUltimaFesta(){
  await esperarFilaFesta();
  if(!lastFestaEvent)return;
  try{
    if(lastFestaEvent.type==='venda'){
      await sb.from('festa_itens').delete().eq('id',lastFestaEvent.id);
      await devolverEstoqueItem(lastFestaEvent.produto_id,lastFestaEvent.qty);
      festaVendidos[lastFestaEvent.produto_id]=Math.max(0,(festaVendidos[lastFestaEvent.produto_id]||1)-lastFestaEvent.qty);
      window._festaItensCache=(window._festaItensCache||[]).filter(i=>i.id!==lastFestaEvent.id);
      const nm=((window._festaProdsCache||[]).find(p=>p.id===lastFestaEvent.produto_id)||{}).nome||'';
      festaToast('↩ Desfeito '+nm);
    }
    lastFestaEvent=null;
    await desenharFesta();
  }catch(e){alert('Erro ao desfazer: '+e.message);}
}

function atualizarDiffPagamentoFesta(){

async function finalizarFechamentoFesta(){
  if(window._fechamentoLock)return;window._fechamentoLock=true;
  try{
    // Validação: não deixa fechar a festa sem informar os pagamentos (antes, com tudo em 0, nenhuma venda ia pro caixa)
    const _totVend=(window._festaItensCache||[]).reduce((s,i)=>s+i.preco*i.qty,0);
    const _d=parseFloat(document.getElementById('festa-pag-dinheiro')?.value)||0;
    const _c=parseFloat(document.getElementById('festa-pag-cartao')?.value)||0;
    const _p=parseFloat(document.getElementById('festa-pag-pix')?.value)||0;
    const _somaPag=_d+_c+_p;
    if(_totVend>0&&_somaPag<=0){alert('Informe quanto entrou em Dinheiro, Cartão e Pix antes de fechar a festa.\n\nTotal vendido: '+fmt(_totVend));return;}
    if(_totVend>0&&Math.abs(_totVend-_somaPag)>=0.01){
      if(!confirm('Os pagamentos informados ('+fmt(_somaPag)+') não batem com o total vendido ('+fmt(_totVend)+').\n\nFechar mesmo assim?'))return;
    }
    // Data da venda = dia em que a festa foi aberta (assim o relatório do caixa mostra no dia da festa, mesmo fechando de madrugada ou no dia seguinte)
    const _dataVendaFesta=festaAtual.aberta_em||new Date().toISOString();
    for(const pr of festaPerdasTemp){
      const custoTotal=pr.qty*pr.custo_unit;
      const{error:ePerda}=await sb.from('perdas').insert({produto:pr.nome,qty:pr.qty,custo_unit:pr.custo_unit,custo_total:custoTotal,motivo:pr.motivo,observacao:'Festa: '+festaAtual.nome,operador:currentUser.nome,criado_em:new Date().toISOString()});
      if(ePerda)throw new Error('Erro ao registrar perda de '+pr.nome+': '+ePerda.message);
      await descontarEstoqueItem(pr.produto_id,pr.qty);
    }
    const dinheiro=parseFloat(document.getElementById('festa-pag-dinheiro')?.value)||0;
    const cartao=parseFloat(document.getElementById('festa-pag-cartao')?.value)||0;
    const pix=parseFloat(document.getElementById('festa-pag-pix')?.value)||0;
    const pagamentos=[{metodo:'dinheiro',valor:dinheiro},{metodo:'cartao',valor:cartao},{metodo:'pix',valor:pix}].filter(p=>p.valor>0);
    const itensAgregados={};(window._festaItensCache||[]).forEach(i=>{
      if(!itensAgregados[i.produto_nome])itensAgregados[i.produto_nome]={qty:0,total:0};
      itensAgregados[i.produto_nome].qty+=i.qty;itensAgregados[i.produto_nome].total+=i.preco*i.qty;
    });
    let primeiraVendaId=null;
    for(const pg of pagamentos){
      const{data:vendaCriada,error:eVenda}=await sb.from('vendas').insert({tipo:'Festa - '+festaAtual.nome,total:pg.valor,pagamento:pg.metodo,operador:currentUser.nome,criado_em:_dataVendaFesta}).select().single();
      if(eVenda)throw new Error('Erro ao lançar venda no caixa ('+pg.metodo+'): '+eVenda.message);
      if(!primeiraVendaId)primeiraVendaId=vendaCriada.id;
    }
    if(primeiraVendaId&&Object.keys(itensAgregados).length>0){
      const itensParaSalvar=Object.keys(itensAgregados).map(nome=>({venda_id:primeiraVendaId,nome,qty:itensAgregados[nome].qty,total:itensAgregados[nome].total}));
      const{error:eItens}=await sb.from('venda_itens').insert(itensParaSalvar);
      if(eItens)console.error('Erro ao salvar itens da festa para o comprovante:',eItens.message);
    }
    const chkAbrir=document.getElementById('festa-abrir-caixa-chk');
    if(chkAbrir&&chkAbrir.checked){
      const troco=parseFloat(document.getElementById('festa-troco-inicial')?.value)||0;
      const{error:eCaixa}=await sb.from('caixa_status').upsert({id:1,aberto:true,abertura:new Date().toISOString(),troco,operador:currentUser.nome});
      if(eCaixa)throw new Error('Erro ao abrir caixa: '+eCaixa.message);
    }
    const inputs=document.querySelectorAll('.festa-contagem-input');
    const contagens={};inputs.forEach(i=>{if(i.value!=='')contagens[i.getAttribute('data-pid')]=Number(i.value);});
    const{data:prods}=await sb.from('produtos').select('*');const prodMap={};(prods||[]).forEach(p=>prodMap[p.id]=p);
    const inicial=festaAtual.estoque_inicial||{};
    const idsRelevantes=new Set([...Object.keys(festaVendidos),...Object.keys(festaRetirados),...festaPerdasTemp.map(p=>p.produto_id)].map(Number));
    const relatorio=[...idsRelevantes].map(pid=>{
      const p=prodMap[pid]||{nome:'Produto #'+pid};
      const vend=festaVendidos[pid]||0,ret=festaRetirados[pid]||0;
      const perda=festaPerdasTemp.filter(x=>x.produto_id===pid).reduce((s,x)=>s+x.qty,0);
      const ini=inicial[pid]!=null?inicial[pid]:(p.estoque+vend+ret+perda);
      const atual=p.estoque!=null?p.estoque:0;
      const esperado=ini-vend-ret-perda;
      const contagem=contagens[pid]!=null?contagens[pid]:null;
      return{produto_id:pid,nome:p.nome,vendido:vend,retirado:ret,perdido:perda,estoque_inicial:ini,estoque_atual:atual,esperado,dif_sistema:esperado-atual,contagem_fisica:contagem,dif_fisica:contagem!=null?contagem-atual:null};
    });
    const fechamentoCompleto={produtos:relatorio,pagamentos:{dinheiro,cartao,pix},caixa_aberto_no_fechamento:!!(chkAbrir&&chkAbrir.checked)};
    await sb.from('festas').update({status:'fechada',fechada_em:new Date().toISOString(),fechamento:fechamentoCompleto}).eq('id',festaAtual.id);
    festaPerdasTemp=[];closeModal();lastFestaEvent=null;festaAtual=null;await renderFesta();
    alert('✓ Festa encerrada! Vendas lançadas no Caixa.');
  }catch(e){alert('Erro ao encerrar festa: '+e.message);}
  finally{window._fechamentoLock=false;}
}

// ══════════════════════════════════════════════
// 🥤 COPÃO — estoque próprio (pool separado) a partir de Bally/Gin/Gelo
// ══════════════════════════════════════════════
const COPAO_BALLY_ML=2000;   // 1 garrafa de Bally = 2000ml
const COPAO_GIN_ML=900;      // 1 garrafa de Gin = 900ml
const COPAO_CONSUMO_BALLY=200; // ml de Bally por copão
const COPAO_CONSUMO_GIN_NORMAL=100; // ml de Gin por copão (sem promoção)
const COPAO_CONSUMO_GIN_PROMO=50;   // ml de Gin por copão (com promoção ativa)
const COPAO_CONSUMO_GELO=1; // unidades de gelo de sabor por copão

function normalizarTexto(s){return(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
function isCopao(nome){return normalizarTexto(nome)==='copao';}

async function getCopaoProduto(){
  const{data}=await sb.from('produtos').select('*').order('id');
  return(data||[]).find(p=>isCopao(p.nome))||null;
}
async function getCopaoEstoqueRow(){
  const{data}=await sb.from('copao_estoque').select('*').eq('id',1).maybeSingle();
  if(data)return data;
  // cria a linha se ainda não existir
  const{data:novo}=await sb.from('copao_estoque').insert({id:1,bally_ml:0,gin_ml:0,gelo_un:0}).select().single();
  return novo||{id:1,bally_ml:0,gin_ml:0,gelo_un:0};
}
function copaoGinPorUnidade(copaoProd){return(copaoProd&&copaoProd.em_promo)?COPAO_CONSUMO_GIN_PROMO:COPAO_CONSUMO_GIN_NORMAL;}
function copaoCalcularDisponiveis(ce,copaoProd){
  const ginPorUn=copaoGinPorUnidade(copaoProd);
  return Math.max(0,Math.min(
    Math.floor((ce.bally_ml||0)/COPAO_CONSUMO_BALLY),
    Math.floor((ce.gin_ml||0)/ginPorUn),
    Math.floor(ce.gelo_un||0)
  ));
}
async function sincronizarEstoqueCopao(){
  try{
    const copaoProd=await getCopaoProduto();
    if(!copaoProd)return; // produto "Copão" ainda não foi criado em Produtos
    const ce=await getCopaoEstoqueRow();
    const disponiveis=copaoCalcularDisponiveis(ce,copaoProd);
    await sb.from('produtos').update({estoque:disponiveis}).eq('id',copaoProd.id);
  }catch(e){console.error('Erro ao sincronizar estoque do Copão:',e);}
}

// Chamado pelas rotinas de venda no lugar do desconto normal, quando o item vendido é o Copão
async function ajustarCopaoAtomico(dBally,dGin,dGelo){
  const{error}=await sb.rpc('ajustar_copao',{p_bally:dBally,p_gin:dGin,p_gelo:dGelo});
  if(!error)return true;
  if(!/ajustar_copao|PGRST202|Could not find/i.test((error.code||'')+' '+(error.message||'')))throw error;
  const ce=await getCopaoEstoqueRow();
  const{error:e2}=await sb.from('copao_estoque').update({bally_ml:Math.max(0,(ce.bally_ml||0)+dBally),gin_ml:Math.max(0,(ce.gin_ml||0)+dGin),gelo_un:Math.max(0,(ce.gelo_un||0)+dGelo),atualizado_em:new Date().toISOString()}).eq('id',1);
  if(e2)throw e2;return true;
}
async function consumirComponentesCopao(qty){
  try{
    const copaoProd=await getCopaoProduto();
    const ginPorUn=copaoGinPorUnidade(copaoProd);
    await ajustarCopaoAtomico(-COPAO_CONSUMO_BALLY*qty,-ginPorUn*qty,-COPAO_CONSUMO_GELO*qty);
    await sincronizarEstoqueCopao();
  }catch(e){avisarFalhaEstoque('Copão',e);}
}
async function devolverComponentesCopao(qty){
  try{
    const copaoProd=await getCopaoProduto();
    const ginPorUn=copaoGinPorUnidade(copaoProd);
    await ajustarCopaoAtomico(COPAO_CONSUMO_BALLY*qty,ginPorUn*qty,COPAO_CONSUMO_GELO*qty);
    await sincronizarEstoqueCopao();
  }catch(e){avisarFalhaEstoque('Copão',e);}
}

// Ajuste ATÔMICO de estoque: soma/subtrai direto no banco (evita uma operação apagar a outra quando acontecem ao mesmo tempo)
async function ajustarEstoque(prodId,delta,origem){
  let r=await sb.rpc('ajustar_estoque',{p_id:prodId,p_delta:delta,p_origem:origem||null});
  if(r.error&&/PGRST202|Could not find/i.test((r.error.code||'')+' '+(r.error.message||''))){
    r=await sb.rpc('ajustar_estoque',{p_id:prodId,p_delta:delta}); // função antiga (sem origem)
  }
  if(!r.error)return r.data;
  const error=r.error;
  if(!/ajustar_estoque|PGRST202|Could not find/i.test((error.code||'')+' '+(error.message||'')))throw error;
  // fallback (função ainda não criada no Supabase): método antigo
  const{data:p,error:e1}=await sb.from('produtos').select('estoque').eq('id',prodId).single();
  if(e1)throw e1;
  const novo=Math.max(0,(p.estoque||0)+delta);
  const{error:e2}=await sb.from('produtos').update({estoque:novo}).eq('id',prodId);
  if(e2)throw e2;
  return novo;
}
let _ultimoAvisoEstoque=0;
function avisarFalhaEstoque(nome,e){
  console.error('FALHA ESTOQUE',nome,e);
  if(Date.now()-_ultimoAvisoEstoque<30000)return;_ultimoAvisoEstoque=Date.now();
  alert('⚠️ O ESTOQUE de '+(nome||'um produto')+' NÃO foi atualizado.\n'+(e&&e.message?e.message:e)+'\n\nA venda foi registrada. Me avise (Jarvis) se isso aparecer.');
}
// Helpers genéricos usados por TODAS as rotinas de venda (mesa, balcão, festa):
// decidem sozinhos se o produto é o Copão (desconta dos componentes) ou um produto comum (desconta do próprio estoque)
async function descontarEstoqueItem(prodId,qty,origem){
  let nome='';
  try{
    const{data:p,error}=await sb.from('produtos').select('*').eq('id',prodId).single();
    if(error)throw error;if(!p)return;nome=p.nome;
    if(isCopao(p.nome)){await consumirComponentesCopao(qty);return;}
    await ajustarEstoque(prodId,-qty,origem);
  }catch(e){avisarFalhaEstoque(nome,e);}
}
async function devolverEstoqueItem(prodId,qty,origem){
  let nome='';
  try{
    const{data:p,error}=await sb.from('produtos').select('*').eq('id',prodId).single();
    if(error)throw error;if(!p)return;nome=p.nome;
    if(isCopao(p.nome)){await devolverComponentesCopao(qty);return;}
    await ajustarEstoque(prodId,qty,origem);
  }catch(e){avisarFalhaEstoque(nome,e);}
}

async function salvarCorrecaoCopao(){
  const bally=parseFloat(document.getElementById('copao-corrigir-bally').value);
  const gin=parseFloat(document.getElementById('copao-corrigir-gin').value);
  const gelo=parseInt(document.getElementById('copao-corrigir-gelo').value);
  if(isNaN(bally)||isNaN(gin)||isNaN(gelo)||bally<0||gin<0||gelo<0){alert('Preencha os três valores com números válidos (0 ou mais).');return;}
  if(!confirm(`Confirma corrigir o estoque do Copão para:\nBally: ${bally}ml\nGin: ${gin}ml\nGelo: ${gelo}un\n\nIsso SUBSTITUI os valores atuais.`))return;
  try{
    const{error}=await sb.from('copao_estoque').update({bally_ml:bally,gin_ml:gin,gelo_un:gelo,atualizado_em:new Date().toISOString()}).eq('id',1);

// 📋 HISTÓRICO DE ENTRADAS DO COPÃO (com filtro por data + PDF)
// ══════════════════════════════════════════════
async function carregarHistoricoCopao(){
  const ini=document.getElementById('copao-hist-ini')?.value||'2020-01-01';
  const fim=document.getElementById('copao-hist-fim')?.value||hojeLocalStr();
  const tsIni=new Date(`${ini}T00:00:00`).toISOString();
  const tsFim=new Date(`${fim}T23:59:59`).toISOString();
  const wrap=document.getElementById('copao-historico');if(!wrap)return;
  wrap.innerHTML='<div class="empty" style="padding:20px"><div class="spinner" style="margin:0 auto"></div></div>';
  const PRODUTOS_COPAO=['Bally (Copão)','Gin (Copão)','Gelo de Sabor (Copão)'];
  const{data:E,error}=await sb.from('entradas').select('*').in('produto',PRODUTOS_COPAO).gte('criado_em',tsIni).lte('criado_em',tsFim).order('criado_em',{ascending:false});
  if(error){wrap.innerHTML=`<div class="empty" style="padding:20px"><p style="color:var(--red)">Erro ao carregar histórico: ${error.message}</p></div>`;return;}
  const mapaTipo={'Bally (Copão)':'bally','Gin (Copão)':'gin','Gelo de Sabor (Copão)':'gelo'};
  const entradas=(E||[]).map(e=>{
    const tipo=mapaTipo[e.produto]||'?';
    const ml=tipo==='bally'?Number(e.qty)*COPAO_BALLY_ML:tipo==='gin'?Number(e.qty)*COPAO_GIN_ML:Number(e.qty);
    return{...e,tipo,ml};
  });
  // Agrupa por dia e por tipo
  const porDia={};
  entradas.forEach(e=>{
    const dt=new Date(e.criado_em);const chave=hojeLocalStr(dt);
    if(!porDia[chave])porDia[chave]={bally:0,gin:0,gelo:0,bally_ml:0,gin_ml:0};
    if(e.tipo==='bally'){porDia[chave].bally+=Number(e.qty);porDia[chave].bally_ml+=e.ml;}
    if(e.tipo==='gin'){porDia[chave].gin+=Number(e.qty);porDia[chave].gin_ml+=e.ml;}
    if(e.tipo==='gelo'){porDia[chave].gelo+=Number(e.qty);}
  });
  // Garante que o dia de hoje sempre apareça na lista, mesmo sem nenhuma adição ainda
  const hojeChave=hojeLocalStr();
  if(!porDia[hojeChave])porDia[hojeChave]={bally:0,gin:0,gelo:0,bally_ml:0,gin_ml:0};
  const diasOrdenados=Object.keys(porDia).sort().reverse();
  const totalBallyGarrafas=entradas.filter(e=>e.tipo==='bally').reduce((s,e)=>s+Number(e.qty),0);
  const totalGinGarrafas=entradas.filter(e=>e.tipo==='gin').reduce((s,e)=>s+Number(e.qty),0);
  const totalGeloUn=entradas.filter(e=>e.tipo==='gelo').reduce((s,e)=>s+Number(e.qty),0);
  window._copaoHistoricoCache={ini,fim,entradas,porDia,diasOrdenados,totalBallyGarrafas,totalGinGarrafas,totalGeloUn};
  wrap.innerHTML=`
  <div class="stats-grid" style="margin-bottom:14px;">
    <div class="stat-card"><div class="stat-label">🍾 Bally comprado (período)</div><div class="stat-value">${totalBallyGarrafas} garrafas</div></div>
    <div class="stat-card"><div class="stat-label">🍸 Gin comprado (período)</div><div class="stat-value">${totalGinGarrafas} garrafas</div></div>
    <div class="stat-card"><div class="stat-label">🧊 Gelo comprado (período)</div><div class="stat-value">${totalGeloUn} unidades</div></div>
  </div>
  <div style="margin-bottom:18px;">
    ${diasOrdenados.map(d=>{
      const partes=[];
      if(porDia[d].bally>0)partes.push(`<b style="color:var(--gold3)">${porDia[d].bally} garrafas de Bally</b> (${porDia[d].bally_ml.toLocaleString('pt-BR')}ml)`);
      if(porDia[d].gin>0)partes.push(`<b style="color:var(--gold3)">${porDia[d].gin} garrafas de Gin</b> (${porDia[d].gin_ml.toLocaleString('pt-BR')}ml)`);
      if(porDia[d].gelo>0)partes.push(`<b style="color:var(--gold3)">${porDia[d].gelo} unidades de Gelo de sabor</b>`);
      const isHoje=d===hojeChave;
      const semNada=partes.length===0;
      return`<div class="alert alert-warn" style="margin-bottom:8px;cursor:pointer;transition:opacity 0.2s;" onclick="copaoAbrirPDFDia('${d}')" title="Clique para abrir o PDF desse dia">📅 <b>${fmtDateOnly(d+'T12:00:00')}${isHoje?' (hoje)':''}</b> — ${semNada?'nenhuma adição ainda':'adicionado: '+partes.join(', ')} <span style="float:right;font-size:11px;color:var(--text2)">🖨️ ver PDF</span></div>`;
    }).join('')}
  </div>`;
}
function copaoAbrirPDFDia(dataStr){
  const c=window._copaoHistoricoCache;
  if(!c){alert('Carregue o histórico primeiro.');return;}
  const entradasDoDia=c.entradas.filter(e=>hojeLocalStr(new Date(e.criado_em))===dataStr);
  const porDiaInfo=c.porDia[dataStr]||{bally:0,gin:0,gelo:0,bally_ml:0,gin_ml:0};
  const statsHtml=`
    <div class="stat"><div class="stat-label">Bally adicionado</div><div class="stat-value">${porDiaInfo.bally} garrafas (${porDiaInfo.bally_ml.toLocaleString('pt-BR')}ml)</div></div>
    <div class="stat"><div class="stat-label">Gin adicionado</div><div class="stat-value">${porDiaInfo.gin} garrafas (${porDiaInfo.gin_ml.toLocaleString('pt-BR')}ml)</div></div>
    <div class="stat"><div class="stat-label">Gelo adicionado</div><div class="stat-value">${porDiaInfo.gelo} unidades</div></div>`;
  const detalhadoHtml=entradasDoDia.length===0?'<p style="font-size:12px;color:#666">Nenhuma adição registrada nesse dia.</p>':`<h2>Adições do Dia</h2><table><thead><tr><th>Hora</th><th>Item</th><th>Quantidade</th><th>Operador</th></tr></thead>
    <tbody>${entradasDoDia.map(e=>{
      const nomes={bally:'Bally',gin:'Gin',gelo:'Gelo de sabor'};
      const qtdTxt=e.tipo==='gelo'?`+${e.qty} unidades`:`+${e.qty} garrafas (${e.ml.toLocaleString('pt-BR')}ml)`;
      return`<tr><td>${fmtDateFull(e.criado_em)}</td><td>${nomes[e.tipo]||e.tipo}</td><td>${qtdTxt}</td><td>${e.operador||''}</td></tr>`;
    }).join('')}</tbody></table>`;
  abrirJanelaImpressaoCaixa('Estoque do Copão — Dia',fmtDateOnly(dataStr+'T12:00:00'),statsHtml,detalhadoHtml);
}
function imprimirRelatorioCopao(){
  const c=window._copaoHistoricoCache;
  if(!c){alert('Carregue o histórico primeiro (clique em Filtrar).');return;}
  const statsHtml=`
    <div class="stat"><div class="stat-label">Bally comprado</div><div class="stat-value">${c.totalBallyGarrafas} garrafas</div></div>
    <div class="stat"><div class="stat-label">Gin comprado</div><div class="stat-value">${c.totalGinGarrafas} garrafas</div></div>
    <div class="stat"><div class="stat-label">Gelo comprado</div><div class="stat-value">${c.totalGeloUn} unidades</div></div>`;
  const porDiaHtml=c.diasOrdenados.length===0?'<p style="font-size:12px;color:#666">Nenhuma adição no período.</p>':`
    <table><thead><tr><th>Dia</th><th>Bally</th><th>Gin</th><th>Gelo</th></tr></thead>
    <tbody>${c.diasOrdenados.map(d=>`<tr><td>${fmtDateOnly(d+'T12:00:00')}</td><td>${c.porDia[d].bally>0?`+${c.porDia[d].bally} garrafas (${c.porDia[d].bally_ml.toLocaleString('pt-BR')}ml)`:'—'}</td><td>${c.porDia[d].gin>0?`+${c.porDia[d].gin} garrafas (${c.porDia[d].gin_ml.toLocaleString('pt-BR')}ml)`:'—'}</td><td>${c.porDia[d].gelo>0?`+${c.porDia[d].gelo} unidades`:'—'}</td></tr>`).join('')}</tbody></table>`;
  const detalhadoHtml=`<h2>Detalhado</h2><table><thead><tr><th>Data/Hora</th><th>Item</th><th>Quantidade</th><th>Operador</th></tr></thead>
    <tbody>${c.entradas.map(e=>{
      const nomes={bally:'Bally',gin:'Gin',gelo:'Gelo de sabor'};
      const qtdTxt=e.tipo==='gelo'?`+${e.qty} unidades`:`+${e.qty} garrafas (${e.ml.toLocaleString('pt-BR')}ml)`;
      return`<tr><td>${fmtDateFull(e.criado_em)}</td><td>${nomes[e.tipo]||e.tipo}</td><td>${qtdTxt}</td><td>${e.operador||''}</td></tr>`;
    }).join('')}</tbody></table>`;
  abrirJanelaImpressaoCaixa('Histórico do Estoque do Copão',fmtDateOnly(c.ini+'T12:00:00')+' até '+fmtDateOnly(c.fim+'T12:00:00'),statsHtml,`<h2>Total por Dia</h2>${porDiaHtml}${detalhadoHtml}`);
}

function calcCustoUnitBruno(){
  const q=parseInt(document.getElementById('bru-qty')?.value)||1;
  const c=parseFloat(document.getElementById('bru-custo')?.value)||0;
  const el=document.getElementById('bru-custo-unit');
  if(el)el.value=fmt(q>0?c/q:0);
}

async function confirmarEntradaBruno(){
  const btn=document.querySelector('.btn-bruno[onclick="confirmarEntradaBruno()"]');
  if(btn){btn.disabled=true;btn.textContent='⏳ Salvando...';}
  try{
    const pid=parseInt(document.getElementById('bru-prod').value);
    const qty=parseInt(document.getElementById('bru-qty').value)||0;
    const custo=parseFloat(document.getElementById('bru-custo').value)||0;
    const obs=document.getElementById('bru-obs')?.value?.trim()||'';
    const dataEnt=document.getElementById('bru-data')?.value;
    if(qty<=0){alert('Informe uma quantidade válida.');if(btn){btn.disabled=false;btn.textContent='✅ Registrar Entrada';}return;}
    const{data:prod,error:eProd}=await sb.from('produtos').select('*').eq('id',pid).single();
    if(eProd||!prod){alert('Erro ao buscar produto: '+(eProd?.message||'não encontrado'));if(btn){btn.disabled=false;btn.textContent='✅ Registrar Entrada';}return;}
    if(isCopao(prod.nome)){alert('O estoque do Copão é controlado pela aba "🥤 Copão". Use-a para adicionar garrafas de Bally/Gin e unidades de Gelo.');if(btn){btn.disabled=false;btn.textContent='✅ Registrar Entrada';}return;}
    const tsEntrada=dataEnt?new Date(`${dataEnt}T${new Date().toTimeString().slice(0,8)}`).toISOString():new Date().toISOString();
    // 1. Registra na tabela do Bruno
    const{error:eBruno}=await sb.from('entradas_bruno').insert({produto:prod.nome,categoria:prod.cat,qty,custo,observacao:obs,criado_em:tsEntrada});
    if(eBruno){alert('Erro ao salvar: '+eBruno.message);if(btn){btn.disabled=false;btn.textContent='✅ Registrar Entrada';}return;}
    // 2. Soma ao estoque geral
    try{await ajustarEstoque(pid,qty);}catch(eEst){alert('⚠️ Entrada salva, mas o ESTOQUE NÃO FOI ATUALIZADO: '+eEst.message+'\nConfira o estoque de '+prod.nome+'.');}
    // 3. Registra na tabela entradas geral (ignora erro)
    try{await sb.from('entradas').insert({produto:prod.nome,qty,custo,operador:'Bruno',observacao:'[ENTRADA BRUNO] '+(obs||''),criado_em:tsEntrada});}catch(e2){}
    // 4. Log (ignora erro)
    try{await registrarLog('ENTRADA BRUNO',`${prod.nome} +${qty} un — ${fmt(custo)}`);}catch(e3){}
    closeModal();
    alert(`✅ Entrada registrada!
${qty}x ${prod.nome} adicionado ao estoque geral.`);
    await carregarStatsBruno();
    await carregarHistoricoBruno();
  }catch(e){
    console.error('Erro confirmarEntradaBruno:',e);
    alert('Erro inesperado: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='✅ Registrar Entrada';}
  }
}
async function removerEntradaBruno(id,produto,qty){
  try{
    const{data:prod}=await sb.from('produtos').select('*').ilike('nome',produto).maybeSingle();
    if(prod)await ajustarEstoque(prod.id,-qty);
    await sb.from('entradas_bruno').delete().eq('id',id);
    try{await registrarLog('REMOVEU ENTRADA BRUNO',`${produto} -${qty} un`);}catch(e){}
    alert('✅ Entrada removida. Estoque ajustado.');
    await carregarStatsBruno();
    await carregarHistoricoBruno();
  }catch(e){alert('Erro ao remover: '+e.message);}
}

}
function irDiaCmpProximo(){

  const d=new Date(sel.value+'T12:00:00');d.setDate(d.getDate()+1);

async function verTodasCompras(){
  const wrap=document.getElementById('cmp-conteudo');if(!wrap)return;
  const sub=document.getElementById('cmp-sub');
  wrap.innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  const{data:C}=await sb.from('compras').select('*').order('criado_em',{ascending:false});
  const compras=C||[];
  const totalGasto=compras.filter(c=>c.status==='recebido').reduce((s,c)=>s+Number(c.valor_total),0);
  const totalPend=compras.filter(c=>c.status==='pendente').reduce((s,c)=>s+Number(c.valor_total),0);
  if(sub)sub.textContent=`${compras.length} compras no total`;
  wrap.innerHTML=montarTabelaCompras(compras,totalGasto,totalPend,'Todo o período');

async function carregarComprasDia(){
  const sel=document.getElementById('cmp-data-sel');
  const data=sel?sel.value:hojeLocalStr();
  const tsInicio=new Date(`${data}T00:00:00`).toISOString();
  const dtFim=new Date(`${data}T23:59:59`).toISOString();
  const wrap=document.getElementById('cmp-conteudo');if(!wrap)return;
  const sub=document.getElementById('cmp-sub');
  wrap.innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  const{data:C}=await sb.from('compras').select('*').gte('data_compra',tsInicio).lte('data_compra',dtFim).order('criado_em',{ascending:false});
  const compras=C||[];
  const totalGasto=compras.filter(c=>c.status==='recebido').reduce((s,c)=>s+Number(c.valor_total),0);
  const totalPend=compras.filter(c=>c.status==='pendente').reduce((s,c)=>s+Number(c.valor_total),0);
  const dataFmt=new Date(`${data}T12:00:00`).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const isHoje=data===hojeLocalStr();
  if(sub)sub.textContent=`${dataFmt}${isHoje?' — Hoje':''}`;
  wrap.innerHTML=montarTabelaCompras(compras,totalGasto,totalPend,dataFmt);
}

async function alterarStatusCompra(id,novoStatus,statusAtual,qty,produto){
  if(novoStatus===statusAtual)return;
  const msgs={recebido:'Marcar como RECEBIDO? O estoque será atualizado.',cancelado:'Marcar como CANCELADO?',pendente:'Voltar para PENDENTE?'};
  if(!confirm(msgs[novoStatus]||'Confirmar?')){carregarComprasDia();return;}
  await sb.from('compras').update({status:novoStatus}).eq('id',id);
  // Recebido → soma estoque
  if(novoStatus==='recebido'&&statusAtual!=='recebido'){
    const{data:prod}=await sb.from('produtos').select('*').ilike('nome',produto).maybeSingle();
    if(prod){
      await ajustarEstoque(prod.id,qty);
      try{await sb.from('entradas').insert({produto:prod.nome,qty,custo:0,operador:currentUser.nome,observacao:'[COMPRA RECEBIDA]'});}catch(e){}
    }
  }
  // De recebido para outro → desconta estoque
  if(statusAtual==='recebido'&&novoStatus!=='recebido'){
    const{data:prod}=await sb.from('produtos').select('*').ilike('nome',produto).maybeSingle();
    if(prod)await ajustarEstoque(prod.id,-qty);
  }
  carregarComprasDia();
}

async function excluirCompra(id,status,qty,produto){
  if(!confirm('Excluir esta compra? Se estiver como RECEBIDO, o estoque será descontado.'))return;
  try{
    if(status==='recebido'){
      const{data:prod}=await sb.from('produtos').select('*').ilike('nome',produto).maybeSingle();
      if(prod)await ajustarEstoque(prod.id,-qty);
    }
    const{error}=await sb.from('compras').delete().eq('id',id);
    if(error){alert('Erro ao excluir: '+error.message);return;}
    carregarComprasDia();
  }catch(e){alert('Erro ao excluir compra: '+e.message);}
}

  </div>
  <div class="modal-field"><label>Total (R$)</label><input type="number" id="cmp-total" value="0" step="0.01" style="color:var(--gold2);font-weight:600;width:100%;padding:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;outline:none;"></div>
  <div class="modal-field"><label>Status</label>
    <select id="cmp-status">
      <option value="recebido">&#9989; Recebido — atualiza estoque agora</option>
      <option value="pendente">&#9203; Pendente — só registra, sem estoque</option>
      <option value="cancelado">&#10060; Cancelado</option>
    </select>
  </div>
  <div class="modal-actions">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarCompra()">&#9989; Salvar Compra</button>
  </div>`);
  setTimeout(()=>{
    const sel=document.getElementById('cmp-prod');
    if(sel){document.getElementById('cmp-custo-unit').value=sel.options[sel.selectedIndex].dataset.custo||0;calcTotalCompra();}
  },100);

function atualizarCustoProduto(sel){
  document.getElementById('cmp-custo-unit').value=sel.options[sel.selectedIndex].dataset.custo||0;
  calcTotalCompra();
}
function calcTotalCompra(){
  const q=parseInt(document.getElementById('cmp-qty')?.value)||0;
  const c=parseFloat(document.getElementById('cmp-custo-unit')?.value)||0;
  const t=document.getElementById('cmp-total');
  if(t)t.value=(q*c).toFixed(2);
}

async function salvarCompra(){
  if(window._compraLock)return;window._compraLock=true;
  const btnSalvar=document.querySelector('button[onclick="salvarCompra()"]');
  if(btnSalvar){btnSalvar.disabled=true;btnSalvar.textContent='Salvando...';}
  try{
  const forn=document.getElementById('cmp-forn').value.trim();
  if(!forn){alert('Informe o fornecedor.');return;}
  const pid=parseInt(document.getElementById('cmp-prod').value);
  const qty=parseInt(document.getElementById('cmp-qty').value)||0;
  const custo=parseFloat(document.getElementById('cmp-custo-unit').value)||0;
  const total=parseFloat(document.getElementById('cmp-total').value)||0;
  const status=document.getElementById('cmp-status').value;
  const dataCompra=document.getElementById('cmp-data').value;
  if(qty<=0){alert('Informe uma quantidade válida.');return;}
    const{data:prod,error:eProd}=await sb.from('produtos').select('nome,estoque').eq('id',pid).single();
    if(eProd||!prod){alert('Produto não encontrado.');return;}
    const{error:eCmp}=await sb.from('compras').insert({
      fornecedor:forn,produto:prod.nome,qty,custo_unit:custo,valor_total:total,status,
      data_compra:new Date(`${dataCompra}T12:00:00`).toISOString()
    });
    if(eCmp){alert('Erro ao salvar compra: '+eCmp.message);return;}
    if(status==='recebido'){
      await ajustarEstoque(pid,qty);await sb.from('produtos').update({custo}).eq('id',pid);
      try{await sb.from('entradas').insert({produto:prod.nome,qty,custo:total,operador:currentUser.nome,observacao:'[COMPRA RECEBIDA] '+forn});}catch(e2){}
      try{await registrarLog('COMPRA RECEBIDA',`${prod.nome} +${qty} un — ${fmt(total)} — ${forn}`);}catch(e3){}
    }else{
      try{await registrarLog('COMPRA PENDENTE',`${prod.nome} ${qty} un — ${fmt(total)} — ${forn}`);}catch(e4){}
    }
    closeModal();
    alert(`✅ Compra salva!
${status==='recebido'?`Estoque de ${prod.nome} atualizado: +${qty} unidades.`:'Estoque não alterado (pendente).'}`);
    carregarComprasDia();
  }catch(e){
    console.error('Erro salvarCompra:',e);
    alert('Erro inesperado: '+e.message);
  }finally{
    window._compraLock=false;
    if(btnSalvar){btnSalvar.disabled=false;btnSalvar.textContent='✅ Salvar Compra';}
  }
}

function atalhoCMV(t){
  const base=getDiaComercial().inicio;let a=new Date(base),b=new Date(base);
  if(t==='7')a.setDate(a.getDate()-6);
  else if(t==='30')a.setDate(a.getDate()-29);
  else if(t==='mes')a=new Date(base.getFullYear(),base.getMonth(),1);
  else if(t==='mesant'){a=new Date(base.getFullYear(),base.getMonth()-1,1);b=new Date(base.getFullYear(),base.getMonth(),0);}

}
async function buscarTodosCMV(fn){let out=[],de=0;const passo=1000;while(true){const{data,error}=await fn().range(de,de+passo-1);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<passo)break;de+=passo;}return out;}
function acharProdutoCMV(nomeItem,P,idx){
  const limpo=normalizarTexto(String(nomeItem||'').replace(/^[^\p{L}\p{N}]+/u,'').replace(/\s*\(.*?\)\s*$/,''));
  if(idx[limpo])return idx[limpo];
  let melhor=null;const alvo=normalizarTexto(nomeItem);
  P.forEach(p=>{const n=normalizarTexto(p.nome);if(n&&alvo.includes(n)&&(!melhor||n.length>normalizarTexto(melhor.nome).length))melhor=p;});
  return melhor;
}

function metaCMV(){try{const v=parseFloat(localStorage.getItem('malte_meta_cmv'));if(v>0&&v<100)return v;}catch(e){}return 55;}
function margemMinPromo(){try{const v=parseFloat(localStorage.getItem('malte_margem_promo'));if(v>=0&&v<100)return v;}catch(e){}return 20;}
function salvarMargemPromo(v){v=parseFloat(v);if(!(v>=0&&v<100))return;try{localStorage.setItem('malte_margem_promo',String(v));}catch(e){}renderEstrategiasCMV();}
function salvarMetaCMV(v){v=parseFloat(v);if(!(v>0&&v<100))return;try{localStorage.setItem('malte_meta_cmv',String(v));}catch(e){}renderEstrategiasCMV();}
const arred50=v=>Math.ceil(v*2)/2; // arredonda pra cima de 0,50 em 0,50
function renderEstrategiasCMV(){
  const el=document.getElementById('cmv-estrat'),c=window._cmvCache;if(!el||!c)return;
  const meta=metaCMV(),margemMin=margemMinPromo();

  const blocos=[];

  // 1) Produtos acima da meta de CMV → preço sugerido
  const caros=P.map(p=>({p,cmv:Number(p.custo)/Number(p.preco)*100,sug:arred50(Number(p.custo)/(meta/100)),q:(vendidos[p.nome]||{}).qty||0})).filter(x=>x.cmv>meta).sort((a,b)=>b.q-a.q||b.cmv-a.cmv);

  const promos=P.filter(p=>p.em_promo&&Number(p.preco_promo)>0).map(p=>{const cu=Number(p.custo),pc=Number(p.preco),pp=Number(p.preco_promo);const lN=pc-cu,lP=pp-cu;return{p,cu,pc,pp,lN,lP,mg:lP/pp*100,fator:lP>0?lN/lP:Infinity,min:arred50(cu/(1-margemMin/100))};});
  if(promos.length)blocos.push(card(`🔥 Promoções ativas (${promos.length}) — quanto custam de verdade`,'var(--gold)',
    `<div class="table-wrap" style="margin:4px 0 0"><table><thead><tr><th>Produto</th><th>Custo</th><th>Normal</th><th>Promo</th><th>Lucro/un normal → promo</th><th>Margem promo</th><th>Precisa vender</th><th>Promo mínima (margem ${margemMin}%)</th></tr></thead><tbody>${promos.map(x=>`<tr><td>${x.p.emoji||''} ${escFunc(x.p.nome)}</td><td>${fmt(x.cu)}</td><td>${fmt(x.pc)}</td><td style="color:var(--red);font-weight:700">${fmt(x.pp)}</td><td>${fmt(x.lN)} → <b style="color:${x.lP>0?'var(--gold2)':'var(--red)'}">${fmt(x.lP)}</b></td><td><span class="badge ${x.mg>=margemMin?'badge-green':x.mg>=margemMin/2?'badge-gold':'badge-red'}">${x.mg.toFixed(0)}%</span></td><td>${x.lP<=0?'<b style="color:var(--red)">PREJUÍZO</b>':`<b>${x.fator.toFixed(1)}x</b> mais`}</td><td style="color:var(--green)">${fmt(x.min)}</td></tr>`).join('')}</tbody></table></div>
