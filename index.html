     <b>5. Negocie com o fornecedor antes da promoção.</b> Promoção boa começa no custo: compra em volume, bonificação ou verba de marca (cervejaria costuma bancar ação). Cada R$ 0,50 a menos no custo vira margem direto.<br>
     <b>6. Meça antes e depois.</b> Use o filtro de período desta aba: compare a semana da promoção com a semana anterior. Se o lucro bruto não subiu, a promoção não funcionou.`));

  // 4) Combos sugeridos com os produtos reais
  const iscas=P.map(p=>({p,mg:(Number(p.preco)-Number(p.custo))/Number(p.preco)*100,q:(vendidos[p.nome]||{}).qty||0})).filter(x=>x.q>0).sort((a,b)=>b.q-a.q);
  const altas=P.map(p=>({p,mg:(Number(p.preco)-Number(p.custo))/Number(p.preco)*100,l:Number(p.preco)-Number(p.custo)})).filter(x=>x.mg>=55).sort((a,b)=>b.l-a.l);
  const combos=[];
  iscas.filter(x=>x.mg<margemMin+10).slice(0,3).forEach(i=>{const par=altas.find(a=>a.p.id!==i.p.id);if(!par)return;
    const custo=Number(i.p.custo)+Number(par.p.custo),cheio=Number(i.p.preco)+Number(par.p.preco),preco=arred50(custo/(meta/100));
    if(preco<=custo||preco>cheio-0.5)return;combos.push({a:i.p,b:par.p,custo,cheio,preco,mg:(preco-custo)/preco*100});});
  if(combos.length)blocos.push(card('🧩 Combos sugeridos (produto que mais sai + produto de margem alta)','var(--purple)',
    `<div class="table-wrap" style="margin:4px 0 0"><table><thead><tr><th>Combo</th><th>Separado</th><th>Preço do combo</th><th>Cliente economiza</th><th>Margem do combo</th></tr></thead><tbody>${combos.map(x=>`<tr><td>${x.a.emoji||''} ${escFunc(x.a.nome)} + ${x.b.emoji||''} ${escFunc(x.b.nome)}</td><td>${fmt(x.cheio)}</td><td style="color:var(--gold2);font-weight:700">${fmt(x.preco)}</td><td>${fmt(x.cheio-x.preco)}</td><td><span class="badge badge-green">${x.mg.toFixed(0)}%</span></td></tr>`).join('')}</tbody></table></div><div style="margin-top:6px">O preço do combo já respeita tua meta de CMV de ${meta}%.</div>`));

  // 5) Matriz de cardápio (popularidade × margem)
  const vend=(c.prods||[]).filter(p=>p.custoU>0&&p.qty>0);
  if(vend.length>=3){
    const mQ=vend.reduce((s,p)=>s+p.qty,0)/vend.length,mL=vend.reduce((s,p)=>s+p.lucro/p.qty,0)/vend.length;
    const grupo={estrela:[],cavalo:[],enigma:[],cao:[]};
    vend.forEach(p=>{const pop=p.qty>=mQ,luc=p.lucro/p.qty>=mL;grupo[pop&&luc?'estrela':pop?'cavalo':luc?'enigma':'cao'].push(p);});
    const lista=a=>a.length?a.slice(0,6).map(p=>escFunc(p.nome)).join(', '):'<span style="color:var(--text3)">nenhum</span>';
    blocos.push(card('🗺️ Mapa dos produtos (vende muito? dá lucro?)','var(--blue)',
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">
      <div>⭐ <b>Estrelas</b> — vendem muito e dão lucro: ${lista(grupo.estrela)}<br><i>Nunca deixe faltar. Não precisa de promoção.</i></div>
      <div>🐎 <b>Burros de carga</b> — vendem muito, lucro baixo: ${lista(grupo.cavalo)}<br><i>Suba o preço aos poucos (R$ 0,50) ou venda em combo. Evite promoção neles.</i></div>
      <div>❓ <b>Enigmas</b> — dão lucro mas vendem pouco: ${lista(grupo.enigma)}<br><i>São os melhores pra promoção e pra combo. Deixe à vista e mande o caixa oferecer.</i></div>
      <div>🐕 <b>Cães</b> — vendem pouco e lucro baixo: ${lista(grupo.cao)}<br><i>Repense: troque o fornecedor, suba o preço ou tire do estoque.</i></div></div>`));
  }

  // 6) Perdas e consumo
  if(c.custoPerdas+c.custoConsumo>0)blocos.push(card('🗑️ Vazamentos que pesam no CMV real','var(--red)',
    `Perdas custaram <b>${fmt(c.custoPerdas)}</b> e o consumo dos funcionários <b>${fmt(c.custoConsumo)}</b> (a custo) no período. Isso leva o CMV de <b>${c.cmvPct.toFixed(1)}%</b> para <b>${c.cmvReal.toFixed(1)}%</b>.<br>
     • Registre o motivo das perdas e veja qual produto mais quebra/vence.<br>• Gire o estoque pelo vencimento (primeiro que vence, primeiro que sai).<br>• Combine um limite de consumo por funcionário ou desconto fixo na diária.`));

  if(!P.length)blocos.unshift(card('⚠️ Cadastre o custo dos produtos','var(--red)','Sem custo cadastrado não dá pra calcular margem nem sugerir preço. Vá em Produtos e preencha o custo de cada item.'));

  el.innerHTML=`
  <div class="section-hdr" style="margin-top:18px"><div><div class="section-title">🎯 Estratégias pra melhorar o CMV e a margem</div><div class="section-sub">Calculado com os teus produtos e as vendas do período acima</div></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)">Meta de CMV <input type="number" value="${meta}" min="10" max="90" step="1" onchange="salvarMetaCMV(this.value)" style="width:60px;padding:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;text-align:center">% · Margem mínima na promo <input type="number" value="${margemMin}" min="0" max="90" step="1" onchange="salvarMargemPromo(this.value)" style="width:60px;padding:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;text-align:center">%</div></div>
  <div style="font-size:11px;color:var(--text3);margin:-6px 0 10px">Referência: distribuidora/bar de bebidas costuma trabalhar com CMV entre 50% e 65%. Ajuste a meta pro teu negócio, fica salvo neste aparelho.</div>
  ${simuladorPromoHtml(P)}
  ${blocos.join('')}`;
  calcSimPromo();
}
function simuladorPromoHtml(P){
  if(!P.length)return'';
  const inp='padding:8px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;';
  return`<div style="background:var(--card);border:1px solid rgba(212,160,23,0.45);border-radius:var(--radius);padding:14px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px">🧪 Simulador de promoção — teste antes de colocar no ar</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
      <div style="flex:1;min-width:170px"><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Produto</div><select id="sim-prod" onchange="calcSimPromo(true)" style="${inp}width:100%">${P.map(p=>`<option value="${p.id}">${p.emoji||''} ${escFunc(p.nome)}</option>`).join('')}</select></div>
      <div><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Preço da promo (R$)</div><input type="number" id="sim-preco" step="0.5" oninput="calcSimPromo()" style="${inp}width:110px"></div>
      <div><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Leve (combo qtd)</div><input type="number" id="sim-qtd" value="1" min="1" step="1" oninput="calcSimPromo()" style="${inp}width:80px"></div>
    </div>
    <div id="sim-res" style="margin-top:10px;font-size:12px;line-height:1.7"></div></div>`;
}
function calcSimPromo(trocouProduto){
  const c=window._cmvCache,sel=document.getElementById('sim-prod');if(!c||!sel)return;
  const p=(c.produtosAtuais||[]).find(x=>String(x.id)===sel.value);if(!p)return;
  const inPreco=document.getElementById('sim-preco'),qtd=Math.max(1,parseInt(document.getElementById('sim-qtd').value)||1);
  const cu=Number(p.custo),pc=Number(p.preco);
  if(trocouProduto||!inPreco.value)inPreco.value=(p.em_promo&&Number(p.preco_promo)>0?Number(p.preco_promo):pc*qtd*0.9).toFixed(2);
  const pp=parseFloat(inPreco.value)||0,custoT=cu*qtd,cheio=pc*qtd;
  const lN=cheio-custoT,lP=pp-custoT,mg=pp>0?lP/pp*100:0,desc=cheio>0?(1-pp/cheio)*100:0,cmv=pp>0?custoT/pp*100:0,meta=metaCMV();
  const margemMin=margemMinPromo(),minMeta=arred50(custoT/(meta/100)),minMg25=arred50(custoT/(1-margemMin/100));
  const vend=(c.prods||[]).find(x=>x.nome===p.nome);const q=vend?vend.qty:0;
  const fator=lP>0?lN/lP:Infinity;
  const veredito=lP<=0?['❌','var(--red)','Prejuízo: o preço da promoção não cobre o custo.']:cmv<=meta?['✅','var(--green)',`Promoção saudável: CMV ${cmv.toFixed(0)}% dentro da tua meta de ${meta}%.`]:mg>=margemMin?['⚠️','var(--gold2)',`Aceitável só se aumentar bem o volume: precisa vender ${fator.toFixed(1)}x mais pra empatar o lucro.`]:['🚫','var(--red)',`Margem muito baixa (${mg.toFixed(0)}%). Só vale como isca, junto com produto de margem alta.`];
  document.getElementById('sim-res').innerHTML=`
    <div style="font-size:14px;font-weight:700;color:${veredito[1]};margin-bottom:6px">${veredito[0]} ${veredito[2]}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px">
      <div>Preço cheio (${qtd}un)<br><b style="font-size:14px">${fmt(cheio)}</b></div>
      <div>Desconto pro cliente<br><b style="font-size:14px">${desc.toFixed(0)}%</b></div>
      <div>Custo<br><b style="font-size:14px;color:var(--red)">${fmt(custoT)}</b></div>
      <div>Lucro normal → promo<br><b style="font-size:14px">${fmt(lN)} → <span style="color:${lP>0?'var(--gold2)':'var(--red)'}">${fmt(lP)}</span></b></div>
      <div>Margem na promo<br><b style="font-size:14px">${mg.toFixed(0)}%</b></div>
      <div>CMV na promo<br><b style="font-size:14px">${cmv.toFixed(0)}%</b></div>
    </div>
    <div style="margin-top:8px;color:var(--text2)">🔒 Preço mínimo pra manter a meta de ${meta}%: <b style="color:var(--green)">${fmt(minMeta)}</b> · promo mínima (margem ${margemMin}%): <b>${fmt(minMg25)}</b>${q?`<br>📦 No período vendeu <b>${q}</b> un. Nessa promo, pra dar o mesmo lucro, teria que vender <b>${isFinite(fator)?Math.ceil(q*fator/qtd)+' promoções ('+Math.ceil(q*fator)+' un)':'— (dá prejuízo)'}</b>.`:''}</div>`;
}

function gerarPDFCMV(){
  const c=window._cmvCache;if(!c){alert('Calcule o CMV primeiro.');return;}
  const st=(l,v)=>`<div class="stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`;
  const stats=st('Faturamento',fmt(c.faturamento))+st('Custo das vendas',fmt(c.custoVendas))+st('CMV',c.cmvPct.toFixed(1)+'%')+st('Lucro bruto',fmt(c.lucroBruto))+st('Margem',c.margem.toFixed(1)+'%')+st('Ticket médio',fmt(c.ticket))+st('Perdas (custo)',fmt(c.custoPerdas))+st('Consumo func. (custo)',fmt(c.custoConsumo))+st('CMV real',c.cmvReal.toFixed(1)+'%');
  const cat=`<h2>Por categoria</h2><table><thead><tr><th>Categoria</th><th>Qtd</th><th>Faturamento</th><th>Custo</th><th>Lucro</th><th>Margem</th></tr></thead><tbody>${c.cats.map(x=>`<tr><td>${escFunc(x.cat)}</td><td>${x.qty}</td><td>${fmt(x.fat)}</td><td>${fmt(x.custo)}</td><td>${fmt(x.lucro)}</td><td>${x.margem.toFixed(0)}%</td></tr>`).join('')}</tbody></table>`;
  const pr=`<h2>Por produto</h2><table><thead><tr><th>Produto</th><th>Qtd</th><th>Faturamento</th><th>Custo un.</th><th>Custo total</th><th>Lucro</th><th>Margem</th></tr></thead><tbody>${c.prods.map(p=>`<tr><td>${escFunc(p.nome)}${!p.custoU?' (sem custo)':''}</td><td>${p.qty}</td><td>${fmt(p.fat)}</td><td>${fmt(p.custoU)}</td><td>${fmt(p.custo)}</td><td>${fmt(p.lucro)}</td><td>${p.margem.toFixed(0)}%</td></tr>`).join('')}</tbody></table>`;
  const dia=c.dias.length>1?`<h2>Por dia</h2><table><thead><tr><th>Dia</th><th>Faturamento</th><th>Custo</th><th>Lucro</th><th>CMV</th></tr></thead><tbody>${c.dias.map(d=>{const x=c.porDia[d];return`<tr><td>${fmtDateOnly(d+'T12:00:00')}</td><td>${fmt(x.fat)}</td><td>${fmt(x.custo)}</td><td>${fmt(x.fat-x.custo)}</td><td>${x.fat>0?(x.custo/x.fat*100).toFixed(1):0}%</td></tr>`;}).join('')}</tbody></table>`:'';
  const obs=`<p style="font-size:11px;color:#666">Custo calculado com o custo atual cadastrado de cada produto.${c.semCusto.length?' Produtos sem custo: '+c.semCusto.map(escFunc).join(', ')+'.':''}</p>`;
  abrirJanelaImpressaoCaixa('Relatório de CMV',c.periodo,stats,cat+pr+dia+obs);
}

// 👷 FUNCIONÁRIOS — consumo, vales e diárias
// ══════════════════════════════════════════════
const FUNCIONARIOS=['Luigi','Idalina','Bruno R','Bruno C','Vitória'];
const DIARIA_NORMAL=55,DIARIA_FESTA=110;
let funcSel=null,funcVerFechados=false;
function escFunc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function resumoFunc(L){
  const dias=L.filter(l=>l.tipo==='dia'),festas=L.filter(l=>l.tipo==='festa');
  const consumo=L.filter(l=>l.tipo==='consumo').reduce((s,l)=>s+Number(l.valor),0);
  const vales=L.filter(l=>l.tipo==='vale').reduce((s,l)=>s+Number(l.valor),0);
  const ganhos=dias.reduce((s,l)=>s+Number(l.valor),0)+festas.reduce((s,l)=>s+Number(l.valor),0);
  return{nDias:dias.length,nFestas:festas.length,ganhos,consumo,vales,liquido:ganhos-consumo-vales};
}
async function carregarLancFunc(nome,fechados){
  let q=sb.from('func_lancamentos').select('*').order('data',{ascending:false}).order('criado_em',{ascending:false});
  if(nome)q=q.eq('funcionario',nome);
  if(!fechados)q=q.eq('fechado',false);
  const{data,error}=await q;if(error)throw error;return data||[];
}

  </div>
  <div id="rd-conteudo"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>`;

async function carregarRelDia(){
  const ini=document.getElementById('rd-ini').value||hojeLocalStr();
  let fim=document.getElementById('rd-fim').value||ini;
  const el=document.getElementById('rd-conteudo');
  if(fim<ini){el.innerHTML='<div class="empty"><p style="color:var(--red)">A data final não pode ser antes da inicial.</p></div>';return;}
  el.innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  const{tsIni,tsFim}=intervaloComercial(ini,fim);
  let vendas=[],saidas=[],perdas=[],func=[],itens=[],avisoFunc='';
  try{
    const[rV,rS,rP]=await Promise.all([
      sb.from('vendas').select('*').gte('criado_em',tsIni).lte('criado_em',tsFim).order('criado_em',{ascending:true}),
      sb.from('saidas_caixa').select('*').gte('criado_em',tsIni).lte('criado_em',tsFim).order('criado_em',{ascending:true}),
      sb.from('perdas').select('*').gte('criado_em',tsIni).lte('criado_em',tsFim).order('criado_em',{ascending:true})
    ]);
    if(rV.error)throw rV.error;if(rS.error)throw rS.error;if(rP.error)throw rP.error;
    vendas=rV.data||[];saidas=rS.data||[];perdas=rP.data||[];
    try{const{data,error}=await sb.from('func_lancamentos').select('*').gte('data',ini).lte('data',fim).order('data',{ascending:true});if(error)throw error;func=data||[];}catch(e){avisoFunc='Não foi possível carregar funcionários: '+e.message;}
    if(vendas.length){
      const ids=vendas.map(v=>v.id);
      for(let i=0;i<ids.length;i+=200){const{data,error}=await sb.from('venda_itens').select('*').in('venda_id',ids.slice(i,i+200));if(error)throw error;itens=itens.concat(data||[]);}
    }

// 🤝 Sócio (Bruno R): não tem diária — o crédito é o estoque que ele trouxe (aba Bruno) e vai baixando com consumo e vales
const SOCIOS={'Bruno R':true};
function isSocio(n){return !!SOCIOS[n];}
async function resumoSocio(n){
  const[rE,rP,L]=await Promise.all([sb.from('entradas_bruno').select('*').order('criado_em',{ascending:false}),sb.from('produtos').select('id,nome,emoji,estoque,custo'),carregarLancFunc(n,true)]);
  if(rE.error)throw rE.error;if(rP.error)throw rP.error;
  const E=rE.data||[],P=rP.data||[];
  // Agrupa o que ele trouxe por produto e compara com o estoque REAL de hoje (o que já vendeu sai da conta; entrada nova soma)
  const g={};E.forEach(e=>{const k=normalizarTexto(e.produto);if(!g[k])g[k]={produto:e.produto,trouxe:0,custo:0};g[k].trouxe+=Number(e.qty)||0;g[k].custo+=Number(e.custo)||0;});
  const itens=Object.values(g).map(x=>{const p=P.find(pp=>normalizarTexto(pp.nome)===normalizarTexto(x.produto));const est=p?Math.max(0,Number(p.estoque)||0):0;const temAinda=Math.min(x.trouxe,est);const un=x.trouxe>0?x.custo/x.trouxe:0;return{...x,emoji:p?p.emoji:'',prodId:p?p.id:null,estoque:est,temAinda,custoUn:un,valor:temAinda*un};}).sort((a,b)=>b.valor-a.valor);
  const credito=itens.reduce((s,i)=>s+i.valor,0);
  // Consumo de produto que é DELE já baixou o estoque (e o crédito) — não desconta de novo
  const idsDele=new Set(itens.filter(i=>i.prodId).map(i=>i.prodId));
  const consumos=L.filter(l=>l.tipo==='consumo'),consumoDeleProprio=consumos.filter(l=>l.prod_id&&idsDele.has(l.prod_id));
  const consumo=consumos.filter(l=>!(l.prod_id&&idsDele.has(l.prod_id))).reduce((s,l)=>s+Number(l.valor),0);
  const consumoProprio=consumoDeleProprio.reduce((s,l)=>s+Number(l.valor),0);
  const vales=L.filter(l=>l.tipo==='vale').reduce((s,l)=>s+Number(l.valor),0);
  return{E,L,itens,idsDele,credito,consumo,consumoProprio,vales,saldo:credito-consumo-vales};
}

  const L=r.L.filter(l=>l.tipo==='consumo'||l.tipo==='vale');
  const t1=`<h2>Consumo e vales</h2>${L.length?`<table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${[...L].reverse().map(l=>`<tr><td>${fmtDateOnly(l.data+'T12:00:00')}</td><td>${l.tipo==='vale'?'Vale':'Consumo'}</td><td>${escFunc(l.descricao)}</td><td>-${fmt(l.valor)}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhum lançamento.</p>'}`;
  const t2=`<h2>Estoque dele hoje</h2>${r.itens.length?`<table><thead><tr><th>Produto</th><th>Trouxe</th><th>Estoque atual</th><th>Ainda tem</th><th>Custo un.</th><th>Valor</th></tr></thead><tbody>${r.itens.map(i=>`<tr><td>${escFunc(i.produto)}</td><td>${i.trouxe}</td><td>${i.estoque}</td><td>${i.temAinda}</td><td>${fmt(i.custoUn)}</td><td>${fmt(i.valor)}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhuma entrada.</p>'}`;
  abrirJanelaImpressaoCaixa('Extrato do Sócio',escFunc(c.nome),st('Estoque dele hoje',fmt(r.credito))+st('Vales + consumo',fmt(r.consumo+r.vales))+st(r.saldo<0?'Passou do crédito':'Saldo restante',fmt(Math.abs(r.saldo))),t1+t2+`<p style="margin-top:40px;font-size:12px">_______________________________<br>Assinatura — ${escFunc(c.nome)}</p>`);
}

// ══════════════════════════════════════════════
// 🎪 PREVISÃO DE FESTA — gastos × estoque atual → lucro líquido previsto (independente, não mexe em nada)
// ══════════════════════════════════════════════
const PF_CATS=[['aluguel','🏠 Aluguel'],['som','🔊 Som / DJ'],['estrutura','⛺ Estrutura'],['diarias','👷 Diárias funcionários'],['ajudantes','🧑‍🔧 Ajudantes extras'],['comida','🍔 Comida'],['divulgacao','📣 Divulgação'],['seguranca','🛡️ Segurança'],['outros','📦 Outros']];
const pfCatNome=k=>(PF_CATS.find(c=>c[0]===k)||['','📦 Outros'])[1];
let pfAtual=null,pfLista=[],pfProdutos=[];
function pfNova(){return{id:null,nome:'Festa '+fmtDateOnly(new Date().toISOString()),gastos:[],config:{pct:70,usarPromo:true,excluidos:[]}};}
async function renderPrevFesta(){
  document.getElementById('tab-content').innerHTML='<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  try{await sincronizarEstoqueCopao();}catch(e){}
  try{
    const[rP,rL]=await Promise.all([sb.from('produtos').select('*').order('nome'),sb.from('festa_previsao').select('*').order('atualizado_em',{ascending:false})]);
    if(rP.error)throw rP.error;pfProdutos=rP.data||[];
    if(rL.error){pfLista=[];window._pfAvisoTabela=rL.error.message;}else{pfLista=rL.data||[];window._pfAvisoTabela='';}
  }catch(e){document.getElementById('tab-content').innerHTML=`<div class="empty"><p style="color:var(--red)">Erro ao carregar: ${escFunc(e.message)}</p></div>`;return;}
  if(!pfAtual)pfAtual=pfLista[0]?JSON.parse(JSON.stringify(pfLista[0])):pfNova();
  else if(pfAtual.id){const f=pfLista.find(x=>x.id===pfAtual.id);if(!f&&!pfAtual._sujo)pfAtual=pfNova();}
  pfAtual.gastos=pfAtual.gastos||[];pfAtual.config=Object.assign({pct:70,usarPromo:true,excluidos:[]},pfAtual.config||{});
  desenharPrevFesta();
}
function pfCalc(){
  const cfg=pfAtual.config,pct=Math.max(0,Math.min(100,Number(cfg.pct)||0))/100,exc=new Set((cfg.excluidos||[]).map(String));
  const itens=pfProdutos.filter(p=>Number(p.estoque)>0).map(p=>{
    const preco=cfg.usarPromo&&p.em_promo&&Number(p.preco_promo)>0?Number(p.preco_promo):Number(p.preco)||0;
    const custo=Number(p.custo)||0,inc=!exc.has(String(p.id)),qtd=inc?Math.floor(Number(p.estoque)*pct):0;
    return{p,preco,custo,estoque:Number(p.estoque),inc,qtd,receita:qtd*preco,cmv:qtd*custo};});
  const receita=itens.reduce((s,i)=>s+i.receita,0),cmv=itens.reduce((s,i)=>s+i.cmv,0);
  const receitaTotalEst=itens.filter(i=>i.inc).reduce((s,i)=>s+i.estoque*i.preco,0);
  const gastos=pfAtual.gastos.reduce((s,g)=>s+(Number(g.valor)||0),0);
  const porCat={};pfAtual.gastos.forEach(g=>{porCat[g.cat]=(porCat[g.cat]||0)+(Number(g.valor)||0);});
  const lucroBruto=receita-cmv,liquido=lucroBruto-gastos;
  const mgBruta=receita>0?lucroBruto/receita:0;
  const equilibrio=mgBruta>0?gastos/mgBruta:Infinity;
  const pctEquilibrio=receitaTotalEst>0&&isFinite(equilibrio)?equilibrio/receitaTotalEst*100:Infinity;
  return{itens,receita,cmv,gastos,porCat,lucroBruto,liquido,mgBruta,mgLiq:receita>0?liquido/receita:0,equilibrio,pctEquilibrio,receitaTotalEst,semCusto:itens.filter(i=>i.inc&&!i.custo).length};
}
function desenharPrevFesta(){
  const c=pfCalc(),cfg=pfAtual.config;window._pfCalc=c;
  const inp='padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;';
  const cor=c.liquido>=0?'var(--green)':'var(--red)';
  document.getElementById('tab-content').innerHTML=`
  <div class="section-hdr"><div><div class="section-title">🎪 Previsão de Festa</div><div class="section-sub">Simulação independente: usa o estoque atual e os gastos que tu lançar. Não mexe em estoque, caixa nem vendas.</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" onclick="renderPrevFesta()">🔄 Atualizar estoque</button><button class="btn btn-primary btn-sm" onclick="gerarPDFPrevFesta()">🖨 PDF</button></div></div>
  ${window._pfAvisoTabela?`<div style="font-size:12px;color:var(--red);margin-bottom:10px">⚠️ Não deu pra carregar as previsões salvas (${escFunc(window._pfAvisoTabela)}). Rode o SQL da tabela <b>festa_previsao</b> no Supabase. Dá pra simular mesmo assim, só não salva.</div>`:''}
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
    <div style="flex:1;min-width:180px"><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Nome da festa</div><input type="text" value="${escFunc(pfAtual.nome)}" oninput="pfAtual.nome=this.value;pfAtual._sujo=true" style="${inp}width:100%"></div>
    <div><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Previsões salvas</div><select onchange="pfAbrir(this.value)" style="${inp}min-width:170px"><option value="">${pfAtual.id?'—':'(nova, não salva)'}</option>${pfLista.map(f=>`<option value="${f.id}" ${pfAtual.id===f.id?'selected':''}>${escFunc(f.nome)}</option>`).join('')}</select></div>
    <button class="btn btn-green" onclick="pfSalvar()">💾 Salvar</button>
    <button class="btn btn-secondary" onclick="pfAtual=pfNova();desenharPrevFesta()">+ Nova</button>
    ${pfAtual.id?`<button class="btn btn-danger btn-sm" onclick="pedirSenhaAdm('Excluir previsão',()=>pfExcluir(${pfAtual.id}))">✕</button>`:''}
  </div>
  <div class="stats-grid">
    <div class="stat-card stat-gold"><div class="stat-label">Receita prevista</div><div class="stat-value">${fmt(c.receita)}</div><div class="stat-sub">vendendo ${cfg.pct}% do estoque</div></div>
    <div class="stat-card stat-red"><div class="stat-label">Custo da bebida (CMV)</div><div class="stat-value">${fmt(c.cmv)}</div></div>
    <div class="stat-card stat-red"><div class="stat-label">Gastos da festa</div><div class="stat-value">${fmt(c.gastos)}</div></div>
    <div class="stat-card" style="border-color:${cor}"><div class="stat-label">💰 Lucro líquido previsto</div><div class="stat-value" style="color:${cor}">${fmt(c.liquido)}</div><div class="stat-sub">margem líquida ${(c.mgLiq*100).toFixed(1)}%</div></div>
  </div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--text2);line-height:1.7">
    Lucro bruto da bebida: <b style="color:var(--text)">${fmt(c.lucroBruto)}</b> (margem ${(c.mgBruta*100).toFixed(1)}%) − gastos <b style="color:var(--red)">${fmt(c.gastos)}</b> = <b style="color:${cor}">${fmt(c.liquido)}</b><br>
    ⚖️ <b>Ponto de equilíbrio:</b> ${isFinite(c.equilibrio)?`precisa faturar <b style="color:var(--gold2)">${fmt(c.equilibrio)}</b> só pra pagar os gastos${isFinite(c.pctEquilibrio)?` — <b>${c.pctEquilibrio.toFixed(0)}%</b> do estoque selecionado${c.pctEquilibrio>100?' <span style="color:var(--red)">(o estoque atual NÃO cobre os gastos)</span>':''}`:''}.`:'sem margem na bebida, não dá pra calcular.'}
    ${c.semCusto?`<br><span style="color:var(--red)">⚠️ ${c.semCusto} produto(s) sem custo cadastrado — o lucro aparece maior do que é.</span>`:''}
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px">💸 Gastos da festa</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <select id="pf-cat" style="${inp}">${PF_CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select>
      <input type="text" id="pf-desc" placeholder="Descrição (ex: tenda 10x10)" style="${inp}flex:1;min-width:130px">
      <input type="number" id="pf-valor" placeholder="R$" step="0.01" style="${inp}width:100px" onkeydown="if(event.key==='Enter')pfAddGasto()">
      <button class="btn btn-primary" onclick="pfAddGasto()">+ Adicionar</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text2);align-items:center">
      Atalho diárias: <input type="number" id="pf-ndia" value="5" min="1" style="${inp}width:60px;padding:5px"> pessoas ×
      <input type="number" id="pf-vdia" value="${DIARIA_FESTA}" step="1" style="${inp}width:80px;padding:5px">
      <button class="btn btn-secondary btn-xs" onclick="pfAddDiarias()">+ Lançar diárias</button>
    </div>
    ${pfAtual.gastos.length===0?'<div style="font-size:12px;color:var(--text3);padding:10px 0">Nenhum gasto lançado ainda.</div>':`
    <div class="table-wrap" style="margin-bottom:8px"><table><thead><tr><th>Categoria</th><th>Descrição</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>
    ${pfAtual.gastos.map((g,i)=>`<tr><td>${pfCatNome(g.cat)}</td><td>${escFunc(g.desc)}</td><td style="text-align:right;color:var(--red);font-weight:600">${fmt(g.valor)}</td><td><button class="btn btn-danger btn-xs" onclick="pfRemGasto(${i})">✕</button></td></tr>`).join('')}
    </tbody></table></div>
    <div style="font-size:12px;color:var(--text2);line-height:1.8">${Object.entries(c.porCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${pfCatNome(k)}: <b style="color:var(--text)">${fmt(v)}</b> <span style="color:var(--text3)">(${c.gastos>0?(v/c.gastos*100).toFixed(0):0}%)</span>`).join(' · ')}</div>`}
  </div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px"><div style="font-size:14px;font-weight:700">📦 Estoque atual que vai pra festa</div>
      <div style="font-size:12px;color:var(--text2);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        Vender <input type="number" value="${cfg.pct}" min="0" max="100" step="5" onchange="pfAtual.config.pct=Number(this.value)||0;pfAtual._sujo=true;desenharPrevFesta()" style="${inp}width:64px;padding:5px">% do estoque
        <label style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" ${cfg.usarPromo?'checked':''} onchange="pfAtual.config.usarPromo=this.checked;pfAtual._sujo=true;desenharPrevFesta()"> usar preço de promo</label></div></div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Desmarque o que não vai ser vendido na festa. Se o estoque mudar, clique em 🔄 Atualizar estoque.</div>
    <div class="table-wrap" style="max-height:420px;overflow-y:auto"><table><thead><tr><th></th><th>Produto</th><th>Estoque</th><th>Vende</th><th>Preço</th><th>Receita</th><th>Lucro</th></tr></thead><tbody>
    ${c.itens.length===0?'<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:16px">Nenhum produto com estoque</td></tr>':c.itens.map(i=>`<tr style="${i.inc?'':'opacity:0.4'}"><td><input type="checkbox" ${i.inc?'checked':''} onchange="pfToggleProd(${i.p.id},this.checked)"></td><td>${i.p.emoji||''} ${escFunc(i.p.nome)}${!i.custo?' <span class="badge badge-red">sem custo</span>':''}</td><td>${i.estoque}</td><td style="font-weight:700">${i.qtd}</td><td>${fmt(i.preco)}</td><td style="color:var(--gold2)">${fmt(i.receita)}</td><td style="color:var(--green)">${fmt(i.receita-i.cmv)}</td></tr>`).join('')}

function pfAddGasto(){
  const cat=document.getElementById('pf-cat').value,desc=document.getElementById('pf-desc').value.trim(),valor=parseFloat(document.getElementById('pf-valor').value)||0;
  if(valor<=0){alert('Informe o valor do gasto.');return;}
  pfAtual.gastos.push({cat,desc:desc||pfCatNome(cat).replace(/^\S+\s/,''),valor});pfAtual._sujo=true;desenharPrevFesta();
  setTimeout(()=>{const s=document.getElementById('pf-cat');if(s)s.value=cat;const d=document.getElementById('pf-desc');if(d)d.focus();},50);
}
function pfAddDiarias(){
  const n=parseInt(document.getElementById('pf-ndia').value)||0,v=parseFloat(document.getElementById('pf-vdia').value)||0;if(n<=0||v<=0)return;
  pfAtual.gastos.push({cat:'diarias',desc:`${n} pessoas × ${fmt(v)}`,valor:n*v});pfAtual._sujo=true;desenharPrevFesta();
}
function pfRemGasto(i){pfAtual.gastos.splice(i,1);pfAtual._sujo=true;desenharPrevFesta();}
function pfToggleProd(id,on){const s=new Set((pfAtual.config.excluidos||[]).map(String));if(on)s.delete(String(id));else s.add(String(id));pfAtual.config.excluidos=[...s];pfAtual._sujo=true;desenharPrevFesta();}
function pfAbrir(id){if(!id)return;const f=pfLista.find(x=>String(x.id)===String(id));if(!f)return;if(pfAtual._sujo&&!confirm('Tem alterações não salvas nesta previsão. Abrir outra mesmo assim?')){desenharPrevFesta();return;}pfAtual=JSON.parse(JSON.stringify(f));pfAtual.config=Object.assign({pct:70,usarPromo:true,excluidos:[]},pfAtual.config||{});desenharPrevFesta();}
async function pfSalvar(){
  const reg={nome:(pfAtual.nome||'').trim()||'Festa',gastos:pfAtual.gastos,config:pfAtual.config,atualizado_em:new Date().toISOString()};
  try{
    let res;
    if(pfAtual.id)res=await sb.from('festa_previsao').update(reg).eq('id',pfAtual.id).select().single();
    else res=await sb.from('festa_previsao').insert(reg).select().single();
    if(res.error){alert('Erro ao salvar: '+res.error.message);return;}
    pfAtual=JSON.parse(JSON.stringify(res.data));
    const i=pfLista.findIndex(x=>x.id===res.data.id);if(i>=0)pfLista[i]=res.data;else pfLista.unshift(res.data);
    desenharPrevFesta();
  }catch(e){alert('Erro: '+e.message);}
}
async function pfExcluir(id){
  try{const{error}=await sb.from('festa_previsao').delete().eq('id',id);if(error){alert('Erro ao excluir: '+error.message);return;}
    pfLista=pfLista.filter(x=>x.id!==id);pfAtual=pfLista[0]?JSON.parse(JSON.stringify(pfLista[0])):pfNova();desenharPrevFesta();}catch(e){alert('Erro: '+e.message);}
}
function gerarPDFPrevFesta(){
  const c=window._pfCalc||pfCalc(),cfg=pfAtual.config;
  const st=(l,v)=>`<div class="stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`;
  const stats=st('Receita prevista',fmt(c.receita))+st('Custo da bebida',fmt(c.cmv))+st('Lucro bruto',fmt(c.lucroBruto)+` (${(c.mgBruta*100).toFixed(1)}%)`)+st('Gastos da festa',fmt(c.gastos))+st('Lucro líquido previsto',fmt(c.liquido))+st('Margem líquida',(c.mgLiq*100).toFixed(1)+'%')+st('Ponto de equilíbrio',isFinite(c.equilibrio)?fmt(c.equilibrio):'—')+st('% do estoque p/ empatar',isFinite(c.pctEquilibrio)?c.pctEquilibrio.toFixed(0)+'%':'—')+st('Premissa',`vender ${cfg.pct}% do estoque${cfg.usarPromo?' · preço promo':''}`);
  const gastos=`<h2>Gastos da festa — ${fmt(c.gastos)}</h2>${pfAtual.gastos.length?`<table><thead><tr><th>Categoria</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${pfAtual.gastos.map(g=>`<tr><td>${pfCatNome(g.cat)}</td><td>${escFunc(g.desc)}</td><td>${fmt(g.valor)}</td></tr>`).join('')}</tbody></table><table><thead><tr><th>Categoria</th><th>Total</th><th>% dos gastos</th></tr></thead><tbody>${Object.entries(c.porCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${pfCatNome(k)}</td><td>${fmt(v)}</td><td>${c.gastos>0?(v/c.gastos*100).toFixed(0):0}%</td></tr>`).join('')}</tbody></table>`:'<p>Nenhum gasto lançado.</p>'}`;
  const est=`<h2>Estoque previsto para venda</h2><table><thead><tr><th>Produto</th><th>Estoque</th><th>Vende</th><th>Preço</th><th>Receita</th><th>Custo</th><th>Lucro</th></tr></thead><tbody>${c.itens.filter(i=>i.inc).map(i=>`<tr><td>${escFunc(i.p.nome)}</td><td>${i.estoque}</td><td>${i.qtd}</td><td>${fmt(i.preco)}</td><td>${fmt(i.receita)}</td><td>${fmt(i.cmv)}</td><td>${fmt(i.receita-i.cmv)}</td></tr>`).join('')}</tbody></table>`;
  const obs=`<p style="font-size:11px;color:#666">Previsão com base no estoque de ${fmtDateFull(new Date().toISOString())}. Simulação — não altera estoque, caixa ou vendas.${c.semCusto?` ${c.semCusto} produto(s) sem custo cadastrado.`:''}</p>`;
  abrirJanelaImpressaoCaixa('Previsão de Festa',escFunc(pfAtual.nome),stats,gastos+est+obs);
}

async function renderAnotacoes(){
  const{data:A}=await sb.from('anotacoes').select('*').order('criado_em',{ascending:false});
  document.getElementById('tab-content').innerHTML=`
  <div class="section-hdr"><div class="section-title">&#128221; Anotações</div><button class="btn btn-primary btn-sm" onclick="novaAnotacao()">+ Nova Nota</button></div>

    ${(A||[]).length===0?`<div class="empty"><div class="empty-icon">&#128221;</div><p>Nenhuma anotação</p></div>`:
    (A||[]).map(a=>`<div class="nota-card" style="border-left:3px solid ${a.cor||'var(--gold)'}"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;"><div style="font-size:13px;font-weight:600">${a.titulo}</div><button class="btn btn-danger btn-xs" onclick="deletarAnotacao(${a.id})">&#10005;</button></div><div style="font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.5">${a.conteudo}</div><div style="font-size:10px;color:var(--text3);margin-top:8px">${fmtDateFull(a.criado_em)}</div></div>`).join('')}

function novaAnotacao(){openModal(`<h3>&#128221; Nova Anotação</h3><div class="modal-field"><label>Título</label><input type="text" id="not-titulo" placeholder="Título da nota"></div><div class="modal-field"><label>Conteúdo</label><textarea id="not-conteudo" placeholder="Escreva aqui..." style="min-height:120px"></textarea></div><div class="modal-field"><label>Cor</label><select id="not-cor"><option value="var(--gold)">&#127841; Amarelo</option><option value="var(--blue)">&#128309; Azul</option><option value="var(--green)">&#127802; Verde</option><option value="var(--red)">&#128308; Vermelho</option><option value="var(--purple)">&#128995; Roxo</option></select></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarAnotacao()">Salvar</button></div>`);}
async function salvarAnotacao(){const titulo=document.getElementById('not-titulo').value.trim();if(!titulo)return;try{const{error}=await sb.from('anotacoes').insert({titulo,conteudo:document.getElementById('not-conteudo').value,cor:document.getElementById('not-cor').value});if(error){alert('Erro ao salvar nota: '+error.message);return;}closeModal();renderAnotacoes();}catch(e){alert('Erro: '+e.message);}}

async function renderRelatorios(){

  document.getElementById('tab-content').innerHTML=`
  <div class="section-hdr"><div class="section-title">&#128200; Relatórios</div><button class="btn btn-primary btn-sm" onclick="imprimirRelatorio()">&#128424; Imprimir / PDF</button></div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:18px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
      <div><div style="font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase">Início</div><input type="date" id="filtro-inicio" value="${inicioMes}" style="padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:13px;"></div>

      <button class="btn btn-primary" onclick="aplicarFiltroRelatorio()">&#128269; Filtrar</button>
    </div>
  </div>
  <div id="relatorio-conteudo"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>`;
  await aplicarFiltroRelatorio();

function aplicarAtalhoFiltro(val){const hoje=new Date();let inicio,fim;if(val==='hoje'){inicio=fim=hojeLocalStr(hoje);}else if(val==='semana'){const s=new Date(hoje);s.setDate(hoje.getDate()-hoje.getDay());inicio=hojeLocalStr(s);fim=hojeLocalStr(hoje);}else if(val==='mes'){inicio=hojeLocalStr(new Date(hoje.getFullYear(),hoje.getMonth(),1));fim=hojeLocalStr(hoje);}else if(val==='tudo'){inicio='2020-01-01';fim=hojeLocalStr(hoje);}else return;document.getElementById('filtro-inicio').value=inicio;document.getElementById('filtro-fim').value=fim;}
async function aplicarFiltroRelatorio(){
  const dtInicio=document.getElementById('filtro-inicio')?.value;const dtFim=document.getElementById('filtro-fim')?.value;if(!dtInicio||!dtFim)return;
  const tsInicio=new Date(`${dtInicio}T00:00:00`).toISOString();const tsFim=new Date(`${dtFim}T23:59:59`).toISOString();
  const [{data:V},{data:VI},{data:P}]=await Promise.all([sb.from('vendas').select('*').gte('criado_em',tsInicio).lte('criado_em',tsFim).order('criado_em',{ascending:false}),sb.from('venda_itens').select('*'),sb.from('produtos').select('*')]);
  const vendasF=V||[];const idsV=new Set(vendasF.map(v=>v.id));const itensF=(VI||[]).filter(i=>idsV.has(i.venda_id));
  const totalV=vendasF.reduce((s,v)=>s+Number(v.total),0);const totalCusto=itensF.reduce((s,i)=>{const p=(P||[]).find(x=>i.nome.includes(x.nome));return s+(p?Number(p.custo)*i.qty:0);},0);
  const lucro=totalV-totalCusto;const margem=totalV>0?(lucro/totalV*100).toFixed(1):0;
  const porPag={};vendasF.forEach(v=>{porPag[v.pagamento]=(porPag[v.pagamento]||0)+Number(v.total);});
  const porProd={};itensF.forEach(i=>{if(!porProd[i.nome])porProd[i.nome]={qty:0,total:0};porProd[i.nome].qty+=i.qty;porProd[i.nome].total+=Number(i.total);});
  const ranking=Object.entries(porProd).sort((a,b)=>b[1].qty-a[1].qty);
  document.getElementById('relatorio-conteudo').innerHTML=`
  <div class="stats-grid">
    <div class="stat-card stat-gold"><div class="stat-label">Total Vendas</div><div class="stat-value">${fmt(totalV)}</div></div>
    <div class="stat-card stat-red"><div class="stat-label">Custo</div><div class="stat-value">${fmt(totalCusto)}</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Lucro</div><div class="stat-value">${fmt(lucro)}</div><div class="stat-sub">${margem}% margem</div></div>
    <div class="stat-card stat-blue"><div class="stat-label">Transações</div><div class="stat-value">${vendasF.length}</div><div class="stat-sub">ticket médio ${fmt(totalV/Math.max(1,vendasF.length))}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div class="table-wrap"><table><thead><tr><th colspan="2">Por Pagamento</th></tr></thead><tbody>${Object.entries(porPag).map(([k,v])=>`<tr><td><span class="badge badge-blue">${k.toUpperCase()}</span></td><td style="font-weight:600;color:var(--gold2)">${fmt(v)}</td></tr>`).join('')}</tbody></table></div>
    <div class="table-wrap"><table><thead><tr><th>Produto Mais Vendido</th><th>Qtd</th></tr></thead><tbody>${ranking.slice(0,8).map(([n,d],i)=>`<tr><td>${n}</td><td><span class="badge ${i===0?'badge-gold':i<3?'badge-green':'badge-blue'}">${d.qty}</span></td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Local</th><th>Total</th><th>Pgto</th><th>Operador</th><th class="no-print">Comp.</th></tr></thead>
    <tbody>${vendasF.map(v=>`<tr><td>${fmtDateFull(v.criado_em)}</td><td>${v.tipo}</td><td style="font-weight:600;color:var(--gold2)">${fmt(v.total)}</td><td><span class="badge badge-blue">${(v.pagamento||'').toUpperCase()}</span></td><td>${v.operador||''}</td><td class="no-print"><button class="btn btn-teal btn-xs" onclick="verComprovante(${v.id})">&#129534;</button></td></tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">Nenhuma venda no período</td></tr>`}</tbody>
  </table></div>`;
}

async function salvarSenhaOperador(id){
  const input=document.getElementById('op-senha-'+id);
  const novaSenha=input.value.trim();
  if(!novaSenha){alert('Digite a nova senha.');return;}
  try{
    const{error}=await sb.from('operadores_caixa').update({senha:novaSenha}).eq('id',id);
    if(error){alert('Erro ao salvar senha: '+error.message);return;}
    input.value='';
    const msg=document.getElementById('op-msg');
    msg.textContent='✓ Senha atualizada!';
    setTimeout(()=>{msg.textContent='';},3000);
  }catch(e){alert('Erro inesperado: '+e.message);}
}
async function removerOperador(id,nome){

    renderConfiguracoes();
  }catch(e){alert('Erro inesperado: '+e.message);}
}

async function registrarPerda(){
  let P=[];
  try{const{data,error}=await sb.from('produtos').select('*').order('nome');if(error)throw error;P=data||[];}catch(e){alert('Erro ao carregar produtos: '+e.message);return;}
  if(P.length===0){alert('Nenhum produto cadastrado ainda. Cadastre um produto antes de registrar perda.');return;}
  // Usa o dia que está sendo consultado no Caixa como padrão (funciona com caixa aberto ou fechado)
  const selData=document.getElementById('caixa-data-sel');
  const diaBase=selData&&selData.value?selData.value:hojeLocalStr();
  const agora=new Date();
  const horaAtual=`${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  openModal(`<h3 style="color:var(--red)">&#128465; Registrar Perda</h3>
  <div style="font-size:12px;color:var(--text2);margin-bottom:14px;background:var(--redl);border:1px solid rgba(192,57,43,0.3);border-radius:var(--radius-sm);padding:10px;">
    &#9888; A quantidade será <b style="color:var(--red)">descontada automaticamente</b> do estoque. A perda entra na contabilidade do <b style="color:var(--red)">dia escolhido abaixo</b>, mesmo com o caixa fechado.
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="modal-field"><label>Dia da Perda</label>
      <input type="date" id="prd-data" value="${diaBase}">
    </div>
    <div class="modal-field"><label>Horário</label>
      <input type="time" id="prd-hora" value="${horaAtual}">
    </div>
  </div>
  <div class="modal-field"><label>Produto</label>
    <select id="prd-prod" onchange="atualizarCustoPerdaProd(this)" style="width:100%;padding:9px;background:var(--bg3);border:1px solid rgba(192,57,43,0.3);border-radius:var(--radius-sm);color:var(--text);font-size:13px;">
      ${(P||[]).map(p=>`<option value="${p.id}" data-custo="${p.custo}" data-nome="${p.nome}" data-estoque="${p.estoque}">${p.emoji} ${p.nome} — Estoque: ${p.estoque}</option>`).join('')}
    </select>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="modal-field"><label>Quantidade Perdida</label>
      <input type="number" id="prd-qty" value="1" min="1" oninput="calcCustoPerda()">
    </div>
    <div class="modal-field"><label>Custo Unit. (R$)</label>
      <input type="number" id="prd-custo-unit" value="0" step="0.01" readonly style="background:var(--bg);color:var(--gold2);font-weight:600;cursor:default;">
    </div>
  </div>
  <div class="modal-field"><label>Custo Total da Perda</label>
    <input type="text" id="prd-custo-total" readonly value="R$ 0,00" style="background:var(--bg);color:var(--red);font-weight:700;font-size:15px;cursor:default;">
  </div>
  <div class="modal-field"><label>Motivo</label>
    <select id="prd-motivo" style="width:100%;padding:9px;background:var(--bg3);border:1px solid rgba(192,57,43,0.3);border-radius:var(--radius-sm);color:var(--text);font-size:13px;">
      <option value="Quebra">&#128466; Quebra</option>
      <option value="Congelamento">&#10052; Congelamento</option>
      <option value="Estouro">&#128165; Estouro</option>
      <option value="Vencimento">&#128197; Vencimento</option>
      <option value="Vazamento">&#128167; Vazamento</option>
      <option value="Avaria">&#9888; Avaria no transporte</option>
      <option value="Outro">&#10067; Outro</option>
    </select>
  </div>
  <div class="modal-field"><label>Observação (opcional)</label>
    <input type="text" id="prd-obs" placeholder="Ex: 2 garrafas quebradas na entrega...">
  </div>
  <div class="modal-actions">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-danger" onclick="confirmarPerda()">&#128465; Registrar Perda</button>
  </div>`);
  setTimeout(()=>{
    const sel=document.getElementById('prd-prod');
    if(sel)atualizarCustoPerdaProd(sel);
  },100);
}

function atualizarCustoPerdaProd(sel){
  const custo=parseFloat(sel.options[sel.selectedIndex].dataset.custo)||0;
  const cu=document.getElementById('prd-custo-unit');
  if(cu)cu.value=custo.toFixed(2);
  calcCustoPerda();
}

function calcCustoPerda(){
  const qty=parseInt(document.getElementById('prd-qty')?.value)||0;
  const custo=parseFloat(document.getElementById('prd-custo-unit')?.value)||0;
  const el=document.getElementById('prd-custo-total');
  if(el)el.value=fmt(qty*custo);
}

async function confirmarPerda(){
  const sel=document.getElementById('prd-prod');
  if(!sel||!sel.value){alert('Selecione um produto.');return;}
  const pid=parseInt(sel.value);
  const estoqueAtual=parseInt(sel.options[sel.selectedIndex].dataset.estoque)||0;
  const qty=parseInt(document.getElementById('prd-qty').value)||0;
  const custoUnit=parseFloat(document.getElementById('prd-custo-unit').value)||0;
  const motivo=document.getElementById('prd-motivo').value;
  const obs=document.getElementById('prd-obs')?.value?.trim()||'';
  const dataSel=document.getElementById('prd-data')?.value||hojeLocalStr();
  const horaSel=document.getElementById('prd-hora')?.value||'12:00';

  if(!pid){alert('Selecione um produto válido.');return;}
  if(qty<=0){alert('Informe uma quantidade válida.');return;}
  if(qty>estoqueAtual){
    if(!confirm(`Atenção: você está registrando ${qty} unidades como perda, mas o estoque atual é ${estoqueAtual}. Continuar mesmo assim?`))return;
  }

  // Monta o timestamp com o dia/hora escolhido, para a perda entrar na contabilidade do dia certo
  const criadoEm=new Date(`${dataSel}T${horaSel}:00`).toISOString();

  const btn=document.querySelector('.btn-danger[onclick="confirmarPerda()"]');
  if(btn){btn.disabled=true;btn.textContent='⏳ Salvando...';}

  try{
    const{data:prod,error:eProd}=await sb.from('produtos').select('*').eq('id',pid).single();
    if(eProd||!prod){alert('Produto não encontrado: '+(eProd?eProd.message:''));if(btn){btn.disabled=false;btn.textContent='🗑️ Registrar Perda';}return;}

    const custoTotal=qty*custoUnit;

    // 1. Registra a perda (com a data/hora escolhida)
    const{error:ePerda}=await sb.from('perdas').insert({
      produto:prod.nome,
      qty,
      custo_unit:custoUnit,
      custo_total:custoTotal,
      motivo,
      observacao:obs,
      operador:currentUser.nome,
      criado_em:criadoEm
    });
    if(ePerda){
      alert('Erro ao registrar perda: '+ePerda.message+'\n\nSe o erro mencionar "row-level security" ou "policy", acesse o Supabase → Editor SQL e rode:\nALTER TABLE perdas DISABLE ROW LEVEL SECURITY;');
      if(btn){btn.disabled=false;btn.textContent='🗑️ Registrar Perda';}
      return;
    }

    // 2. Desconta do estoque (Copão desconta dos componentes; produto comum desconta do próprio estoque)
    await descontarEstoqueItem(pid,qty);

    // 3. Log
    try{await registrarLog('PERDA',`${prod.nome} -${qty} un — Motivo: ${motivo} — Custo: ${fmt(custoTotal)} — Dia: ${dataSel}`);}catch(e){}

    closeModal();
    alert(`✅ Perda registrada!\n${qty}x ${prod.nome} (${motivo})\nDia: ${dataSel} ${horaSel}`);
    // Garante que a tela do dia mostrado reflita o dia da perda registrada
    const selData=document.getElementById('caixa-data-sel');
    if(selData)selData.value=dataSel;
    carregarCaixaDia();
  }catch(e){
    console.error('Erro confirmarPerda:',e);
    alert('Erro inesperado: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='🗑️ Registrar Perda';}
  }
}

async function excluirPerda(id,qty){
  try{
    // Buscar a perda pelo id para pegar produto
    const{data:perda}=await sb.from('perdas').select('*').eq('id',id).single();
    if(perda){
      // Estorna ao estoque
      const{data:prod}=await sb.from('produtos').select('*').ilike('nome',perda.produto).maybeSingle();
      if(prod)await devolverEstoqueItem(prod.id,qty);
      try{await registrarLog('EXCLUIU PERDA',`${perda.produto} +${qty} un (estorno)`);}catch(e){}
    }
    await sb.from('perdas').delete().eq('id',id);
    alert('✅ Perda excluída. Estoque restaurado.');
    carregarCaixaDia();
  }catch(e){alert('Erro ao excluir perda: '+e.message);}
}


async function initTabelas(){
  // Tabelas criadas manualmente no Supabase SQL Editor
  // exec_sql não funciona sem função customizada no banco
  await carregarEstadoCaixa();
}
initTabelas();
</script>
