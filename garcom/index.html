<!DOCTYPE html>

<style>
:root{--bg:#0a0c12;--bg2:#12151f;--bg3:#1a1e2e;--card:#161928;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--gold:#d4a017;--gold2:#f0c040;--goldl:rgba(212,160,23,.14);--green:#27ae60;--red:#e0523f;--redl:rgba(224,82,63,.14);--text:#f0f2fa;--text2:#9096b5;--text3:#5d6383;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;min-height:60px}
.top h1{font-size:16px;font-weight:700;line-height:1.2}
.top small{display:block;font-size:12px;font-weight:400;color:var(--text2);margin-top:2px}
.top .sair{flex:none;height:36px;padding:0 11px;border-radius:9px;background:var(--bg3);color:var(--text2);font-size:13px;font-weight:600}
.top h1{margin-right:auto;min-width:0}
.top .tot{margin-left:auto;font-size:18px;font-weight:700;color:var(--gold2);white-space:nowrap}
.back{width:40px;height:40px;border-radius:10px;background:var(--bg3);font-size:20px;flex:none}
.tabs{display:flex;gap:6px;padding:10px 16px;background:var(--bg);position:sticky;top:60px;z-index:4}
.tabs button{flex:1;height:42px;border-radius:10px;background:var(--bg3);color:var(--text2);font-weight:600;font-size:14px}
.tabs button.on{background:var(--goldl);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}
main{padding:6px 16px calc(32px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.grid-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.m{background:var(--card);border:1px solid var(--border);border-radius:12px;min-height:82px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.m b{font-size:20px}
.m span{font-size:12px;color:var(--text3)}
.m .cl{font-style:normal;font-size:12px;font-weight:600;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .cl[hidden]{display:none}
.nome-mesa{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-top:8px}
.nome-mesa input{display:block;width:100%;height:46px;margin-top:8px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);padding:0 14px;outline:none;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text)}
.nome-mesa input:focus{border-color:var(--gold)}
.m.oc{background:var(--goldl);border-color:var(--gold)}
.m.oc span{color:var(--gold2);font-weight:700}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:18px 0 8px}
.lines{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.line{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:0}
.line .n{flex:1;min-width:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.line .n small{display:block;font-weight:400;color:var(--text2);font-size:12px;margin-top:2px}
.line .v{font-weight:700;white-space:nowrap}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:38px;height:38px;border-radius:9px;background:var(--bg3);font-size:20px;font-weight:700}
.step .mi{color:var(--red)}.step .pl{color:var(--green)}
.step i{font-style:normal;font-weight:700;width:28px;text-align:center}
.empty{padding:22px 14px;text-align:center;color:var(--text2);font-size:14px}
input.busca{width:100%;height:46px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);padding:0 14px;outline:none;font-size:16px}
input.busca:focus{border-color:var(--gold)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:36px;padding:0 13px;border-radius:18px;background:var(--bg3);color:var(--text2);font-size:13px;font-weight:600}
.cats button.on{background:var(--gold);color:#17120a}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.p{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.p:active{background:var(--bg3)}
.p .nm{font-size:13px;font-weight:600;line-height:1.25;padding-right:22px;overflow-wrap:anywhere}
.p .pr{font-size:14px;font-weight:700;color:var(--gold2)}
.p .pr.promo{color:#ff7a66}
.p .q[hidden]{display:none}
.p .q{position:absolute;top:7px;right:7px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--gold);color:#17120a;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.big{display:block;width:100%;height:56px;border-radius:12px;font-weight:700;font-size:16px}
.big.go{background:var(--green);color:#fff}
.big.stop{background:var(--redl);color:#ff8878;box-shadow:inset 0 0 0 1px var(--red)}
.big.gold{background:var(--gold);color:#17120a}
.big:disabled{opacity:.55}
.hero{padding:42px 12px 18px;text-align:center}
.hero h2{font-size:22px;margin-bottom:8px}
.hero p{color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px}
.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.tr .t{min-width:0}
.tr .t b{display:block;font-size:14px}
.tr .t small{display:block;color:var(--text2);font-size:12px;margin-top:3px}
.tr button{flex:none;height:42px;padding:0 15px;border-radius:9px;background:var(--goldl);color:var(--gold2);font-weight:700;box-shadow:inset 0 0 0 1px var(--gold)}
.sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:6px}
.sum b{font-size:24px;color:var(--gold2)}
.sum small{display:block;color:var(--text2);font-size:12px;margin-top:3px}
.btns{display:grid;gap:8px;margin-top:18px}
.net{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:#3a2a10;color:var(--gold2);border:1px solid var(--gold);border-radius:18px;padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap}
.toast{position:fixed;left:16px;right:16px;bottom:calc(52px + env(safe-area-inset-bottom));z-index:12;background:#2b1512;color:#ffb3a8;border:1px solid var(--red);border-radius:10px;padding:12px;font-size:14px;text-align:center}
.toast.ok{background:#10281a;color:#8fe0ad;border-color:var(--green)}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.pgs button{height:58px;border-radius:11px;background:var(--bg3);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--border2)}
.pgs button.on{background:var(--goldl);color:var(--gold2);box-shadow:inset 0 0 0 2px var(--gold)}
.big.fm{background:var(--green);color:#fff;margin-top:10px}
.big.fm[hidden]{display:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.duo div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px}
.duo div.pr{border-color:var(--gold)}
.duo small{display:block;color:var(--text2);font-size:12px;margin-bottom:4px}
.duo b{font-size:20px}.duo .pr b{color:var(--gold2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px;width:100%;max-width:400px}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:6px}
.modal .val{font-size:26px;font-weight:700;color:var(--gold2);margin:10px 0 16px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal .row button{height:50px;border-radius:10px;font-weight:700}
.modal .row button:disabled{opacity:.45}
.modal .no{background:var(--bg3)}.modal .yes{background:var(--red);color:#fff}
.login{max-width:400px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 20px 32px;display:flex;flex-direction:column;gap:10px}
.login .marca{text-align:center;margin:10px 0 18px}
.login .marca b{display:block;font-size:26px;color:var(--gold2)}
.login .marca span{display:block;margin-top:5px;color:var(--text2);font-size:14px}
.login .qsm{color:var(--text2);font-size:13px;font-weight:600}
.pessoa{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:15px}
.pessoa b{display:block;font-size:16px}.pessoa small{display:block;margin-top:3px;color:var(--text2);font-size:12px}
.login label{display:block;font-size:13px;font-weight:600;color:var(--text2)}
.login input{display:block;width:100%;height:50px;margin-top:6px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);padding:0 14px;font-size:16px;outline:none;color:var(--text)}
.login input:focus{border-color:var(--gold)}
.login .erro{min-height:20px;color:#ff8878;font-size:13px}
.login .volta{align-self:flex-start;color:var(--text2);font-size:14px;height:36px}
.load{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--text2);text-align:center;padding:20px;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div id="app"><div class="load">Carregando...</div></div>
<div id="extras"></div>
<script>
'use strict';
const SUPABASE_URL='https://akicvaywryppktjiccpi.supabase.co';
const SUPABASE_KEY='sb_publishable_KlSN5wVH24AYhF7kjEU0pg_NnVl2SQg';
const TZ='America/Fortaleza',TOTAL_MESAS=29,PEND_KEY='malte_garcom_pendentes',TOKEN_KEY='malte_garcom_sessao';
const app=document.getElementById('app'),extras=document.getElementById('extras');
let sb=null,produtos=[],turno=null,linhas=[],historico=[];
let tela='mesas',mesaSel=null,catSel='Todos',busca='',modal=null,toastTxt='',toastT=null;
let ultimaEstrutura='',ultimaAssinatura='';
const PAGS=[['dinheiro','Dinheiro'],['debito','Débito'],['credito','Crédito'],['pix','Pix']];
let extrato=null,extratoDe=null,nomesMesa={},salvandoNome=Promise.resolve(),vendidas=[],fechamentos=[],pagSel=new Set(),fechandoMesa=false,ultimoExtras=null,toastOk=false;
let token=lerToken(),usuario=null,usuariosLogin=[],loginSel=null,loginErro='',loginEnviando=false,equipe=null,modalAlvo=null,timers=[];
let pend=lerPend(),enviando=false,seq=0,erroRede=false,iniciando=false,fechando=false;

function lerToken(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}}
function salvarToken(t){token=t;try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
async function rpc(fn,args){
  const{data,error}=await sb.rpc(fn,{p_token:token,...(args||{})});
  if(error){if(error.code==='GA401'){perderSessao();}throw error}
  return data;
}
function lerPend(){try{return JSON.parse(localStorage.getItem(PEND_KEY)||'[]')}catch(e){return[]}}
function salvarPend(){try{localStorage.setItem(PEND_KEY,JSON.stringify(pend))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fmtData(d){return new Date(d).toLocaleDateString('pt-BR',{timeZone:TZ})}
function fmtHora(d){return new Date(d).toLocaleTimeString('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'})}
function fmtDH(d){return fmtData(d)+' às '+fmtHora(d)}
function novoUid(){return(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))}
function precoDe(p){return p.em_promo&&p.preco_promo?Number(p.preco_promo):Number(p.preco)}
function nomeLimpo(n){return String(n||'').trim()}
function mostrarToast(t,ok){toastOk=!!ok;toastTxt=t;clearTimeout(toastT);toastT=setTimeout(()=>{toastTxt='';desenharExtras()},4500);desenharExtras()}

// ---------- dados ----------
function chave(l){return l.mesa+'|'+(l.prod_id==null?'':l.prod_id)+'|'+l.nome+'|'+Number(l.preco)}
function linhasAtuais(){
  const m=new Map();
  for(const l of linhas)m.set(chave(l),{...l,preco:Number(l.preco),qty:Number(l.qty)});
  if(turno)for(const p of pend){
    if(p.turno_id!==turno.id)continue;
    const k=chave(p),a=m.get(k);
    if(a)a.qty+=p.delta;else m.set(k,{mesa:p.mesa,prod_id:p.prod_id,nome:p.nome,preco:Number(p.preco),qty:p.delta});
  }
  return[...m.values()].filter(l=>l.qty>0);
}
const totalDe=L=>L.reduce((s,l)=>s+l.qty*l.preco,0);
const itensDe=L=>L.reduce((s,l)=>s+l.qty,0);

async function carregarProdutos(){
  const{data,error}=await sb.from('produtos').select('id,nome,cat,emoji,preco,em_promo,preco_promo').order('nome');
  if(error)throw error;
  produtos=(data||[]).filter(p=>Number(p.preco)>0||(p.em_promo&&Number(p.preco_promo)>0));
}
function aplicarEstado(d){linhas=d.linhas||[];vendidas=(d.vendidas||[]).map(v=>({...v,preco:Number(v.preco),qty:Number(v.qty)}));fechamentos=d.fechamentos||[];nomesMesa={};for(const n of d.nomes||[])nomesMesa[n.mesa]=n.nome}
const totalVendido=()=>fechamentos.reduce((s,f)=>s+Number(f.total),0);
const nomePag=k=>(PAGS.find(p=>p[0]===k)||[k,k])[1];
const pagTexto=a=>(a||[]).map(nomePag).join(' + ');
function porPagamento(F){
  const m=new Map();
  for(const f of F){const k=pagTexto(f.pagamentos),a=m.get(k)||{nome:k,mesas:0,total:0};a.mesas++;a.total+=Number(f.total);m.set(k,a)}
  return[...m.values()].sort((a,b)=>b.total-a.total);
}
async function carregarHistorico(){historico=await rpc('garcom_historico')||[]}
async function atualizar(){
  if(!sb||!token||document.hidden)return;
  const ini=seq;
  try{
    const d=await rpc('garcom_estado');
    if(ini!==seq||enviando)return;
    usuario=d.usuario;
    if(turno&&!d.turno&&!fechando){await carregarHistorico();mesaSel=null;tela='mesas';mostrarToast('A venda foi fechada em outro aparelho.')}
    turno=d.turno;aplicarEstado(d);erroRede=false;
    if(tela==='salario'||tela==='extrato'){const ant=extrato;await carregarExtrato(extratoDe);if(JSON.stringify(ant)!==JSON.stringify(extrato))ultimaAssinatura=''}
    desenhar();
  }catch(e){if(token){erroRede=true;desenharExtras()}}
}
function lancar(mesa,prod_id,nome,preco,delta){
  if(!turno)return;
  pend.push({uid:novoUid(),turno_id:turno.id,mesa,prod_id,nome,preco:Number(preco),delta});
  salvarPend();desenhar();enviar();
}
async function enviar(){
  if(enviando||!pend.length||!sb||!token)return;
  enviando=true;
  const lote=pend.slice(0,50);
  try{
    try{await rpc('garcom_lancar',{p_itens:lote})}
    catch(error){
      if(error.code==='P0001'||/venda fechada/i.test(error.message||'')){
        const ids=new Set(lote.map(x=>x.uid));
        pend=pend.filter(x=>!ids.has(x.uid));salvarPend();
        mostrarToast('Esse lançamento não entrou porque a venda já foi fechada.');
        enviando=false;await atualizar();return;
      }
      if(error.code==='GA401'){enviando=false;return}
      throw error;
    }
    // confirma no servidor antes de tirar da fila, para o total não oscilar
    const d=await rpc('garcom_estado');
    const ids=new Set(lote.map(x=>x.uid));
    pend=pend.filter(x=>!ids.has(x.uid));salvarPend();
    aplicarEstado(d);seq++;erroRede=false;
    enviando=false;desenhar();
    if(pend.length)enviar();
  }catch(e){
    enviando=false;erroRede=true;desenharExtras();
    setTimeout(enviar,2500);
  }
}
async function aguardarEnvio(){
  for(let i=0;i<24&&(pend.length||enviando);i++){
    if(!enviando)enviar();
    await new Promise(r=>setTimeout(r,250));
  }
  return!pend.length;
}

// ---------- ações ----------
window.iniciarVenda=async function(){
  if(iniciando)return;iniciando=true;desenhar();
  try{
    await rpc('garcom_iniciar');
    tela='mesas';mesaSel=null;
  }catch(e){mostrarToast('Não consegui iniciar a venda. Confira a internet e tente de novo.')}
  iniciando=false;await atualizar();desenhar();
};
window.salvarNomeMesa=function(el){
  const mesa=Number(el.dataset.mesa),n=el.value.replace(/\s+/g,' ').trim();
  if(!turno||(nomesMesa[mesa]||'')===n)return;
  if(n)nomesMesa[mesa]=n;else delete nomesMesa[mesa];
  const tid=turno.id;
  salvandoNome=salvandoNome.then(async()=>{
    try{await rpc('garcom_nome_mesa',{p_turno:tid,p_mesa:mesa,p_nome:n});seq++}
    catch(e){if(e.code!=='GA401')mostrarToast('Não consegui salvar o nome. Confira a internet e digite de novo.')}
  });
};
window.pedirFecharMesa=async function(){const a=document.activeElement;if(a&&a.id==='nome-mesa')a.blur();await salvandoNome;pagSel=new Set();modal='mesa';desenharExtras()};
window.togglePag=function(k){pagSel.has(k)?pagSel.delete(k):pagSel.add(k);desenharExtras()};
window.confirmarFecharMesa=async function(){
  if(fechandoMesa||!pagSel.size)return;
  const mesa=mesaSel;fechandoMesa=true;desenharExtras();
  try{
    if(!await aguardarEnvio())throw new Error('pendente');
    await salvandoNome;
    const cli=nomesMesa[mesa];
    const r=await rpc('garcom_fechar_mesa',{p_turno:turno.id,p_mesa:mesa,p_pagamentos:[...pagSel]});
    modal=null;mesaSel=null;fechandoMesa=false;
    mostrarToast('Mesa '+mesa+(cli?' ('+cli+')':'')+' fechada: '+brl(r.total),true);
    seq++;await atualizar();desenhar();scrollTo(0,0);
    return;
  }catch(e){
    modal=null;
    mostrarToast(e.message==='pendente'?'Ainda há lançamentos sem enviar. Espere a internet voltar e feche de novo.':e.code==='GA404'?'Essa mesa já foi fechada em outro aparelho.':'Não consegui fechar a mesa. Tente de novo.');
    if(e.code==='GA404'){mesaSel=null;await atualizar()}
  }
  fechandoMesa=false;desenharExtras();
};
window.pedirFechar=function(){modal='fechar';desenharExtras()};
window.cancelarModal=function(){modal=null;desenharExtras()};
window.confirmarFechar=async function(){
  if(fechando)return;fechando=true;desenharExtras();
  try{
    if(!await aguardarEnvio())throw new Error('pendente');
    await rpc('garcom_fechar',{p_turno:turno.id});
    modal=null;mesaSel=null;linhas=[];vendidas=[];fechamentos=[];turno=null;tela='relatorios';
    await carregarHistorico();
    fechando=false;await atualizar();desenhar();desenharExtras();
    return;
  }catch(e){
    modal=null;
    mostrarToast(e.message==='pendente'?'Ainda há lançamentos sem enviar. Espere a internet voltar e feche de novo.':e.code==='GA409'?'Ainda há mesas abertas. Feche todas antes de fechar a venda.':'Não consegui fechar a venda. Tente de novo.');
  }
  fechando=false;desenharExtras();

    return;
  }
  const novo=u.primeiro_acesso;
  app.innerHTML=`<form class="login" id="f-login" autocomplete="on"><button type="button" class="volta" data-volta="1">‹ Trocar usuário</button><div class="marca"><b>${esc(u.nome)}</b><span>${novo?'Primeiro acesso: crie sua senha':'Digite sua senha'}</span></div>
    ${novo&&u.precisa_codigo?`<label>Código de ativação<input id="l-cod" autocapitalize="characters" autocomplete="off" required></label>`:''}
    <label>${novo?'Nova senha (mínimo 6 caracteres)':'Senha'}<input id="l-s1" type="password" autocomplete="${novo?'new-password':'current-password'}" required></label>
    ${novo?`<label>Repita a senha<input id="l-s2" type="password" autocomplete="new-password" required></label>`:''}
    <div class="erro" id="l-erro" role="alert">${esc(loginErro)}</div>
    <button class="big gold" id="l-ok" ${loginEnviando?'disabled':''}>${novo?'Criar senha e entrar':'Entrar'}</button></form>`;
  const c=document.getElementById(novo&&u.precisa_codigo?'l-cod':'l-s1');if(c)c.focus();
}
function erroLogin(t){loginErro=t;const e=document.getElementById('l-erro');if(e)e.textContent=t}
async function enviarLogin(){
  if(loginEnviando)return;
  const u=usuariosLogin.find(x=>x.id===loginSel);if(!u)return;
  const s1=document.getElementById('l-s1').value,s2=document.getElementById('l-s2'),cod=document.getElementById('l-cod');
  erroLogin('');
  if(u.primeiro_acesso){
    if(s1.length<6)return erroLogin('A senha precisa ter pelo menos 6 caracteres.');
    if(s2.value!==s1)return erroLogin('As duas senhas não são iguais.');
  }
  const btn=document.getElementById('l-ok');loginEnviando=true;btn.disabled=true;
  try{
    const{data,error}=u.primeiro_acesso?await sb.rpc('garcom_primeiro_acesso',{p_usuario:u.id,p_senha:s1,p_codigo:cod?cod.value:null}):await sb.rpc('garcom_entrar',{p_usuario:u.id,p_senha:s1});
    if(error)throw error;
    if(!data.ok){erroLogin(data.erro);return}
    salvarToken(data.token);loginSel=null;loginErro='';
    await entrarNoApp();
  }catch(e){erroLogin('Não consegui conectar. Confira a internet.')}
  finally{loginEnviando=false;const b=document.getElementById('l-ok');if(b)b.disabled=false}
}

function telaExtrato(){

function desenhar(){

  const assinatura=estrutura+(tela==='extrato'||tela==='salario'?JSON.stringify(extrato):'')+JSON.stringify(L)+(tela==='resumo'?JSON.stringify(fechamentos):'')+(tela==='equipe'?JSON.stringify(equipe):'');
  if(assinatura===ultimaAssinatura){desenharExtras();return}
  ultimaEstrutura=estrutura;ultimaAssinatura=assinatura;
  if(tela==='extrato'||(tela==='salario'&&!turno)){
    app.innerHTML=`${topo(extratoDe?'Salário':'Meu salário',usuario.nome)}<main><button class="big" style="background:var(--bg3);margin-top:10px" onclick="irTela('${extratoDe?'equipe':'mesas'}')">Voltar</button>${telaExtrato()}</main>`;
    desenharExtras();return;
  }
  if(!turno&&tela==='equipe'){
    app.innerHTML=`${topo('Equipe',usuario.nome)}<main><button class="big" style="background:var(--bg3);margin-top:10px" onclick="irTela('mesas')">Voltar</button>${telaEquipe()}</main>`;
    desenharExtras();return;
  }
  if(!turno&&tela!=='relatorios'){
    app.innerHTML=`${topo('Malte · Garçom',usuario.nome+' · nenhuma venda aberta')}<main><div class="hero"><h2>Pronto para começar?</h2><p>Inicie a venda para liberar as mesas. Isso não mexe no estoque nem no caixa da Malte.</p><button class="big go" onclick="iniciarVenda()" ${iniciando?'disabled':''}>${iniciando?'Iniciando...':'Iniciar venda'}</button></div><button class="big" style="background:var(--bg3)" onclick="irTela('relatorios')">Ver relatórios</button>${usuario.perfil==='mae'?`<button class="big" style="background:var(--bg3);margin-top:8px" onclick="irTela('equipe')">Equipe</button>`:''}${usuario.tem_extrato?`<button class="big" style="background:var(--bg3);margin-top:8px" onclick="irTela('salario')">Meu salário</button>`:''}</main>`;
    desenharExtras();return;
  }
  if(!turno){
    app.innerHTML=`${topo('Relatórios',usuario.nome+' · nenhuma venda aberta')}<main><div class="btns" style="margin:10px 0 0"><button class="big go" onclick="iniciarVenda()" ${iniciando?'disabled':''}>${iniciando?'Iniciando...':'Iniciar nova venda'}</button></div>${telaRelatorios()}</main>`;
    desenharExtras();return;
  }
  const sub=usuario.nome+' · aberta às '+fmtHora(turno.aberto_em);
  if(mesaSel){
    const y=scrollY;
    app.innerHTML=`${topo('Mesa '+mesaSel,itensDe(L.filter(l=>l.mesa===mesaSel))+' itens',totalDe(L.filter(l=>l.mesa===mesaSel)),true)}<main>${telaMesa(L)}</main>`;
    scrollTo(0,y);
  }else{
    const y=scrollY;
    const c=tela==='resumo'?telaResumo(L):tela==='relatorios'?telaRelatorios():tela==='equipe'?telaEquipe():tela==='salario'?telaExtrato():telaMesas(L);
    app.innerHTML=`${topo('Malte · Garçom',sub,totalDe(L)+totalVendido())}${abas()}<main>${c}</main>`;
    scrollTo(0,y);
  }
  desenharExtras();
}

  if(modal==='fechar'&&turno){
    const ab=[...new Set(linhasAtuais().map(l=>l.mesa))].sort((a,b)=>a-b);
    h+=ab.length?`<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>Ainda há mesas abertas</h3><p style="margin-bottom:16px">Feche ${ab.length===1?'a mesa':'as mesas'} ${ab.join(', ')} antes de fechar a venda.</p><div class="row" style="grid-template-columns:1fr"><button class="no" onclick="cancelarModal()">Entendi</button></div></div></div>`:`<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>Fechar a venda?</h3><p>Depois de fechar, ninguém mais lança nesta venda. O relatório fica salvo em Relatórios.</p><div class="val">${brl(totalVendido())}</div><div class="row"><button class="no" onclick="cancelarModal()" ${fechando?'disabled':''}>Voltar</button><button class="yes" onclick="confirmarFechar()" ${fechando?'disabled':''}>${fechando?'Fechando...':'Fechar venda'}</button></div></div></div>`;
  }
  if(modal==='mesa'&&turno&&mesaSel){
    const M=linhasAtuais().filter(l=>l.mesa===mesaSel);
    h+=`<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>Fechar mesa ${mesaSel}${nomesMesa[mesaSel]?' · '+esc(nomesMesa[mesaSel]):''}</h3><p>Selecione como pagaram. Pode marcar mais de uma forma.</p><div class="val">${brl(totalDe(M))}</div><div class="pgs">${PAGS.map(([k,n])=>`<button class="${pagSel.has(k)?'on':''}" onclick="togglePag('${k}')" aria-pressed="${pagSel.has(k)}">${n}</button>`).join('')}</div><div class="row"><button class="no" onclick="cancelarModal()" ${fechandoMesa?'disabled':''}>Voltar</button><button class="yes" style="background:var(--green)" onclick="confirmarFecharMesa()" ${fechandoMesa||!pagSel.size?'disabled':''}>${fechandoMesa?'Fechando...':'Fechar mesa'}</button></div></div></div>`;
  }
  if(modal==='sair')h+=`<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>Sair da conta?</h3><p style="margin-bottom:16px">Você vai precisar da senha para entrar de novo.</p><div class="row"><button class="no" onclick="cancelarModal()">Voltar</button><button class="yes" onclick="confirmarSair()">Sair</button></div></div></div>`;
  if(modal==='reset'&&modalAlvo)h+=`<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>Criar nova senha?</h3><p style="margin-bottom:16px">${esc(modalAlvo.nome)} sai da conta e cria outra senha no próximo acesso.</p><div class="row"><button class="no" onclick="cancelarModal()">Voltar</button><button class="yes" onclick="confirmarReset()">Confirmar</button></div></div></div>`;
  if(h!==ultimoExtras){extras.innerHTML=h;ultimoExtras=h}
}

// botões cujos dados vêm do banco usam atributos, nunca texto dentro de onclick
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.u!=null){loginSel=Number(b.dataset.u);loginErro='';desenharLogin();return}
  if(b.dataset.volta){loginSel=null;loginErro='';desenharLogin();return}
  if(b.dataset.extrato!=null){verExtrato(Number(b.dataset.extrato));return}
  if(b.dataset.reset!=null){pedirReset(Number(b.dataset.reset),b.dataset.nome);return}
  if(b.dataset.p!=null)addProd(Number(b.dataset.p));
  else if(b.dataset.m!=null)abrirMesa(Number(b.dataset.m));
  else if(b.dataset.k!=null)ajustar(b.dataset.k,Number(b.dataset.d));
  else if(b.dataset.cat!=null)setCat(b.dataset.cat);
});

// ---------- PDF ----------
window.baixarPDF=async function(id){
  if(!(window.jspdf&&window.jspdf.jsPDF)){mostrarToast('Não consegui carregar o gerador de PDF. Confira a internet.');return}
  try{
    await aguardarEnvio();
    const rel=await rpc('garcom_relatorio',{p_turno:id});
    const t=rel.turno;
    const L=(rel.linhas||[]).map(l=>({...l,preco:Number(l.preco),qty:Number(l.qty)}));
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const txt=s=>String(s).replace(/[^ -ÿ]/g,'').trim();
    const gold=[150,108,8],dark=[28,30,40],cinza=[110,112,125];
    const F=rel.fechamentos||[],aberto=L.filter(l=>l.fechamento_id==null),fechada=!!t.fechado_em;
    const vendidoL=fechada?L:L.filter(l=>l.fechamento_id!=null),vendido=totalDe(vendidoL);
    const m=v=>brl(v).replace(/\u00A0/g,' ');
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(...dark);doc.text('Malte Distribuidora',14,18);
    doc.setFontSize(12);doc.setTextColor(...gold);doc.text('Controle do garçom',14,25);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...cinza);
    doc.text('Início: '+fmtDH(t.aberto_em)+(t.aberto_por?' ('+t.aberto_por+')':''),14,33);
    doc.text(fechada?'Fim: '+fmtDH(t.fechado_em)+(t.fechado_por?' ('+t.fechado_por+')':''):'VENDA EM ANDAMENTO, parcial de '+fmtDH(Date.now()),14,38.5);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...cinza);doc.text('VENDIDO',196,18,{align:'right'});
    doc.setFontSize(18);doc.setTextColor(...dark);doc.text(m(vendido),196,26,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...cinza);
    doc.text(itensDe(vendidoL)+' itens · '+F.length+' mesas fechadas',196,33,{align:'right'});
    if(!fechada&&aberto.length)doc.text('Em aberto: '+m(totalDe(aberto)),196,38.5,{align:'right'});
    const estilo={theme:'grid',styles:{fontSize:10,cellPadding:2.2,textColor:dark,lineColor:[215,216,222],lineWidth:.15},headStyles:{fillColor:[32,35,48],textColor:255,fontStyle:'bold'},margin:{left:14,right:14},footStyles:{fillColor:[244,239,224],textColor:dark,fontStyle:'bold'}};
    const col4={1:{halign:'right',cellWidth:18},2:{halign:'right',cellWidth:30},3:{halign:'right',cellWidth:32}};
    const titulo=(tx,y)=>{if(y>262){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...dark);doc.text(tx,14,y);return y+3};
    let y=titulo('Pagamentos',48);
    const P=porPagamento(F);
    doc.autoTable({...estilo,startY:y,head:[['Forma','Mesas','Total']],body:P.length?P.map(g=>[g.nome,g.mesas,m(g.total)]):[['Nenhuma mesa fechada','','']],foot:[['Total',F.length,m(F.reduce((s,f)=>s+Number(f.total),0))]],showFoot:'lastPage',columnStyles:{1:{halign:'right',cellWidth:18},2:{halign:'right',cellWidth:32}}});
    y=titulo('Vendido por produto',doc.lastAutoTable.finalY+10);
    const G=agruparProdutos(vendidoL);
    doc.autoTable({...estilo,startY:y,head:[['Produto','Qtd','Preço','Total']],body:G.length?G.map(g=>[txt(g.nome),g.qty,m(g.preco),m(g.qty*g.preco)]):[['Nada vendido','','','']],foot:[['Total',itensDe(vendidoL),'',m(vendido)]],showFoot:'lastPage',columnStyles:col4});
    const corpo=[],nomesRel={};for(const x of rel.nomes||[])nomesRel[x.mesa]=x.nome;
    const cab=(tx,val)=>[{content:tx,colSpan:3,styles:{fontStyle:'bold',fillColor:[244,239,224]}},{content:val,styles:{fontStyle:'bold',halign:'right',fillColor:[244,239,224]}}];
    for(const f of F){
      corpo.push(cab('Mesa '+f.mesa+(f.cliente?' · '+txt(f.cliente):'')+' · '+fmtHora(f.criado_em)+' · '+pagTexto(f.pagamentos),m(f.total)));
      for(const l of L.filter(x=>x.fechamento_id===f.id))corpo.push([txt(l.nome),l.qty,m(l.preco),m(l.qty*l.preco)]);
    }
    for(const n of [...new Set(aberto.map(l=>l.mesa))].sort((a,b)=>a-b)){
      const M=aberto.filter(l=>l.mesa===n);
      corpo.push(cab('Mesa '+n+(nomesRel[n]?' · '+txt(nomesRel[n]):'')+' · '+(fechada?'sem pagamento registrado':'em aberto'),m(totalDe(M))));
      for(const l of M)corpo.push([txt(l.nome),l.qty,m(l.preco),m(l.qty*l.preco)]);
    }
    if(corpo.length){
      y=titulo('Por mesa',doc.lastAutoTable.finalY+10);
      doc.autoTable({...estilo,startY:y,head:[['Produto','Qtd','Preço','Total']],body:corpo,columnStyles:col4});
    }
    const pgs=doc.internal.getNumberOfPages();
    for(let i=1;i<=pgs;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...cinza);doc.text('Controle interno. Não altera estoque nem caixa do sistema.',14,289);doc.text('Página '+i+' de '+pgs,196,289,{align:'right'})}
    const nomeData=new Date(t.aberto_em).toLocaleDateString('en-CA',{timeZone:TZ});
    doc.save('garcom_'+nomeData+'_venda-'+t.id+'.pdf');
  }catch(e){console.error(e);mostrarToast('Não consegui gerar o PDF. Tente de novo.')}
};

// ---------- início ----------
async function iniciar(){
  try{
    if(typeof supabase==='undefined')throw new Error('sem-lib');
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    await carregarProdutos();
    if(token){
      try{await entrarNoApp()}catch(e){if(token)throw e}
      if(token&&!usuario)throw new Error('sem-conexao');
      if(!token)return;
    }else abrirLogin();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token){atualizar();enviar()}});
  }catch(e){
    console.error(e);
    app.innerHTML='<div class="load"><div>Não consegui conectar. Confira a internet.</div><button class="big gold" style="max-width:220px" onclick="location.reload()">Tentar de novo</button></div>';
  }
}
iniciar();
</script>
